    DgfipTaxReportSetting:
      type: object
      description: '[BETA] Represents a tax report settings for DGFiP (France) as an object'
      required:
        - start_date
        - type_operation
      properties:
        code:
          type: string
          example: dgfip
          description: The Tax Report Authority code.
          enum:
            - dgfip
        start_date:
          type: string
          format: date-time
          example: '2025-04-29T00:00:00.000Z'
          description: Date when the Tax Report Setting was enabled. If not provided, the current date and time will be used.
        auto_generate:
          type: boolean
          example: true
          default: true
          description: Generate the Tax Report automatically
        auto_send:
          type: boolean
          example: true
          default: true
          description: Send the Tax Report automatically
        enabled:
          type: boolean
          example: true
          default: true
          description: Represents if the tax report setting is enabled
        type_operation:
          type: string
          example: services
          description: Default DGFiP Type of Operation.
          enum:
            - services
            - goods
            - mixed
        reason_vat_exempt:
          type: string
          example: VATEX-FR-FRANCHISE
          description: |
            DGFiP reason code for VAT Exemption (BT-121).
            Required when invoice contains exempt tax lines (category E).
            Defaults to VATEX-FR-FRANCHISE if not specified.
          enum:
            - VATEX-FR-FRANCHISE
            - VATEX-FR-CNWVAT
            - VATEX-FR-CGI261-1
            - VATEX-FR-CGI261-2
            - VATEX-FR-CGI261-3
            - VATEX-FR-CGI261-4
            - VATEX-FR-CGI261-5
            - VATEX-FR-CGI261-7
            - VATEX-FR-CGI261-8
            - VATEX-FR-CGI261A
            - VATEX-FR-CGI261B
            - VATEX-FR-CGI261C-1
            - VATEX-FR-CGI261C-2
            - VATEX-FR-CGI261C-3
            - VATEX-FR-CGI261D-1
            - VATEX-FR-CGI261D-1BIS
            - VATEX-FR-CGI261D-2
            - VATEX-FR-CGI261D-3
            - VATEX-FR-CGI261D-4
            - VATEX-FR-CGI261E-1
            - VATEX-FR-CGI261E-2
            - VATEX-FR-CGI277A
            - VATEX-FR-CGI275
            - VATEX-FR-298SEXDECIESA
            - VATEX-FR-CGI295
            - VATEX-FR-AE
            - null
          nullable: true
        enterprise_size:
          type: string
          example: pme
          description: |
            Enterprise size category as defined by French LME 2008 law (Décret 2008-1354).
            Determines the e-invoicing obligation timeline.
            - `ge` — Grande entreprise (≥ 5000 employees or revenue > €1.5B)
            - `eti` — Entreprise de taille intermédiaire (250–4999 employees, revenue ≤ €1.5B)
            - `pme` — Petite et moyenne entreprise (10–249 employees, revenue ≤ €50M)
            - `micro` — Micro-entreprise (< 10 employees, revenue ≤ €2M)
          enum:
            - ge
            - eti
            - pme
            - micro
            - null
          nullable: true
        naf_code:
          type: string
          example: '62'
          description: |
            First two digits of the company's NAF/APE code (INSEE activity classification).
            Must be exactly 2 digits. For example, `62` corresponds to "Programmation, conseil
            et autres activités informatiques".
          pattern: ^\d{2}$
          nullable: true
        email:
          type: string
          example: contact@company.fr
          description: Contact email address for DGFiP notifications.
          nullable: true
        annuaire_only:
          type: boolean
          example: false
          default: false
          description: |
            When `true`, B2Brouter only registers the company in the PPF Annuaire
            (directory) and enables Peppol reception, without generating tax reports.
            Fields `enterprise_size`, `naf_code` and `vat_regime` are not required in
            this mode. When `false` (default), full e-Reporting is enabled and
            `enterprise_size`, `naf_code` and `vat_regime` become required.
        vat_regime:
          type: string
          example: reel_normal_mensuel
          description: |
            French VAT declaration regime. Determines the frequency with which
            e-Reporting (flux 10) tax reports are transmitted to the DGFiP:
            - `reel_normal_mensuel` — transaction reports per décade (1–10, 11–20, 21–end of month)
            - `reel_normal_trimestriel` — monthly reports
            - `simplifie` — monthly reports. The regime is abolished on 2027-01-01;
              from that date stored values are treated as `reel_normal_trimestriel`
              and the value is no longer selectable.
            - `franchise_en_base` — bimonthly reports (Jan–Feb, Mar–Apr, …)

            Required when activating full e-Reporting (`enabled: true` with
            `annuaire_only: false`); not required in annuaire-only mode.
          enum:
            - reel_normal_mensuel
            - reel_normal_trimestriel
            - simplifie
            - franchise_en_base
            - null
          nullable: true
        oss_regime:
          type: boolean
          example: false
          default: false
          description: |
            OSS (One-Stop-Shop) regime for cross-border B2C sales. When `true`, every
            breakdown of a foreign-consumer simplified invoice is reported to flux 10
            as not subject to French VAT (TNT1, taux 0), covering destination-country
            rates that collide with French ones (e.g. AT 20%). When `false` (default),
            only rates outside the authorized French list are transcoded.

            Applies to every cross-border B2C sale of the account: do not enable it if
            invoices can mix destination-country VAT lines with French VAT lines, because
            the French lines would also be reported as not subject to French VAT
            (under-declaration). Per-line VAT country is not supported yet.
        report_received_only_when_accepted:
          type: boolean
          example: false
          default: false
          description: |
            Controls when the tax report of a cross-border received invoice (flux 10 Bi2B
            purchase) is created. When `false` (default), it is created as soon as the invoice
            is received. When `true`, it is created only when the invoice is marked as
            `accepted`, so an invoice the client refuses is never declared. The explicit
            `POST /invoices/{id}/generate_tax_report` still creates the report whatever the
            invoice state, so it stays available for an invoice that is never accepted.

            Bear in mind a received invoice that is never accepted is never declared automatically.
            The flux 10 period is keyed on the invoice date, not on the acceptance date, so accepting
            an invoice whose period was already transmitted leaves the report parked for a corrective
            (RE) transmission rather than declaring it.
        peppol_migration_code:
          type: string
          writeOnly: true
          example: Xk9$mQ2!vTz4
          description: |
            Migration code issued by the provider that currently publishes the account's Peppol identifier, so the identifier moves to B2Brouter as part of this activation.

            Send it only when creating an enabled DGFiP setting for an account whose identifier B2Brouter does not publish yet — the case that otherwise fails with a `422` telling you the identifier is already published with another provider. On an update, or when no migration applies, the code is refused with a `422`, never ignored; in the sandbox it is refused with a `409`, since migration codes are unavailable there. It is write-only: it never appears in a response.
        locked:
          type: boolean
          example: true
          description: Cannot be completely modified or deleted
          readOnly: true
        created_at:
          type: string
          format: date-time
          example: '2024-06-06T11:51:57Z'
          description: Date when the Tax Report Setting was created
          readOnly: true
        updated_at:
          type: string
          format: date-time
          example: '2024-06-06T11:51:57Z'
          description: Date when the Tax Report Setting was updated
          readOnly: true
