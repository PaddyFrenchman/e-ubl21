            tin_value:
              type: string
              maxLength: 255
              description: VAT identifier of the third party
              example: PL7654321098
              nullable: true
            tin_scheme:
              type: string
              description: The scheme identifier of the third party's VAT Number
              example: '9945'
              nullable: true
            cin_value:
              type: string
              maxLength: 255
              description: Company identifier of the third party
              nullable: true
            cin_scheme:
              type: string
              description: The scheme identifier of the third party's company identifier
              nullable: true
            address:
