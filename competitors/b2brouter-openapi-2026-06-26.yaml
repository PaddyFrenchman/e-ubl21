openapi: 3.0.1
info:
  title: B2Brouter API
  description: The B2Brouter API allows you to send and receive electronic documents.
  version: '2026-06-26'
  contact:
    name: Service Delivery Team
    email: servicedelivery@b2brouter.net
servers:
  - url: https://api-staging.b2brouter.net
    description: Test server
  - url: https://api.b2brouter.net
    description: Production server
tags:
  - name: Accounts
    description: Related to accounts
  - name: Bank Accounts
    description: Related to bank accounts
  - name: Code lists
    description: Related our defined code lists
  - name: Contacts
    description: Related to contacts (clients and providers)
  - name: eAccounting
    description: Related to eAccounting
  - name: Events
    description: Related to events
  - name: Invoices
    description: Related to invoices
  - name: Ledgers
    description: Related to ledgers (sets of tax reports)
  - name: Lookup
    description: Related to lookup capacities of recipients
  - name: Orders
    description: Related to orders
  - name: Tax Reports
    description: Related tax reports
  - name: Tax Report Settings
    description: Related to tax report settings
  - name: Transports
    description: Related to transport configurations
  - name: TIN Verifications
    description: Batch TIN verification against tax authority census
  - name: Validation
    description: Related to validations
paths:
  /accounts:
    get:
      operationId: get-accounts
      tags:
        - Accounts
      summary: List accounts
      description: This endpoint lists all accounts associated with the group. Supports optional query language filtering.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - name: query
          in: query
          description: |
            Query language filter expression for flexible account filtering.

            **Operators:**
            - `=` Exact match
            - `~` Substring match (case-insensitive)
            - `>` Greater than
            - `<` Less than
            - `>=` Greater than or equal
            - `<=` Less than or equal
            - `-` Negation
            - `AND` Logical AND
            - `OR` Logical OR

            **Searchable Fields:**
            - `tin_value`, `tin_scheme`, `cin_value`, `cin_scheme`, `country`, `name` (from Company)
            - `name`, `identifier`, `created_at`, `status` (from Project/Account)

            **Examples:**
            - `tin_value=ES92915236C` - Find account with specific TIN
            - `name~"Acme Corp"` - Find accounts containing "Acme Corp" in name
            - `country=es AND tin_scheme=9920` - Spanish accounts with specific TIN scheme
            - `-status=9` - Exclude archived accounts (status 9)

            Returns 400 Bad Request with error code `invalid_query` if field is not recognized or syntax is invalid.
          required: false
          schema:
            type: string
            example: country=es AND tin_scheme=9920
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Account'
                        - $ref: '#/components/schemas/TransactionsEdocsync'
                  meta:
                    $ref: '#/components/schemas/IndexMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
        - api_key: []
    post:
      operationId: create-account
      tags:
        - Accounts
      summary: Create an account
      description: |-
        Creates a new account associated with the group.

        **Creating an office (organisational unit):** To create an office, include `parent_id` in the request body. The parent must be a top-level account within the same group — it cannot itself be an office. When `parent_id` is set, `tin_value` and `tin_scheme` are inherited from the parent and must not be provided; sending either field returns `422 Unprocessable Entity`.

        When the parent has an enabled DGFiP tax report setting, the office receives a copy of it and its identifier is published, unless that identifier is already published with another provider: the office is then created without the setting, and you activate DGFiP on it afterwards through its tax report settings.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
      requestBody:
        description: The account object in JSON format to create
        content:
          application/json:
            schema:
              type: object
              required:
                - account
              properties:
                account:
                  $ref: '#/components/schemas/AccountCreate'
            examples:
              standard_account:
                summary: Create a standard account
                value:
                  account:
                    name: My Company S.L.
                    country: es
                    tin_scheme: '9920'
                    tin_value: ES12345678A
                    address: Carrer Example 123
                    city: Barcelona
                    postalcode: '08001'
                    province: Barcelona
                    phone: 34666777888
                    email: contact@company.com
              office:
                summary: Create an office (UO)
                value:
                  account:
                    parent_id: 260511
                    name: QA office
                    country: fr
                    cin_scheme: '0088'
                    cin_value: '7080002811340'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
        - api_key: []
  /accounts/{account}:
    get:
      operationId: get-account
      tags:
        - Accounts
      summary: Retrieve an account
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/account'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
        - api_key: []
    put:
      operationId: put-account
      tags:
        - Accounts
      summary: Update an account
      description: |
        This endpoint updates an account associated with a group.
        Returns the full account representation after successful update.
        Note*: The TIN can not be updated.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/account'
      requestBody:
        description: The account object in format JSON to update
        content:
          application/json:
            schema:
              type: object
              required:
                - account
              properties:
                account:
                  $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: Successful operation - returns full account representation
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
        - api_key: []
    delete:
      operationId: delete-account
      tags:
        - Accounts
      summary: Delete an account
      description: |
        Permanently deletes the account. This action cannot be undone. Once deleted,
        the account is gone: any further request for it (including a repeated delete)
        returns 404.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/account'
      responses:
        '200':
          description: Account deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/AccountDeleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflict - account cannot be deleted because it is the group's main account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
        - api_key: []
  /accounts/{account}/logo:
    post:
      operationId: upload-account-logo
      tags:
        - Accounts
      summary: Upload an account logo
      description: |
        Uploads a logo file for the specified account. If a logo already exists, it will be replaced.
        The logo will be displayed automatically in all generated PDF invoices for this account.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/account'
      requestBody:
        description: The logo attachment to add to the account
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Successful operation - returns full account representation
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
        - api_key: []
    delete:
      operationId: delete-account-logo
      tags:
        - Accounts
      summary: Deletes account logo
      description: Deletes the uploaded logo for the specified account.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/account'
      responses:
        '200':
          description: Successful operation - returns full account representation
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
        - api_key: []
  /accounts/{account}/bank_accounts:
    get:
      operationId: get-bank-accounts
      tags:
        - Bank Accounts
      summary: List bank accounts
      description: Returns an array of the bank accounts of the account.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/account'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  bank_accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/BankAccount'
                  meta:
                    $ref: '#/components/schemas/IndexMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
        - api_key: []
    post:
      operationId: create-bank-account
      tags:
        - Bank Accounts
      summary: Create a bank account
      description: Creates a new bank account.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/account'
      requestBody:
        description: Bank account object in format JSON to create
        content:
          application/json:
            schema:
              type: object
              required:
                - bank_account
              properties:
                bank_account:
                  $ref: '#/components/schemas/BankAccount'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  bank_account:
                    $ref: '#/components/schemas/BankAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
        - api_key: []
  /attachments/{id}:
    delete:
      operationId: destroy-attachment
      tags:
        - Attachments
      summary: Delete an attachment
      description: Deletes an attachment. Returns the deleted attachment's details.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/attachment_id'
      responses:
        '200':
          description: Attachment successfully deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment:
                    $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not authorized to delete this attachment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - api_key: []
  /bank_accounts/{id}:
    get:
      operationId: get-bank-account
      tags:
        - Bank Accounts
      summary: Get a bank account
      description: Returns a bank account entity
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - name: id
          in: path
          required: true
          description: Bank account identifier
          schema:
            type: integer
      responses:
        '200':
          description: Returns a bank account
          content:
            application/json:
              schema:
                type: object
                properties:
                  bank_account:
                    $ref: '#/components/schemas/BankAccount'
        '404':
          description: Bank account not found
      security:
        - api_key: []
    put:
      operationId: put-bank-account
      tags:
        - Bank Accounts
      summary: Update a bank account
      description: Updates a bank account and returns the full bank account representation
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - name: id
          in: path
          required: true
          description: Bank account identifier
          schema:
            type: integer
      requestBody:
        description: The Bank Account object in format JSON to update
        content:
          application/json:
            schema:
              type: object
              properties:
                bank_account:
                  $ref: '#/components/schemas/BankAccount'
      responses:
        '200':
          description: Bank account updated successfully - returns full bank account representation
          content:
            application/json:
              schema:
                type: object
                properties:
                  bank_account:
                    $ref: '#/components/schemas/BankAccount'
        '422':
          description: The bank account has not been updated due to validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - api_key: []
    delete:
      operationId: delete-bank-account
      tags:
        - Bank Accounts
      summary: Delete a bank account
      description: Deletes a bank account and returns the full bank account representation
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - name: id
          in: path
          required: true
          description: Bank account identifier
          schema:
            type: integer
      responses:
        '200':
          description: Bank account deleted successfully - returns full bank account representation
          content:
            application/json:
              schema:
                type: object
                properties:
                  bank_account:
                    $ref: '#/components/schemas/BankAccount'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Bank account not found
        '422':
          description: Unable to delete bank account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - api_key: []
  /accounts/{account}/eaccounting/connected_accounts:
    get:
      operationId: get-connected-accounts
      tags:
        - eAccounting
      summary: List connected accounts
      description: This endpoint list all connected client accounts associated through eAccounting connection with your account.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/account'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  meta:
                    $ref: '#/components/schemas/IndexMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
        - api_key: []
  /accounts/{account}/tax_report_settings:
    get:
      operationId: get-tax-report-settings
      tags:
        - Tax Report Settings
      summary: List tax report settings
      description: This endpoint list all tax report settings this account has configured.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/account'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  tax_report_settings:
                    type: array
                    items:
                      anyOf:
                        - $ref: '#/components/schemas/TbaiTaxReportSetting'
                        - $ref: '#/components/schemas/SdiTaxReportSetting'
                        - $ref: '#/components/schemas/VerifactuTaxReportSetting'
                        - $ref: '#/components/schemas/KsefTaxReportSetting'
                        - $ref: '#/components/schemas/DgfipTaxReportSetting'
                        - $ref: '#/components/schemas/SiiTaxReportSetting'
                  total_count:
                    type: integer
                    example: 1
                  offset:
                    type: integer
                    example: 0
                  limit:
                    type: integer
                    example: 25
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
        - api_key: []
    post:
      operationId: create-tax-report-setting
      tags:
        - Tax Report Settings
      summary: Create a tax report setting
      description: This endpoint creates a new tax report setting associated with the group.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/account'
      requestBody:
        description: The tax report setting object in format JSON to create
        content:
          application/json:
            schema:
              type: object
              required:
                - tax_report_setting
              properties:
                tax_report_setting:
                  oneOf:
                    - allOf:
                        - $ref: '#/components/schemas/VerifactuTaxReportSetting'
                        - required:
                            - code
                            - reason_vat_exempt
                            - special_regime_key
                            - special_regime_key_igic
                            - reason_no_subject
                            - credit_note_code
                    - allOf:
                        - $ref: '#/components/schemas/TbaiTaxReportSetting'
                        - required:
                            - code
                            - delegation
                            - reason_vat_exempt
                            - special_regime_key
                            - reason_no_subject
                            - credit_note_code
                            - type_operation
                    - allOf:
                        - $ref: '#/components/schemas/SdiTaxReportSetting'
                        - required:
                            - code
                    - allOf:
                        - $ref: '#/components/schemas/LhdnTaxReportSetting'
                        - required:
                            - code
                    - allOf:
                        - $ref: '#/components/schemas/KsefTaxReportSetting'
                        - required:
                            - code
                            - type_operation
                            - credit_note_code
                            - certificate
                            - certificate_pin
                    - allOf:
                        - $ref: '#/components/schemas/DgfipTaxReportSetting'
                        - required:
                            - code
                            - start_date
                            - type_operation
                    - allOf:
                        - $ref: '#/components/schemas/SiiTaxReportSetting'
                        - required:
                            - code
            examples:
              ksef_example:
                summary: Create KSeF Tax Report Setting
                value:
                  tax_report_setting:
                    code: ksef
                    type_operation: services
                    credit_note_code: '1'
                    certificate: MIIKZAIBAzCCCh4GCSqGSIb3DQEHAaCCCg8EggoLMIIKBzCCBXcGCSqGSIb3DQEHBqCCBWgwggVkAgEAMIIFXQYJKoZIhvcNAQcBMBwGCiqGSIb3DQEMAQYwDgQIvFzJKLMtK4YCAggAgIIFMGxampleBase64EncodedCertificateDataHere...
                    certificate_pin: MySecurePassword123
                    auto_generate: true
                    auto_send: true
                    enabled: true
              dgfip_example:
                summary: Create DGFiP Tax Report Setting
                value:
                  tax_report_setting:
                    code: dgfip
                    start_date: '2025-04-29T00:00:00.000Z'
                    type_operation: services
                    email: contact@company.fr
                    enterprise_size: pme
                    naf_code: '62'
                    auto_generate: true
                    auto_send: true
                    enabled: true
              dgfip_annuaire_only_example:
                summary: Create DGFiP Tax Report Setting (annuaire only)
                value:
                  tax_report_setting:
                    code: dgfip
                    start_date: '2025-04-29T00:00:00.000Z'
                    type_operation: services
                    email: contact@company.fr
                    annuaire_only: true
                    enabled: true
              verifactu_example:
                summary: Create Verifactu (Spain, AEAT) Tax Report Setting
                description: |
                  Enables Verifactu reporting for a Spanish account. `auto_generate` is always forced to `true` for Verifactu (legal requirement), so the report is generated before the invoice is issued. The `reason_*`/`special_regime_key*`/`credit_note_code` fields set the account-level defaults applied when an invoice doesn't specify them.
                value:
                  tax_report_setting:
                    code: verifactu
                    start_date: '2025-06-06'
                    auto_generate: true
                    auto_send: true
                    reason_vat_exempt: E1
                    special_regime_key: '01'
                    special_regime_key_igic: '01'
                    reason_no_subject: N1
                    credit_note_code: R1
                    type_operation: services
              ticketbai_example:
                summary: Create TicketBAI (Basque Country) Tax Report Setting
                description: |
                  Enables TicketBAI reporting. `delegation` is mandatory and selects the Basque provincial tax authority (`araba`, `gipuzkoa` or `bizkaia`); for `bizkaia` the company `epigraph` is also required. `auto_generate` is forced to `true` (legal requirement) and fires once the invoice reaches the `sent` state.
                value:
                  tax_report_setting:
                    code: tbai
                    start_date: '2024-06-06'
                    auto_generate: true
                    auto_send: true
                    delegation: gipuzkoa
                    reason_vat_exempt: E1
                    special_regime_key: '01'
                    reason_no_subject: OT
                    credit_note_code: R1
                    type_operation: services
                    epigraph: '147410'
              sdi_example:
                summary: Create SDI (Italy) Tax Report Setting
                description: |
                  SDI has no special configuration requirements — creating the setting is enough to start reporting.
                value:
                  tax_report_setting:
                    code: sdi
                    start_date: '2024-06-06'
                    auto_generate: true
                    auto_send: true
              lhdn_example:
                summary: Create LHDN / MyInvois (Malaysia) Tax Report Setting
                description: |
                  Enables MyInvois reporting for a Malaysian account. Requires B2Brouter to be registered as your intermediary ERP on the MyInvois portal first. `msic` and `classification_code` must be official LHDN codes (https://sdk.myinvois.hasil.gov.my/codes/).
                value:
                  tax_report_setting:
                    code: lhdn
                    msic: '01111'
                    type_operation: services
                    classification_code: '001'
              sii_example:
                summary: Create SII (Spain, AEAT) Tax Report Setting
                description: |
                  Enables SII reporting through the JSON Tax Report API for a Spanish account. Available from API version 2026-04-20. Creating the setting is enough to start reporting; `auto_send` controls whether generated SII tax reports are submitted to AEAT automatically.
                value:
                  tax_report_setting:
                    code: sii
                    start_date: '2026-04-29T00:00:00.000Z'
                    auto_send: true
                    enabled: true
