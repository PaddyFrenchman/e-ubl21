          enum:
            - E
            - NS
            - Z
            - S
            - H
            - AA
            - AAA
            - AE
            - G
            - O
            - K
            - null
          example: S
          description: |
            Taxes categories
             * `E` - Exempt
             * `NS` - NotSubject
             * `Z` - ZeroRated
             * `S` - Standard
             * `H` - High Rate
             * `AA` - Low Rate
             * `AAA` - Super Low Rate
             * `AE` - Reverse
             * `G` - Free export item, VAT not charged
             * `O` - Services outside scope of tax
             * `K` - VAT exempt for EEA intra-community supply of goods and services
          nullable: true
        special_regime_key:
          type: string
          example: '01'
          nullable: true
          enum:
            - '01'
            - '02'
            - '03'
            - '04'
            - '05'
            - '06'
            - '07'
            - '08'
            - '09'
            - '10'
            - '11'
            - '12'
            - '13'
            - '14'
            - '15'
            - '17'
            - '18'
            - '19'
            - '20'
            - '51'
            - '52'
            - '53'
            - '54'
