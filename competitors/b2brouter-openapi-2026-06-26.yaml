    InvoiceLine:
      type: object
      required:
        - quantity
      description: |
        A group of business terms providing information on individual Invoice lines.

        ID: `BG-25`
      properties:
        id:
          type: integer
          example: 435453
          description: A unique identifier for this InvoiceLine across all the system. Only shown if the query parameter "include" is "detailed_lines".
          readOnly: true
        position:
          type: integer
          example: 1
          description: position
        quantity:
          type: number
          format: decimal
          description: |
            Invoiced quantity. The quantity of items (goods or services) that is charged in the Invoice line.

            ID: `BT-129`
          maxLength: 255
          example: 1
        price:
          type: number
          format: decimal
          description: |
            Item net price. The price of an item, exclusive of VAT, after subtracting item price discount.

            This is the price for `base_quantity` units. When `base_quantity` is 1 (the default), this is the price per single unit. When `base_quantity` is greater than 1, this represents the price for that many units (e.g., 12.50 per 100 pieces).

            ID: `BT-146`
          maxLength: 255
          example: 10
        base_quantity:
          type: number
          format: decimal
          description: |
            Item price base quantity. The number of item units to which the price applies.

            Used when the price is quoted per multiple units rather than per single unit (e.g., price per 100 pieces, per 1000 sheets). The line amount is calculated as:

            `total_cost = quantity * price / base_quantity`

            For example, 500 screws at 12.50 per 100: `500 * 12.50 / 100 = 62.50`

            ID: `BT-149`
          minimum: 0
          exclusiveMinimum: true
          default: 1
          example: 1
        description:
          type: string
          description: |
            Item Name.

            ID: `BT-153`
          maxLength: 65535
          nullable: true
          example: Item 1
        total_cost:
          type: number
          format: float
          description: |
            Line base amount: `quantity * price / base_quantity`
          maxLength: 255
          readOnly: true
          example: 10
        extension_amount:
          type: number
          format: float
          description: |
            Line net total amount (total_cost + charges - discounts)

