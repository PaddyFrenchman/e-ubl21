            cin2_scheme:
              type: string
              nullable: true
              example: '9920'
            cin2_value:
              type: string
              nullable: true
              example: '12345678'
            cin3_scheme:
              type: string
              nullable: true
              example: '9920'
            cin3_value:
              type: string
              nullable: true
              example: '12345678'
            cin4_scheme:
              type: string
              nullable: true
              example: '9920'
            cin4_value:
              type: string
              nullable: true
              example: '12345678'
            cin5_scheme:
              type: string
              nullable: true
              example: '9920'
            cin5_value:
              type: string
              nullable: true
              example: '12345678'
        created_at:
          type: string
          format: date-time
          example: '2024-07-07T11:51:57Z'
          readOnly: true
