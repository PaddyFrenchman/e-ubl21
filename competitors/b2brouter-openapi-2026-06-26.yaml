  schemas:
    SchemeCode:
      type: string
      nullable: true
      description: |
        Identifier scheme code (e.g. for TIN, CIN or PIN). Returned as a zero-padded string in this API version. Use the **Schemes** endpoint in Code lists section (`/schemes`) to get all valid scheme codes.
      example: '9920'
    Account:
      type: object
      description: Represents an account as an object
      properties:
        id:
          type: integer
          example: 12345
          readOnly: true
          description: Internal account ID
        tin_value:
          type: string
          description: Tax identification number value
          maxLength: 255
          example: A13585625
          nullable: true
        tin_scheme:
          allOf:
            - $ref: '#/components/schemas/SchemeCode'
          description: Tax identification number scheme
          maxLength: 255
          example: 9920
        cin_value:
          type: string
          description: Company identifier number value
          maxLength: 255
          nullable: true
          example: '1234567890123'
        cin_scheme:
          allOf:
            - $ref: '#/components/schemas/SchemeCode'
          description: Company identifier number scheme
          maxLength: 255
          nullable: true
          example: '0088'
        routing_codes:
          type: object
          description: Additional company identifier numbers (CIN 1–5) used for routing purposes.
          properties:
            cin1_value:
              type: string
              description: First additional company identifier number value
              maxLength: 255
              nullable: true
              example: '7080000950171'
            cin1_scheme:
              type: string
              description: Scheme of the first additional company identifier number. Returned as a zero-padded 4-character string (e.g. "0088"), or null when unknown.
              maxLength: 255
              nullable: true
              example: '0088'
            cin2_value:
              type: string
              description: Second additional company identifier number value
              maxLength: 255
              nullable: true
              example: null
            cin2_scheme:
              type: string
              description: Scheme of the second additional company identifier number. Returned as a zero-padded 4-character string (e.g. "0088"), or null when unknown.
              maxLength: 255
              nullable: true
              example: null
            cin3_value:
              type: string
              description: Third additional company identifier number value
              maxLength: 255
              nullable: true
              example: null
            cin3_scheme:
              type: string
              description: Scheme of the third additional company identifier number. Returned as a zero-padded 4-character string (e.g. "0088"), or null when unknown.
              maxLength: 255
              nullable: true
              example: null
            cin4_value:
              type: string
              description: Fourth additional company identifier number value
              maxLength: 255
              nullable: true
              example: null
            cin4_scheme:
              type: string
              description: Scheme of the fourth additional company identifier number. Returned as a zero-padded 4-character string (e.g. "0088"), or null when unknown.
              maxLength: 255
              nullable: true
              example: null
            cin5_value:
              type: string
              description: Fifth additional company identifier number value
              maxLength: 255
              nullable: true
              example: null
            cin5_scheme:
              type: string
              description: Scheme of the fifth additional company identifier number. Returned as a zero-padded 4-character string (e.g. "0088"), or null when unknown.
              maxLength: 255
              nullable: true
              example: null
        name:
          type: string
          description: Account name
          maxLength: 255
          example: My Company S.L.
        address:
          type: string
          description: Primary address
          maxLength: 255
          example: Carrer Example 123
        address2:
          type: string
          description: Secondary address
          maxLength: 255
          nullable: true
          example: Floor 2, Office 3
        city:
          type: string
          description: City
          maxLength: 255
          example: Barcelona
          nullable: true
        postalcode:
          type: string
          description: Postal code
          maxLength: 255
          example: '08001'
        province:
          type: string
          description: Province or state
          maxLength: 255
          nullable: true
          example: Barcelona
        country:
          type: string
          description: Country code
          maxLength: 2
          example: es
          default: es
        currency:
          type: string
          description: Default currency
          maxLength: 3
          example: EUR
          default: EUR
        contact_person:
          type: string
          description: Main contact person
          maxLength: 255
          nullable: true
          example: John Doe
        phone:
          type: string
          description: Phone number
          maxLength: 255
          nullable: true
          example: 34666777888
        email:
          type: string
          description: Email address
          maxLength: 255
          format: email
          example: contact@company.com
          nullable: true
        rounding_method:
          type: string
          enum:
            - half_up
            - bankers
            - truncate
          description: |
            Roundings (only for imported invoices)
             * `half_up` - Round half up
             * `bankers` - Bank rounding
             * `truncate` - Truncate decimals
          default: half_up
          example: half_up
        round_before_sum:
          type: boolean
          description: Whether to round before summing
          default: false
        unit_code_format:
          type: string
          enum:
            - internal
            - unece_rec20
          description: |
            Code list used for invoice line unit codes when reading and writing
            invoices through the API.
             * `internal` - B2BRouter's own integer unit code list
             * `unece_rec20` - UN/ECE Recommendation 20 codes (e.g. `HUR`, `KGM`)
          default: internal
          example: internal
        apply_taxes_per_line:
          type: boolean
          description: Whether to apply taxes per line
          default: false
        skip_line_taxable_base_rounding:
          type: boolean
          description: 'When enabled, per-line taxable bases and tax amounts are not individually rounded — only the final accumulated tax total is rounded. Intended exclusively for accounts whose ERP uses VAT-inclusive totals, as it deviates from the standard tax calculation. Requires `apply_taxes_per_line: true` to have any effect.'
          default: false
          example: false
        registered_for_empl_tax:
          type: boolean
          description: Whether registered for employment tax
          default: false
        transport_type_code:
          type: string
          description: Default transport type code
          maxLength: 255
          nullable: true
          example: peppol
        document_type_code:
          type: string
          description: Default document type code
          maxLength: 255
          nullable: true
          example: xml.ubl.2.1
        has_logo:
          type: boolean
          description: Whether the account has an uploaded logo
          readOnly: true
          example: true
        transactions_count:
          type: integer
          description: Number of transactions in current period
          readOnly: true
          example: 150
        transactions_count_previous_period:
          type: integer
          description: Number of transactions in previous period
          readOnly: true
          example: 120
        transactions_limit:
          type: integer
          description: Transaction limit for the subscription
          readOnly: true
          example: 1000
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Account creation timestamp
          example: '2024-07-07T11:51:57Z'
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Account last update timestamp
          example: '2024-07-07T11:51:57Z'
        parent_id:
          type: integer
          example: 12345
          nullable: true
          description: Parent account ID. When provided on creation (`POST /accounts`), creates the account as an office (subsidiary) under the specified parent. The parent must be a top-level account within the same group and not itself an office. Returned in responses only for office accounts.
        auto_remittance:
          type: boolean
          description: When enabled, automatically generates a structured remittance information (OGM/VCS code) for invoices sent between two Belgian parties.
          default: false
          example: false
    TransactionsEdocsync:
      properties:
        transactions_count:
          type: integer
          example: 16
          description: The transactions the account has made during the current period
          nullable: true
          readOnly: true
        transactions_count_previous_period:
          type: integer
          example: 28
          description: The transactions the account has made in the past period
          nullable: true
          readOnly: true
        transactions_limit:
          type: integer
          example: 25
          description: The number of transactions available for the current product
          nullable: true
          readOnly: true
    IndexMeta:
      type: object
      description: Represents meta data for listing endpoints
      properties:
        total_count:
          type: integer
          description: Total count of returned objects
          example: 1
        offset:
          type: integer
          description: Offset set by the params
          example: 0
        limit:
          type: integer
          description: Limit of the returned list set by the params
          example: 25
    Error:
      type: object
      description: Represents an error object returned in a failed request
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: A unique error code identifying the type of error. See https://developer.b2brouter.net/docs/error_codes for the full code list.
              example: parameter_empty
            message:
              type: string
              description: A human-readable error message providing more context about the error.
              example: The parameter 'param' is missing or the value is empty
            param:
              type: string
              description: The parameter in the request that caused the error (if applicable).
              example: param
            type:
              type: string
              description: The type of error. Currently the only possible value is "invalid_request_error".
              example: invalid_request
    UnauthorizedError:
      type: object
      description: Represents an error object returned in a failed request
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: A unique error code identifying the type of error.
              example: unauthorized
              default: unauthorized
            message:
              type: string
              description: A human-readable error message providing more context about the error.
              example: Invalid API Key provided, or the API key might not have the necessary permissions for this action.
            type:
              type: string
              description: The type of error, often mirrors the error code for clarity.
              example: invalid_request_error
              default: invalid_request_error
    AccountCreate:
      type: object
      description: |-
        Request body schema for creating an account (POST /accounts).
        Extends the shared `Account` schema with the create-time contract: the fields the API requires on creation are listed in `required`, and each of those that is `nullable` in the response schema is re-declared here with their nullable state, since a required field that is non-nullable cannot be sent as `null`. The response representation keeps `Account` (where these fields may legitimately be `null` for legacy/partial accounts).
        To create an office (organisational unit), include `parent_id` in the request. The parent must be a top-level account within the same group — it cannot itself be an office. When `parent_id` is set, `tin_value` and `tin_scheme` are inherited from the parent and must not be provided.
      allOf:
        - $ref: '#/components/schemas/Account'
        - $ref: '#/components/schemas/TransactionsEdocsync'
        - type: object
          required:
            - name
            - postalcode
            - email
            - address
            - city
            - province
            - phone
            - tin_value
          properties:
            email:
              type: string
            address:
              type: string
            city:
              type: string
            province:
              type: string
              nullable: true
            postalcode:
              type: string
            phone:
              type: string
              nullable: true
            tin_value:
              type: string
    AccountUpdate:
      type: object
      description: |-
        Request body schema for updating an account (PUT /accounts/{account}).
        Extends the shared `Account` schema. Updates are partial, so no field is `required` here, but `email`, `address` and `city` are re-declared as non-nullable: the model validates their presence on update (email unconditionally; address/city via `require_address` for accounts created on or after 2020-09-28), so sending them as `null` would be rejected. `province` is left nullable because its requirement is country-dependent. The response representation keeps `Account` (where these fields may be `null`).
        `parent_id` is read-only here: an account's parent cannot be changed after creation.
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          properties:
            email:
              type: string
            address:
              type: string
            city:
              type: string
            parent_id:
              readOnly: true
    ForbiddenError:
      type: object
      description: Represents an error object returned when the target project is archived
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: A unique error code identifying the type of error.
              example: '403'
              default: '403'
            message:
              type: string
              description: A human-readable error message providing more context about the error.
              example: The project you are trying to access has been archived.
            type:
              type: string
              description: The type of error, often mirrors the error code for clarity.
              example: invalid_request_error
              default: invalid_request_error
    AccountDeleted:
      type: object
      description: Response returned when an account is deleted.
      properties:
        id:
          type: integer
          description: ID of the deleted account
          example: 12345
        deleted:
          type: boolean
          description: Always true on success
          example: true
    BankAccount:
      type: object
      description: Represents a bank account as an object
      required:
        - type
      properties:
        id:
          type: integer
          description: Internal ID
          readOnly: true
          example: 402
        type:
          type: string
          description: |
            Bank account type:
             * `number` - Account number
             * `iban` - IBAN
          enum:
            - iban
            - number
          default: iban
          example: iban
        name:
          type: string
          description: Name
          example: My Bank Account
          maxLength: 255
          nullable: true
        number:
          type: string
          description: Bank account number. Required when `type` is `number`. A standard account must provide either `number` or `iban`; third-party accounts may omit both.
          example: 10000000000000000000
          maxLength: 24
          nullable: true
        iban:
          type: string
          description: International Bank Account Number (IBAN). Required when `type` is `iban`. A standard account must provide either `number` or `iban`; third-party accounts may omit both.
          example: ES6000000000000000000000
          nullable: true
