                      - name: IVA
                        category: S
                        percent: 21
                        taxable_base: 100
                        tax_amount: 21
                        special_regime_key: '02'
                        non_exemption_code: S1
              verifactu_multiple_vat:
                summary: Verifactu with two VAT rates (21% and 10%)
                value:
