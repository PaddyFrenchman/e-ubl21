            - type: boolean
          example: S
          description: |-
            `FacturaSimplificadaArticulos7.2_7.3` flag.
            Verifactu: `'S'` or `'N'` (string).
            SII (`type: SiiDocument`, `book_type: Expedida` or `Recibida`): JSON boolean. Render as `<sii:FacturaSimplificadaArticulos7.2_7.3>S</sii:FacturaSimplificadaArticulos7.2_7.3>` when `true`; element is omitted when `false`.
        macrodata:
          oneOf:
            - type: string
            - type: boolean
          example: 'N'
          description: |-
            `Macrodato` flag — invoice total above the AEAT large-amount threshold.
            Verifactu: `'S'` or `'N'` (auto-computed from `tax_inclusive_amount` ≥ €100M).
            SII (`type: SiiDocument`, `book_type: Expedida` or `Recibida`): JSON boolean supplied by the client.
        coupon:
          type: string
          example: 'N'
          description: Specific of Verifactu
        reg_previo_ggee:
          type: boolean
          default: false
          description: |-
            `RegPrevioGGEEoREDEMEoCompetencia` flag. Applies to `Expedida` and `Recibida`. Emits `<sii:RegPrevioGGEEoREDEMEoCompetencia>S</...>` when `true`; omitted when `false`.
            Specific to SII.
        facturacion_disp_adicional_mercado_gas:
          type: boolean
          default: false
          description: |-
            `FacturacionDispAdicionalTerceraYsextayDelMercadoOrganizadoDelGas` flag. Applies to `Expedida` only — the AEAT XSD defines this element on `FacturaExpedidaType`, not on the FacturaType base.
            Specific to SII.
        sin_identif_destinatario_art_6_1_d:
          type: boolean
          default: false
          description: |-
            `FacturaSinIdentifDestinatarioAritculo6.1.d` flag. `Expedida`-only per the AEAT XSD.
            Specific to SII.
        fecha_contable:
          type: string
          format: date
          nullable: true
          example: '2026-04-15'
          description: |-
            Accounting registration date (`FechaRegContable`). `Recibida`-only.
            Distinct from `tax_point_date` (which maps to `FechaOperacion`): the operation/service date can precede the accounting date by weeks if the invoice is booked later. If not set, the modern path falls back to `tax_point_date` then `invoice_date`.
            Specific to SII.
        cuota_deducible_in_cents:
          type: integer
          nullable: true
          example: 2100
          description: |-
            Deductible quota for `Recibida` records (write side). When omitted, derived from the sum of `tax_breakdowns[*].tax_amount`. Real-world Recibida data often diverges from the breakdown sum (partial deductibility, regularization), so an explicit client value wins.
            Specific to SII.
        cuota_deducible:
          type: number
          format: decimal
          readOnly: true
          description: |-
            Read-side response field — deductible quota as decimal (EUR). Mirrors `cuota_deducible_in_cents` / 100.
            Specific to SII Recibida.
        succession_party_name:
          type: string
          nullable: true
          description: |-
            `EntidadSucedida` > `NombreRazon`. Used in business-succession reporting on `Expedida`, `Recibida`, `Inversion`, `Intracomunitaria`, `Metalico`, `Seguro`, `Viajesagencia`. Must be set together with `succession_party_tax_id`.
            Specific to SII.
        succession_party_tax_id:
          type: string
          nullable: true
          description: |-
            `EntidadSucedida` > `NIF`. Pairs with `succession_party_name`.
            Specific to SII.
        billing_agreement_number:
          type: string
          maxLength: 15
          nullable: true
          description: |-
            `NumRegistroAcuerdoFacturacion`. Used on `Expedida`, `Recibida`, `Inversion`, `Intracomunitaria` records that fall under a pre-registered AEAT billing agreement.
            Specific to SII.
        clave_declarado:
          type: string
          enum:
            - D
            - R
          nullable: true
          description: |-
            `ClaveDeclarado` enum. `Intracomunitaria`-only.
            Specific to SII.
        plazo_operacion:
          type: string
          maxLength: 3
          nullable: true
          description: |-
            `PlazoOperacion` AEAT code. `Intracomunitaria`-only.
            Specific to SII.
        facturas_o_documentacion:
          type: string
          maxLength: 150
          nullable: true
          description: |-
            `FacturasODocumentacion` free-text field. `Intracomunitaria`-only.
            Specific to SII.
        identificacion_bien:
          type: string
          maxLength: 40
          nullable: true
          description: |-
            `IdentificacionBien` — capital good identifier. `Inversion`-only. Required when creating an `Inversion` record.
            Specific to SII.
        fecha_inicio_utilizacion:
          type: string
          format: date
          nullable: true
          description: |-
            `FechaInicioUtilizacion` — date the capital good entered use. `Inversion`-only. Required when creating an `Inversion` record.
            Specific to SII.
        prorrata_anual_definitiva:
          type: string
          format: decimal
          nullable: true
          example: 95
          description: |-
            `ProrrataAnualDefinitiva` — definitive annual prorrata (0–100, 2 decimal places). `Inversion`-only. Required when creating an `Inversion` record.
            Specific to SII.
        regularizacion_anual_deduccion_in_cents:
          type: integer
          nullable: true
          description: |-
            `RegularizacionAnualDeduccion` in cents. `Inversion`-only, optional.
            Specific to SII.
        identificacion_entrega:
          type: string
          maxLength: 40
          nullable: true
          description: |-
            `IdentificacionEntrega`. `Inversion`-only, optional.
            Specific to SII.
        regularizacion_deduccion_efectuada_in_cents:
          type: integer
          nullable: true
          description: |-
            `RegularizacionDeduccionEfectuada` in cents. `Inversion`-only, optional.
            Specific to SII.
        csv:
          type: string
          nullable: true
          readOnly: true
          description: |-
            AEAT-assigned CSV (Código Seguro de Verificación) for the registered record. Set asynchronously after the AEAT submission succeeds.
            Specific to SII.
        fecha_presentacion:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: |-
            AEAT-assigned presentation timestamp (Madrid time zone). Set asynchronously after the AEAT submission succeeds.
            Specific to SII.
        estado:
          type: string
          nullable: true
          readOnly: true
          description: |-
            Internal SII state (`Nuevo`, `Enviando`, `Correcto`, `Incorrecto`, `AceptadoConErrores`, `Error`). The CTC `state` field is the authoritative cross-authority signal; `estado` is exposed for SII-specific tooling that mirrors the legacy column.
            Specific to SII.
        payments:
          type: array
          nullable: true
          items:
            type: object
            properties:
              fecha:
                type: string
                format: date
              importe_in_cents:
                type: integer
              medio:
                type: string
              cuenta_o_medio:
                type: string
          description: |-
            Per-record payment events for `Cobro` and `Pago` — collections for `Cobro`, disbursements for `Pago` (the book type disambiguates the direction). Array of `{ fecha, importe_in_cents, medio, cuenta_o_medio }`.
            Not used by other book types — their nested data lives in flat columns above.
            Specific to SII.
        payment_date:
          type: string
          format: date
          example: '2025-04-10'
          nullable: true
          description: |-
            Payment date or payment due date for the invoice.
            Specific to KSeF (Polish tax reporting).
            For already paid invoices (Zaplacono=1), this represents the actual payment date (DataZaplaty). For unpaid invoices, this represents the payment due date (TerminPlatnosci).
        payment_means_type_code:
          type: integer
          nullable: true
          minimum: 1
          maximum: 7
          example: 6
          description: |-
            Payment means type code.
            Specific to KSeF (Polish tax reporting).
            Valid values for KSeF:
             * `1` - Cash 
             * `2` - Card
             * `3` - Voucher
             * `4` - Check
             * `5` - Credit
             * `6` - Bank transfer
             * `7` - Mobile phone payment
        payment_account_identifier:
          type: string
          nullable: true
          example: PL61129030140002071219612874
          description: |-
            Payment account identifier.
            Specific to KSeF (Polish tax reporting).
            A unique identifier of the financial payment account to which payment should be made. Can be an IBAN or local bank account number.
        payment_service_provider_identifier:
          type: string
          nullable: true
          example: WBKPPLPP
          description: |-
            Payment service provider identifier.
            Specific to KSeF (Polish tax reporting).
            BIC/SWIFT code or national clearing code of the payment service provider (bank) where the payment account is located.
        amended_ksef_number:
          type: string
          example: a1b2c3d4-e5f6-4789-ab12-cd34ef567890
          nullable: true
          description: The KSeF number of the original invoice being amended. Used when creating an amendment/correction in KSeF. Specific to KSeF (Polish tax reporting).
        order_total_amount:
          type: number
          format: decimal
          nullable: true
          description: |-
            Total amount of the order (KSeF WartoscZamowienia field).
            Required when `invoice_type_code` is `ZAL` or `KOR_ZAL`. Mapped automatically from the invoice when generating a tax report. Specific to KSeF (Polish tax reporting).
        previous_advance_total:
          type: number
          format: decimal
          nullable: true
          description: |-
            Total amount from the original advance payment invoice (KSeF P_15ZK field).
            Required when `invoice_type_code` is `KOR_ZAL`. Stores the gross total of the ZAL invoice being corrected. Mapped automatically from the invoice's amend reference when generating from an invoice; set explicitly when creating via API.
            Specific to KSeF (Polish tax reporting).
        prepayment_references:
          type: array
          description: |-
            References to advance payment invoices (ZAL) settled by this ROZ invoice. Each entry maps to a `FakturaZaliczkowa` element in the KSeF FA(3) XML.
            Required (non-empty) when `invoice_type_code` is `ROZ` or `KOR_ROZ`. Populated automatically from the invoice's prepayment references when generating from an invoice; set explicitly when creating via API.
            Specific to KSeF (Polish tax reporting).
          items:
            type: object
            properties:
              id:
                type: integer
                readOnly: true
                description: Internal identifier of the reference.
              number:
                type: string
                nullable: true
                description: Invoice number of the advance payment invoice (KSeF NrFaZaliczkowej). Required when `registration_code` is absent.
              registration_code:
                type: string
                nullable: true
                description: KSeF registration number of the advance payment invoice (KSeF NrKSeFFaZaliczkowej). Required when `number` is absent.
              _destroy:
                type: boolean
                writeOnly: true
                description: Set to `true` to delete this reference (use with `id`).
        payment_account_name:
          type: string
          nullable: true
          description: |-
            Name of the payment account holder.
            Specific to KSeF (Polish tax reporting).
        purchase_order_reference:
          type: string
          nullable: true
          description: |-
            Purchase order reference number.
            Specific to KSeF (Polish tax reporting).
        sales_order_reference:
          type: string
          nullable: true
          description: |-
            Sales order reference number.
            Specific to KSeF (Polish tax reporting).
        purchase_order_date:
          type: string
          format: date
          nullable: true
          example: '2025-04-10'
          description: |-
            Purchase order date (BT-92).
            Specific to KSeF (Polish tax reporting).
        despatch_advice_reference:
          type: string
          nullable: true
          description: |-
            Despatch advice reference number (BT-16).
            Specific to KSeF (Polish tax reporting).
        tax_inclusive_amount_before_allowances_and_charges:
          type: number
          format: decimal
          nullable: true
          description: |-
            Total amount including taxes, calculated before applying document-level allowances and charges.
            Specific to KSeF (Polish tax reporting).
        customer_party_jst:
          type: boolean
          default: false
          description: |-
            KSeF Podmiot2 JST flag (Jednostka Samorządu Terytorialnego — Subordinate Local Government Unit).
            true: The buyer is a subordinate local government unit (requires Podmiot3 role=8). false: Does not apply (default).
            Specific to KSeF (Polish tax reporting).
        customer_party_gv:
          type: boolean
          default: false
          description: |-
            KSeF Podmiot2 GV flag (Grupa VAT — VAT Group Member).
            true: The buyer is a member of a VAT group (requires Podmiot3 role=10). false: Does not apply (default).
            Specific to KSeF (Polish tax reporting).
        exchange_rate:
          type: number
          format: decimal
          nullable: true
          description: |-
            Exchange rate used for currency conversion when the invoice currency differs from the  tax authority's local currency (e.g., EUR invoice in Poland where local currency is PLN).
            For KSeF (Poland): Required when invoice currency is not PLN.
          example: 4.5123
        exchange_date:
          type: string
          format: date
          nullable: true
          description: Date of the exchange rate used for currency conversion.
          example: '2025-04-10'
        tax_breakdowns:
          type: array
          description: One or more tax breakdowns ("Desglose IVA" in Verifactu)
          items:
            $ref: '#/components/schemas/TaxBreakdowns'
        tax_report_lines:
          type: array
          description: One or more tax report lines. This is used when creating TicketBAI and KSeF Tax Reports.
          items:
            $ref: '#/components/schemas/TaxReportLine'
        allowance_charges:
          type: array
          description: One or more allowance charges. This is used when creating KSeF Tax Reports.
          items:
            $ref: '#/components/schemas/AllowanceCharge'
    VerifactuTaxReportPatch:
      type: object
      additionalProperties: false
      required:
        - tax_report
      properties:
        tax_report:
          type: object
          additionalProperties: false
          description: Fields allowed to correct a Verifactu Tax Report.
          properties:
            description:
              type: string
              nullable: true
              description: Operation description (internal field).
            customer_party_tax_id:
              type: string
              example: B63354243
            customer_party_tax_scheme:
              type: string
              nullable: true
            customer_party_country:
              type: string
              example: es
            previously_refused:
              type: string
              example: S
            tax_breakdowns:
              type: array
              nullable: true
              description: Tax breakdown corrections (only codification fields are correctable).
              items:
                type: object
                additionalProperties: false
                required:
                  - id
                properties:
                  id:
                    type: integer
                    description: Existing tax breakdown id to correct.
                  non_exemption_code:
                    type: string
                    example: S1
                  exemption_code:
                    type: string
                    nullable: true
                    enum:
                      - E1
                      - E2
                      - E3
                      - E4
                      - E5
                      - E6
                    description: |
                      Reason code for VAT Exemption. 
                      [Verifactu and TicketBAI codes](https://developer.b2brouter.net/docs/verifactu#exemption-codes).

                      This field is required when `exempt` is set to true.
                  no_subject_code:
                    type: string
                    nullable: true
                    enum:
                      - N1
                      - N2
                    description: |
                      Reason code for No Suject. 
                      - [Verifactu codes](https://developer.b2brouter.net/docs/verifactu#non-subject-codes)
                      This field is required when `no_subject` is set to true.
                  special_regime_key:
                    type: string
                    example: '01'
                    nullable: true
                  category:
                    type: string
                    enum:
                      - E
                      - NS
                      - Z
                      - S
                      - H
                      - AA
                      - AAA
                      - AE
                      - G
                      - O
                      - K
                    example: S
                    description: |
                      Taxes categories
                       * `E` - Exempt
                       * `NS` - NotSubject
                       * `Z` - ZeroRated
                       * `S` - Standard
                       * `H` - High Rate
                       * `AA` - Low Rate
                       * `AAA` - Super Low Rate
                       * `AE` - Reverse
                       * `G` - Free export item, VAT not charged
                       * `O` - Services outside scope of tax
                       * `K` - VAT exempt for EEA intra-community supply of goods and services
