        - api_key: []
  /directory/{country}/{scheme}/{id}:
    get:
      operationId: lookup-directory-by-country-and-scheme
      tags:
        - Lookup
      summary: Show company from Directory (by country and scheme codes)
      description: |
        Return the information about specified company that lists in our Directory.

        The lookup is always asynchronous: the first request returns `202 Accepted` with a polling URL (there is no synchronous SML check). Retry the same request until it resolves to `200` (found), `404` (not in Peppol, nor in the DGFiP Annuaire for French identifiers), `422` (the identifier is not valid for any scheme of the country), or `424` (a dependency failed — see below).
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/directory_country'
        - $ref: '#/components/parameters/directory_scheme'
        - $ref: '#/components/parameters/directory_id'
      responses:
        '200':
          description: Returns specified company from directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalCompany'
        '202':
          description: The lookup has been queued. Always returned on the first request, before Peppol and the Annuaire have been consulted. Retry the same request until it resolves.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: processing
                  message:
                    type: string
                    example: Querying directory. Please retry this request.
                  polling_url:
                    type: string
                    example: https://api.b2brouter.net/directory/es/9920/ES12345678
        '401':
          description: Unauthorized
        '404':
          description: The participant was not found. Always deferred (after at least one 202); confirms both Peppol and — for French identifiers — the DGFiP Annuaire were consulted, not just the SML.
        '422':
          description: |
            The identifier is not valid for any scheme of the requested country. The `error.code` is `parameter_invalid`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: parameter_invalid
                      message:
                        type: string
                        example: Identifier is not valid for the requested scheme
                      type:
                        type: string
                        example: invalid_request_error
        '424':
          description: |
            A dependency required to resolve the lookup failed. The `error.code` field carries the machine-readable reason. Two are structural problems of the participant's SMP and are not retriable — contact the participant's Peppol Access Point: `incomplete_businesscard`, `no_exportable_doctypes`. The third is transient: `upstream_unavailable` (an upstream directory service — Peppol or the DGFiP Annuaire — was temporarily unavailable); retry after the delay in the `Retry-After` response header.
          headers:
            Retry-After:
              description: Seconds to wait before retrying. Present only for `upstream_unavailable`.
              schema:
                type: integer
                example: 900
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: no_exportable_doctypes
                      message:
                        type: string
                        example: The SMP for participant 0208:0454483701 does not publish any exportable invoice document types. Please contact the participant's Peppol Access Point.
                      type:
                        type: string
                        example: invalid_request_error
      security:
        - api_key: []
  /directory/{scheme}/{id}:
    get:
      operationId: lookup-directory-by-scheme
      tags:
        - Lookup
      summary: Show company from Directory (by scheme code)
      description: |
