              maxLength: 255
              description: Address of the third party
              example: ul. Szkolna 12
              nullable: true
            address2:
              type: string
              maxLength: 255
              description: Additional address line
              nullable: true
            city:
              type: string
              maxLength: 255
              description: City
              example: Kraków
              nullable: true
            postalcode:
              type: string
              maxLength: 255
              description: Postal code
              example: 30-010
              nullable: true
            province:
              type: string
              maxLength: 255
              description: Province/Region
              nullable: true
            country:
              type: string
              maxLength: 2
              description: Country code
              example: pl
              nullable: true
