  /invoices/{id}/generate_tax_report:
    post:
      operationId: generate-tax-report-from-invoice
      tags:
        - Invoices
      summary: Generate a tax report from an Invoice
      description: |-
        Generates the tax report for an existing invoice. Depending on the Tax Authority and the settings of your account, the tax report might be automatically send after issuing an invoice. Thus, it might not be necessary to explicitly call this method if you issue your invoices via B2Brouter.
        Note that you will have to check the status of the tax report we send in your behalf in order to be able to take the necessary actions in case any error or warning is issued by the Tax Authority. Because of the asynchronous nature of the tax report sending process, there is no guarantee that when you check the status of the tax reports it will already have the response of the Tax Authority. It usually takes a few seconds to complete the transaction. You will know that the transaction is complete if the response of the check of the status of the tax report has an status **registered** or **error**. We recommend you retry the status check until you get a final state on your tax report.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/invoice_id'
      responses:
        '201':
          description: Tax report successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  tax_report:
                    $ref: '#/components/schemas/TaxReportGenerated'
        '403':
          description: Forbidden
      security:
        - api_key: []
  /invoices/{id}/responses:
    get:
      operationId: list-invoice-responses
      tags:
        - Invoices
      summary: List the response documents received for an invoice
      description: |-
        Lists the response documents received for an invoice, oldest first. A response document is a file another party sent back about your invoice. The `source` field identifies the channel each document arrived through.

        Documents received on the invoice exchange network (`source: network`):
        - French PPF cross-domain acknowledgement responses (CDARs) reporting the invoice's lifecycle statuses.
        - Peppol application responses (buyer acceptance/rejection).
        - EDI rejection notices.
        - Italian SDI ricevute, including the *mancata consegna* (failed delivery) notice.

        Documents issued by a tax authority about the invoice's tax reports (`source` is the authority's transport code):
        - `fr.dgfip`: PPF acknowledgements of French e-reporting submissions (acknowledged / registered / refused).
        - `pl.ksef`: the KSeF UPO, Poland's official receipt of registration.

        Reports for other tax authorities do not contribute response documents yet. Download the original file through `attachment.download_url`; `attachment` is `null` when the response was recorded without a file. Responses addressed to a whole ledger (batch submission) are not listed here — retrieve those with the ledger's `download_response` endpoint. The collection is always returned complete, without pagination: an invoice accumulates at most a handful of response documents.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/invoice_id'
      responses:
        '200':
          description: The response documents received for the invoice
          content:
            application/json:
              schema:
                type: object
                properties:
                  responses:
                    type: array
                    items:
                      type: object
                      properties:
                        event_name:
                          type: string
                          description: Name of the recorded response event
                          example: notification_c4_state_refused
                        source:
                          type: string
                          description: 'Channel the document arrived through: `network` or a tax authority transport code'
                          example: fr.dgfip
                        received_at:
                          type: string
                          format: date-time
                          description: When the response document was received
                        attachment:
                          description: The received file; `null` when none was recorded
                          nullable: true
                          anyOf:
                            - enum:
                                - null
                            - allOf:
                                - $ref: '#/components/schemas/Attachment'
                                - type: object
                                  properties:
                                    download_url:
                                      type: string
                                      format: uri
                                      description: Absolute URL to download the file
              example:
                responses:
                  - event_name: notification_c4_state_refused
                    source: fr.dgfip
                    received_at: '2026-08-01T10:00:00.000Z'
                    attachment:
                      id: 1
                      filename: cdar_F1_210_9f2a41c7.xml
                      content_type: application/xml
                      filesize: 2048
                      category: null
                      created_at: '2026-08-01T10:00:00.000Z'
                      download_url: https://api.b2brouter.net/attachments/download/1/cdar_F1_210_9f2a41c7.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - api_key: []
