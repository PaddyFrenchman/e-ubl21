    OrderState:
      type: string
      example: received
      enum:
        - delivery_confirmed
        - closed
        - accepted
        - refused
        - received
      description: |
        Some states for an order:
         * `delivery_confirmed` - When the order is marked as the order has been confirmed.
         * `closed` - When the order is marked as closed.
         * `accepted` - When the order is marked as accepted.
         * `refused` - When the order is marked as refused.
         * `received` - The initial status of an order or when the order is marked as received.
    Contact:
      type: object
      description: Represents a contact as an object
      properties:
        id:
          type: integer
          example: 133842
          readOnly: true
          description: Internal ID
        parent_id:
          type: integer
          description: |
            ID of the parent contact. Setting this field creates the contact as a child (organisational unit / office) of the specified parent. The parent must belong to the same account.
            Offices inherit TIN (`tin_value`, `tin_scheme`) from the parent contact. If provided, these must match the parent's values exactly; otherwise the request is rejected with a `422 Unprocessable Entity` error (code `parameter_invalid`). CIN (`cin_value`, `cin_scheme`) is stored independently on the office.
          example: 133800
          nullable: true
        tin_value:
          type: string
          description: |
            VAT identifier
            ID: `BT-48`
            When creating an office (`parent_id` is set), this field is inherited from the parent. If provided, it must match the parent's `tin_value`.
          maxLength: 255
          example: ESA13585625
        tin_scheme:
          type: string
          description: |
            The scheme identifier of VAT Number
            You can get all schemes codes using the **Schemes* endpoint in Code lists section (`/schemes`).
          example: '9920'
        cin_value:
          type: string
          description: |
            Company Identifier Number
            For offices, this field is stored independently (not inherited from the parent). If not provided, the office inherits `cin_value` from the parent contact.
          nullable: true
          example: '1234567890123'
        cin_scheme:
          type: string
          description: |
            The scheme identifier of Company Identifier Number (not a tax identifier number).
            You can get all schemes codes using the **Schemes* endpoint in Code lists section (`/schemes`).
          nullable: true
          example: '0208'
        name:
          type: string
          example: Contact1
          description: Name
          maxLength: 255
          nullable: true
        email:
          type: string
          example: mail@contact1.com
          description: Email
          maxLength: 255
          nullable: true
        phone:
          type: string
          example: '6666666666'
          description: Phone
          maxLength: 255
          nullable: true
        website:
          type: string
          description: Website
          maxLength: 255
          nullable: true
          example: https://www.contact1.com
        address:
          type: string
          description: Address
          maxLength: 255
          nullable: true
          example: Invented Address, 1
        address2:
          type: string
          description: Address 2
          maxLength: 255
          nullable: true
          example: Invented Address, 2
        postalcode:
          type: string
          example: '80808'
          description: Postcode
          maxLength: 255
          nullable: true
        city:
          type: string
          example: Barcelona
          description: City
          maxLength: 255
          nullable: true
        province:
          type: string
          example: Barcelona
          description: Region/Province/County
          maxLength: 255
          nullable: true
        country:
          type: string
          example: es
          description: Country
          maxLength: 255
          nullable: true
        language:
          type: string
          example: es
          default: en
          description: |
            Contact language. It should be a language available inside B2Brouter.
            You can check all available languages  using the **Languages** endpoint in Code lists section (`/languages`)
          enum:
            - en
            - es
            - ca
            - fr
            - it
            - de
            - pt
            - nl
            - pl
            - da
            - sv
            - ar
            - null
          maxLength: 2
          nullable: true
        currency:
          type: string
          example: EUR
          description: |
            Default currency for the electronic documents related to this contact.
            You can check all supported currencies using the **Currencies** endpoint in Code lists section (`/currencies`)
          maxLength: 255
          nullable: true
        is_client:
          type: boolean
          description: Indicates if the contact is a client for your organisation
          default: true
        is_provider:
          type: boolean
          description: Indicates if the contact is a provider for your organisation
          default: true
        transport_type_code:
          $ref: '#/components/schemas/TransportTypeCode'
        document_type_code:
          $ref: '#/components/schemas/DocumentTypeCode'
        pin_value:
          type: string
          description: |
            Peppol Identifier Number, identifies the Buyer's electronic address to which the invoice is delivered.
          nullable: true
          example: ES123456789
        pin_scheme:
          type: string
          description: |
            The identification scheme identifier of the Buyer electronic address.

            You can get all schemes codes using the **Schemes* endpoint in Code lists section (`/schemes`). The value has to be in EAS code list
            https://docs.peppol.eu/poacc/billing/3.0/codelist/eas/
          nullable: true
          example: '9920'
        party_identification:
          type: string
          maxLength: 12
          description: |
            Seller/Buyer identifier

            ID: `BT-29` if Contact is a Seller
            ID: `BT-46` if Contact is a Buyer
          example: '506001234999'
          nullable: true
        bank_account_number:
          type: string
          description: Contact's bank account number (do not specify if IBAN + BIC is used)
          maxLength: 24
          example: ES6000000000000000000000
          nullable: true
        iban:
          type: string
          description: Contact's IBAN (International Bank Account Number)
          maxLength: 255
          nullable: true
          example: ES6000000000000000000000
        bic:
          type: string
          description: Contact's BIC (Bank Identifier Code)
          maxLength: 255
          nullable: true
          example: 0
        bank_account_id:
          type: integer
          description: Internal Bank Account ID used to link the bank account configured for your account, where the contact deposits payments to you. Must be provided explicitly; it is not populated from the company's default bank account.
          example: 1234
          nullable: true
        payment_method:
          $ref: '#/components/schemas/PaymentMethodCode'
        payment_method_text:
          type: string
          description: Payment method. The means, expressed as text, for how a payment is expected to be or has been settled.
          maxLength: 255
          nullable: true
          example: Credit transfer
        payment_reminder_days:
          type: integer
          description: payment_reminder_days
          maxLength: 4
          example: 4
          nullable: true
        terms:
          type: string
          default: custom
          enum:
            - custom
            - '0'
            - '15'
            - '30'
            - '60'
            - '90'
            - '120'
            - 0m-1
            - 1m-1
            - 1m1
            - 2m1
            - 1m15
            - 1m20
            - 1m10
            - null
          description: |
            Term
            * `custom` - Custom
            * `0` - Upon Receipt
            * `15` - 15 days
            * `30` - 30 days
            * `60` - 60 days
            * `90` - 90 days
            * `120` - 120 days
            * `0m-1` - Last day this month
            * `1m-1` - Last day next month
            * `1m1` - 1st day next month
            * `2m1` - 1st day in two months
            * `1m15` - 15th day next month
            * `1m20` - 20th day next month
            * `1m10` - 10th day next month
          maxLength: 255
          nullable: true
          example: 1m1
        department:
          type: string
          description: Department
          maxLength: 255
          example: Sales
          nullable: true
        description:
          type: string
          description: Description
          maxLength: 65535
          example: Description
          nullable: true
        contact_person:
          type: string
          description: Contact person
          maxLength: 200
          example: John Doe
          nullable: true
        public_sector:
          type: boolean
          description: Indicates if the contact is a public administration
          default: false
        notes:
          type: string
          description: Notes
          maxLength: 65535
          example: Notes for the contact
          nullable: true
        brd_additional_data:
          type: string
          description: Additional data
          maxLength: 255
          example: Additional data
          nullable: true
        vat_payability:
          type: string
          enum:
            - I
            - D
            - S
            - null
          example: I
          description: |
            VAT collection
             * `I` - Immediate
             * `D` - Deferred
             * `S` - Party
          nullable: true
        certified_email:
          type: string
          description: |
            Used as the PEC (Posta Elettronica Certificata) address to send invoice through SDI.
            A certified email guarantees legal certainty of the sender's identity, of the date and time of sending and receiving the email, and of its content.
          maxLength: 255
          example: certified@example.com
          nullable: true
        recipient_code:
          type: string
          pattern: \w{6,7}
          description: |
            The recipient code is a 7-digit alphanumeric code that represents the telematic address of the electronic invoice receiver and is assigned by the SDI (Interchange System).
          maxLength: 7
          example: '1234567'
          nullable: true
        integration_code:
          type: string
          maxLength: 255
          description: |
            Internal code of the contact in the ERP.
            It is used by B2Brouter in the integration process to assign the document to this customer
          example: contact_erpcode12345
          nullable: true
        routing_codes:
