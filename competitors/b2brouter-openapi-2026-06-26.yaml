    TaxReportLine:
      type: object
      required:
        - quantity
        - description
        - price
        - tax_inclusive_amount
      description: A group of business terms providing information on individual Tax Report lines. This is used when creating TicketBAI and KSeF Tax Reports.
      properties:
        id:
          type: integer
          example: 435453
          description: A unique identifier for this TaxReportLine across all the system.
          readOnly: true
        quantity:
          anyOf:
            - type: number
            - type: string
          description: Invoiced quantity.
          example: 1
        price:
          anyOf:
            - type: number
            - type: string
          description: The price of an item, exclusive of VAT.
          example: 10
        description:
          type: string
          description: Item Name.
          maxLength: 65535
          nullable: true
          example: Item 1
        discount_amount:
          anyOf:
            - type: number
              nullable: true
            - type: string
          description: |
            Discount amount. 
            For KSeF it's the discount unit price.
          example: 1
        charge_amount:
          anyOf:
            - type: number
              nullable: true
            - type: string
          description: Charge amount.
          example: 4
        tax_inclusive_amount:
          anyOf:
            - type: number
              nullable: true
            - type: string
          description: The total amount of the line including taxes.
          example: 121
        tax_exclusive_amount:
          anyOf:
            - type: number
              nullable: true
            - type: string
          description: The total amount of the line excluding taxes.
          example: 100
        tax_amount:
          anyOf:
            - type: number
              nullable: true
            - type: string
          description: The total tax amount of the line.
          example: 21
        position:
          type: integer
          description: Position/sequence number of the line in the document. Specific to KSeF (Polish tax reporting).
          example: 1
          nullable: true
        unit_code:
          type: string
          description: Unit of measure code for the invoiced quantity. Specific to KSeF (Polish tax reporting).
          example: PCE
          nullable: true
        tax_code:
          type: string
          enum:
            - '23'
            - '22'
            - '8'
            - '7'
            - '5'
            - '4'
            - '3'
            - 0 WDT
            - 0 EX
            - 0 KR
            - zw
            - oo
            - np I
            - np II
          description: |
            Tax category/code for this line item. Specific to KSeF (Polish tax reporting).

            Valid values for KSeF:
            * `23` - Standard VAT rate 23%
            * `22` - Standard VAT rate 22%
            * `8` - Reduced VAT rate 8%
            * `7` - Reduced VAT rate 7%
            * `5` - Reduced VAT rate 5%
            * `4` - Reduced VAT rate 4%
            * `3` - Reduced VAT rate 3%
            * `0 WDT` - Intra-Community Supply 0% (Wewnątrzwspólnotowa Dostawa Towarów)
            * `0 EX` - Export 0%
            * `0 KR` - Domestic zero-rated 0%
            * `zw` - Exempt from VAT (zwolniona)
            * `oo` - Reverse charge domestic (odwrotne obciążenie)
            * `np I` - Not subject to VAT - cross-border services (nie podlega)
          example: '23'
          nullable: true
        ksef_amended:
          type: boolean
          description: Indicates if this line is part of an amendment/correction. Specific to KSeF (Polish tax reporting).
          example: false
          nullable: true
        item_seller_identifier:
          type: string
          nullable: true
          description: |-
            An identifier, assigned by the Seller, for the item.
            Used for TicketBAI and KSeF Tax Reports.
          example: SELLER-123
        item_standard_identifier:
          type: string
          nullable: true
          description: |-
            An item identifier based on a registered scheme (e.g. GTIN).
            Used for TicketBAI and KSeF Tax Reports.
          example: '05012345678900'
    TaxReport:
      type: object
      description: Represents a TaxReport object, such as the ones generated by Verifactu
      properties:
        id:
          type: integer
          example: 6560
          description: |
            An internal identifier that is unique to each **Tax report** within B2Brouter.
        type:
          type: string
          example: Verifactu
          enum:
            - Verifactu
            - TicketBai
            - Sdi
            - MyInvois
            - Zatca
            - Ksef
            - SiiDocument
        book_type:
          type: string
          enum:
            - Expedida
            - Recibida
            - Inversion
            - Intracomunitaria
            - Metalico
            - Seguro
            - Viajesagencia
            - Cobro
            - Pago
          description: |-
            Required when `type` is `SiiDocument`. Selects which SII book the record belongs to. Drives both the AEAT envelope (e.g. `SuministroLRFacturasEmitidas` for `Expedida`) and the validation rules applied at create time.
            * `Expedida` — issued invoices * `Recibida` — received invoices * `Inversion` — capital goods (bienes de inversión) * `Intracomunitaria` — intra-EU operations * `Metalico` — cash transactions (≥ €6,000 / counterparty / period) * `Seguro` — insurance operations * `Viajesagencia` — travel agency special regime * `Cobro` — payments received against issued invoices (A0 only;
              PATCH and DELETE return 422 — AEAT XSD has no A1/B variants)
            * `Pago` — payments made against received invoices (A0 only)
        invoice_id:
          type: integer
          example: 77
          description: |
            An internal identifier that is unique to each **Invoice** within B2Brouter.
          nullable: true
        state:
          type: string
          example: registered
          enum:
            - new
            - processing
            - signed
            - sending
            - sent
            - acknowledged
            - deposited
            - clearing
            - registered
            - registered_with_errors
            - error
            - refused
            - annullating
            - annulled
            - invalid
          description: |
            States for a Tax Report (not every authority uses every state):
              * `new` - The TaxReport is created and validated, ready for further actions.
              * `processing` - Initial state of a TaxReport. The report is being signed and validated.
              * `signed` - The report is signed and validated and ready for transmission.
              * `sending` - The report is in the queue for transmission.
              * `sent`  - The report was successfully transmitted.
              * `acknowledged` - The authority acknowledged receipt (e.g. DGFiP deposit ack).
              * `deposited` - The report was deposited on the authority platform (DGFiP Flux 1).
              * `clearing` - The report is awaiting clearance by the authority.
              * `registered` - The TaxReport has been registered by the Tax Authority.
              * `registered_with_errors` - Registered, but the authority returned per-record errors (SII `AceptadoConErrores`).
              * `error` - There was an error during submission, or it was rejected by the Tax Authority.
              * `refused` - The authority refused the submission.
              * `annullating` - An annullation (baja) is in progress.
              * `annulled` - The report was annulled.
              * `invalid` - The report failed validation checks.
          readOnly: true
        qr:
          type: string
          description: |
            The QR code codified in base64 of the tax report.
          readOnly: true
          nullable: true
        xml_base64:
          type: string
          description: |
            The XML representation of the tax report codified in base64.
          readOnly: true
          nullable: true
        identifier:
          type: string
          description: |
            Unique identifier for the tax report, usually assigned or provided by the Tax Authority.
            In the case of Verifactu, this field contains the URL hosted by the AEAT that allows the Buyer to check
            that the invoice has been properly submitted to the TA.
          readOnly: true
          nullable: true
        fingerprint:
          type: string
          description: |
            The unique hash that identifies the tax report.
          readOnly: true
          nullable: true
        previous_id:
          type: integer
          example: 6560
          description: |
            Internal identifier of the **Tax report** in the previous link of the chain.
          readOnly: true
          nullable: true
        sent_at:
          type: string
          format: date-time
          example: '2025-04-10T10:14:31Z'
          nullable: true
          readOnly: true
        digested_at:
          type: string
          format: date-time
          example: '2025-04-10T10:14:31Z'
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          example: '2025-04-10T10:14:21.157690000Z'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          example: '2025-04-10T10:14:29.259065000Z'
          readOnly: true
        label:
          type: string
          example: Verifactu A/1
        has_errors:
          type: boolean
          example: false
          description: Indicates if there are any errors in the report.
          readOnly: true
        errors:
          type: array
          description: |
            Errors associated with the tax report. For tax-authority rejections (e.g. an
