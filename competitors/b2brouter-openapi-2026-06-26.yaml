          type: integer
          description: payment_reminder_days
          writeOnly: true
          example: 15
        terms:
          type: string
          default: custom
          enum:
            - custom
            - '0'
            - '15'
            - '30'
            - '60'
            - '90'
            - '120'
            - 0m-1
            - 1m-1
            - 1m1
            - 2m1
            - 1m15
            - 1m20
            - 1m10
          description: |
            Term
            * `custom` - Custom
            * `0` - Upon Receipt
            * `15` - 15 days
            * `30` - 30 days
            * `60` - 60 days
            * `90` - 90 days
            * `120` - 120 days
            * `0m-1` - Last day this month
            * `1m-1` - Last day next month
            * `1m1` - 1st day next month
            * `2m1` - 1st day in two months
            * `1m15` - 15th day next month
            * `1m20` - 20th day next month
            * `1m10` - 10th day next month
          nullable: true
