             * `internal` (default) — B2BRouter integer unit id (listed below)
             * `unece_rec20` — UN/ECE Recommendation 20 code, e.g. `HUR`, `KGM`

            Internal unit ids:
            * `1` - units
            * `2` - hours
            * `3` - kilograms
            * `4` - liters
            * `5`  - other
            * `6`  - days
            * `7`  - boxes
            * `8`  - trays
            * `9`  - barrels
            * `10` - bags
            * `11` - carboys
            * `12` - bottles
            * `15` - centiliters
            * `16` - centimeters
            * `17` - bins
            * `18` - dozens
            * `19` - cases
            * `21` - grams
            * `22` - kilometers
            * `23` - cans
            * `24` - bunches
            * `25` - meters
            * `26` - milimeters
            * `28` - packages
            * `30` - rolls
            * `31` - envelopes
            * `32` - tubs
            * `33` - cubicmeter
            * `34` - second
            * `35` - watt
            * `36` - squaremetre
            * `37` - tonnes
            * `38` - megawatt-hours
            * `39` - months
            * `40` - years
            * `41` - one (synonym of "units")
          example: 1
        allowance_charges_attributes:
          type: array
          description: |
            Line-level allowances (discounts) and charges.

            Supports multiple allowances and charges for this invoice line.

            Line-level allowances cannot have their own tax configuration.

