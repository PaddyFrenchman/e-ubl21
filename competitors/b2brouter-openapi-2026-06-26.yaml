  /accounts/{account}/tax_reports/import:
    post:
      operationId: import-tax-report
      tags:
        - Tax Reports
      summary: Import a Tax Report from an XML file
      description: |-
        Import a Tax Report from an XML file
        If the creation of the Tax Report is successful, the response of this action will already contain the QR code and the identifier for the Tax Report. Note that if the XML file has chaining information (eg Huella for Verifactu), this information will be ignored and our system will perform the chaining process regardless. This is the only way to ensure the integrity of the data sent to the Tax Authority.
        Remember that you have to check the status of the tax report that we send in your behalf in order to be able to take the necessary actions in case any error or warning is issued by the Tax Authority. Because of the asynchronous nature of the tax report sending process, there is no guarantee that when you check the status of the tax reports it will already have the response of the Tax Authority. It usually takes a few seconds to complete the transaction. You will know that the transaction is complete if the response of the check of the status of the tax report has an status **registered**, **registered_with_errors***, or **error**. We recommend you retry the status check until you get a final state on your tax report, or that you configure [WebHooks](https://developer.b2brouter.net/reference/getnewtaxreportstatechange) for tax report state changes.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/account'
      requestBody:
        description: The Tax Report XML file to import
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Tax Report created successfully - returns full tax report representation
          content:
            application/json:
              schema:
                type: object
                properties:
                  tax_report:
                    $ref: '#/components/schemas/TaxReport'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
      security:
        - api_key: []
  /accounts/{account}/tax_report_batches:
    post:
      operationId: create-tax-report-batch
      tags:
        - Tax Reports
      summary: Bulk-create SII tax reports (async batch)
      description: |-
        Submits up to 5000 SII tax reports in one request as a batch.

        Processing is always asynchronous. This endpoint validates only the envelope (a `tax_reports` array within the size limit) and returns `202 Accepted` immediately with a `batch_id` and a `status_url`; the per-record build, validation and ledger attach run in a background job. Use `GET /accounts/{account}/tax_report_batches/{id}` (the returned `status_url`) to poll for results, or subscribe to the `sii_batch.finished` webhook event to be notified when the batch finishes.

        Each record is validated independently in the job — a failure on one record (bad `book_type`, XSD-invalid XML, unsupported `type`) does not abort the batch; it appears as a per-record `error` in the batch status. Non-SII `type` values are rejected per-record with the `unsupported_type` code.

        For the same request shape on a single record, use [POST /tax_reports](https://developer.b2brouter.net/reference/new-create-tax-report) instead.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/account'
      requestBody:
        description: An array of SII tax report objects.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tax_reports
              properties:
                tax_reports:
                  type: array
                  minItems: 0
                  maxItems: 5000
                  description: 'Up to 5000 tax_report payloads. Each must carry `type: ''SiiDocument''` and a valid `book_type`. Other fields follow the same shape as the per-record `POST /tax_reports`.'
                  items:
                    $ref: '#/components/schemas/TaxReport'
            examples:
              two_expedidas:
                summary: Two Expedida records
                value:
                  tax_reports:
                    - type: SiiDocument
                      book_type: Expedida
                      invoice_number: PB-2026-001
                      invoice_date: '2026-04-15'
                      fiscal_year: 2026
                      fiscal_period: 4
                      invoice_type_code: F1
                      special_regime_key: '01'
                      description: Servicio de prueba
