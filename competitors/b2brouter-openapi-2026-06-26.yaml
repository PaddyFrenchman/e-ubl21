                      tax_amount: 42
                      currency: EUR
                      tax_breakdowns:
                        - name: IVA
                          category: S
                          percent: 21
                          taxable_base: 200
                          tax_amount: 42
      responses:
        '202':
          description: Batch accepted for asynchronous processing. The body carries the batch id and a `status_url` to poll; no record is created yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id:
                    type: integer
                    description: Identifier of the batch; use it to poll the status endpoint.
                  status:
                    type: string
                    enum:
                      - processing
                    description: Always `processing` on this synchronous 202 — the ingest job has not run yet. Poll `status_url` (`GET /tax_report_batches/{id}`) for the terminal `done` state.
                  total:
                    type: integer
                    description: Number of records submitted.
                  status_url:
                    type: string
                    format: uri
                    description: Absolute URL of the batch-status endpoint.
              example:
                batch_id: 4567
                status: processing
                total: 2
                status_url: https://api-staging.b2brouter.net/accounts/12/tax_report_batches/4567
        '400':
          description: Top-level envelope error (missing `tax_reports` array, not an array, or record count exceeds 5000). Returned before anything is enqueued.
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The endpoint is SII-only; one or more records have an unsupported or missing `type` (only `SiiDocument` is accepted). Rejected synchronously with the `unsupported_type` code, before anything is enqueued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: unsupported_type
                      message:
                        type: string
      security:
        - api_key: []
  /accounts/{account}/tax_report_batches/{id}:
    get:
      operationId: get-tax-report-batch
      tags:
        - Tax Reports
      summary: Get the status of a bulk SII tax report batch
      description: Returns the outcome of a batch submitted to `POST /accounts/{account}/tax_report_batches`. While the background job runs `status` is `processing`; once it finishes `status` is `done` and `results` is populated, in submission order — a created `tax_report` on success, or the rejection `errors` on failure.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/account'
        - name: id
          in: path
          required: true
          description: The `batch_id` returned by the bulk-create endpoint.
          schema:
            type: integer
      responses:
        '200':
          description: The batch status and per-record results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id:
                    type: integer
                  status:
                    type: string
                    enum:
                      - processing
                      - done
                      - failed
                    description: '`processing` while the ingest job runs; `done` when it finished (per-record rejections included); `failed` when the job itself crashed — `results` shows what was processed before the crash, and records listed as `created` may not yet be attached for sending. Contact support referencing the `batch_id` instead of resubmitting, to avoid duplicates.'
                  summary:
                    type: object
                    properties:
                      total:
                        type: integer
                      accepted:
                        type: integer
                      rejected:
                        type: integer
                  results:
                    type: array
                    description: Per-record outcomes in submission order.
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                          description: Zero-based index of the record in the original request array.
                        status:
                          type: string
                          enum:
                            - created
                            - error
                        tax_report:
                          description: Present when `status` is `created`. Deliberately slim — correlation plus outcome; fetch the full record at `GET /tax_reports/{id}`.
                          type: object
                          properties:
                            id:
                              type: integer
                            state:
                              type: string
                              example: new
                            invoice_number:
                              type: string
                            book_type:
                              type: string
                              example: Expedida
                        errors:
                          type: array
                          description: Present when `status` is `error`.
                          items:
                            type: object
                            properties:
                              code:
                                type: string
                                example: invalid_book_type
                              message:
                                type: string
                              param:
                                type: string
                                example: book_type
              examples:
                done_mixed:
                  summary: Finished — 2 created, 1 rejected
                  value:
                    batch_id: 4567
                    status: done
                    summary:
                      total: 3
                      accepted: 2
                      rejected: 1
                    results:
                      - index: 0
                        status: created
                        tax_report:
                          id: 12345
                          state: new
                          invoice_number: PB-2026-001
                          book_type: Expedida
                      - index: 1
                        status: error
                        errors:
                          - code: invalid_book_type
                            message: 'Invalid or missing book_type ''NotAType''. Expected one of: Expedida, Recibida, Inversion, Intracomunitaria, Metalico, Seguro, Viajesagencia, Cobro, Pago'
                            param: book_type
                      - index: 2
                        status: created
                        tax_report:
                          id: 12346
                          state: new
                          invoice_number: PB-2026-003
                          book_type: Expedida
                still_processing:
                  summary: Job not finished yet
                  value:
                    batch_id: 4567
                    status: processing
                    summary:
                      total: 3
                      accepted: 0
                      rejected: 0
                    results: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - api_key: []
  /tax_reports/{id}:
    get:
      operationId: get-tax-report
      tags:
        - Tax Reports
      summary: Get a tax report
      description: |-
        Returns a tax report
        You have to check the status of the tax report that we send in your behalf in order to be able to take the necessary actions in case any error or warning is issued by the Tax Authority. Because of the asynchronous nature of the tax report sending process, there is no guarantee that when you check the status of the tax reports it will already have the response of the Tax Authority. It usually takes a few seconds to complete the transaction. You will know that the transaction is complete if the response of the check of the status of the tax report has an status **registered** or **error**. We recommend you retry the status check until you get a final state on your tax report or you configure [WebHooks](https://developer.b2brouter.net/reference/getnewTaxReportstatechange) for tax report state changes.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/tax_report_id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tax_report:
                    $ref: '#/components/schemas/TaxReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - api_key: []
    patch:
      operationId: modify-tax-report
      tags:
        - Tax Reports
      summary: Correct or Modify a Tax Report
      description: |-
        Correct or Modify a Tax Report
        If the tax report has already been registered by the Tax Authority, issue a correction ("subsanación" as it's call in Verifactu) of the tax report with the data provided in body.
        If the report has not been sent to the Tax Authority, change the fields indicated in the payload.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/tax_report_id'
      requestBody:
        required: true
        description: The Tax Report object in JSON format.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifactuTaxReportPatch'
            example:
              tax_report:
                type: Verifactu
                description: Correcció interna per sincronització cens AEAT
                customer_party_tax_id: B12345678
                customer_party_tax_scheme: VAT
                customer_party_country: ES
                customer_party_name: ACME SL
                previously_refused: S
                tax_breakdowns_attributes:
                  - id: 98765
                    special_regime_key: '01'
                    category: S
      responses:
        '200':
          description: Tax report modified
          content:
            application/json:
              schema:
                type: object
                properties:
                  tax_report:
                    $ref: '#/components/schemas/TaxReport'
        '201':
          description: Correction report created
          content:
            application/json:
              schema:
                type: object
                properties:
                  tax_report:
                    $ref: '#/components/schemas/TaxReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
        - api_key: []
    delete:
      operationId: annulate-tax-report
      tags:
        - Tax Reports
      summary: Annulates a tax report
      description: Annulates a TaxReport
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/tax_report_id'
      responses:
        '200':
          description: Tax report annulled (no separate annulment report returned)
          content:
            application/json:
              schema:
                type: object
                properties:
                  tax_report:
                    $ref: '#/components/schemas/TaxReport'
        '201':
          description: Annulment report created
          content:
            application/json:
              schema:
                type: object
                properties:
                  tax_report:
                    $ref: '#/components/schemas/TaxReport'
        '204':
          description: Tax report destroyed (it had not been emitted)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
        - api_key: []
  /tax_reports/{id}/download:
    get:
      operationId: new-download-tax-report
