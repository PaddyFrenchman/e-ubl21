            Not found. Returned when `parent_id` is provided but no contact with that ID exists in the account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: resource_missing
                      message:
