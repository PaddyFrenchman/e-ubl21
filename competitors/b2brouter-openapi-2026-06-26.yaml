                          tax_amount: 21
                    - type: SiiDocument
                      book_type: Expedida
                      invoice_number: PB-2026-002
                      invoice_date: '2026-04-15'
                      fiscal_year: 2026
                      fiscal_period: 4
                      invoice_type_code: F1
                      special_regime_key: '01'
                      description: Otro servicio
                      customer_party_name: Cliente Bulk S.L.
                      customer_party_tax_id: B87654321
                      customer_party_country: es
