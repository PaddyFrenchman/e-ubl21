            A dependency required to resolve the lookup failed. The `error.code` field carries the machine-readable reason. Two are structural problems of the participant's SMP and are not retriable — contact the participant's Peppol Access Point: `incomplete_businesscard`, `no_exportable_doctypes`. The third is transient: `upstream_unavailable` (an upstream directory service — Peppol or the DGFiP Annuaire — was temporarily unavailable); retry after the delay in the `Retry-After` response header.
          headers:
            Retry-After:
              description: Seconds to wait before retrying. Present only for `upstream_unavailable`.
              schema:
                type: integer
                example: 900
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: no_exportable_doctypes
                      message:
                        type: string
                        example: The SMP for participant 0208:0454483701 does not publish any exportable invoice document types. Please contact the participant's Peppol Access Point.
                      type:
                        type: string
                        example: invalid_request_error
      security:
        - api_key: []
  /directory/{country}/{id}:
    get:
      operationId: lookup-directory-by-country
      tags:
        - Lookup
      summary: Show company from Directory (by country code)
      description: |
        Return the information about specified company that lists in our Directory.

        The lookup is always asynchronous: the first request returns `202 Accepted` with a polling URL (there is no synchronous SML check). Retry the same request until it resolves to `200` (found), `404` (not in Peppol, nor in the DGFiP Annuaire for French identifiers), `422` (the identifier is not valid for any scheme of the country), or `424` (a dependency failed — see below).
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/directory_country'
        - $ref: '#/components/parameters/directory_id'
      responses:
        '200':
          description: Returns specified company from directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalCompany'
        '202':
          description: The lookup has been queued. Always returned on the first request, before Peppol and the Annuaire have been consulted. Retry the same request until it resolves.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: processing
                  message:
                    type: string
                    example: Querying directory. Please retry this request.
                  polling_url:
                    type: string
                    example: https://api.b2brouter.net/directory/es/ES12345678
        '401':
          description: Unauthorized
        '404':
          description: The participant was not found. Always deferred (after at least one 202); confirms both Peppol and — for French identifiers — the DGFiP Annuaire were consulted, not just the SML.
        '422':
          description: |
            The identifier is not valid for any scheme of the requested country. The `error.code` is `parameter_invalid`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: parameter_invalid
                      message:
                        type: string
                        example: Identifier is not valid for the requested scheme
                      type:
                        type: string
                        example: invalid_request_error
        '424':
          description: |
            A dependency required to resolve the lookup failed. The `error.code` field carries the machine-readable reason. Two are structural problems of the participant's SMP and are not retriable — contact the participant's Peppol Access Point: `incomplete_businesscard`, `no_exportable_doctypes`. The third is transient: `upstream_unavailable` (an upstream directory service — Peppol or the DGFiP Annuaire — was temporarily unavailable); retry after the delay in the `Retry-After` response header.
          headers:
            Retry-After:
              description: Seconds to wait before retrying. Present only for `upstream_unavailable`.
              schema:
                type: integer
                example: 900
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: no_exportable_doctypes
                      message:
                        type: string
                        example: The SMP for participant 0208:0454483701 does not publish any exportable invoice document types. Please contact the participant's Peppol Access Point.
                      type:
                        type: string
                        example: invalid_request_error
      security:
        - api_key: []
  /tin_verifications:
    post:
      operationId: create-tin-verification
      tags:
        - TIN Verifications
      summary: Create a TIN verification request
      description: |-
        Submits a batch of TIN (Tax Identification Number) + name pairs for verification against a tax authority census.

        Processing is always asynchronous. This endpoint returns `202 Accepted` immediately with the request ID and `pending` status. Use the `GET /tin_verifications/{id}` endpoint to poll for results, or subscribe to the `tin_verification.finished` webhook event to be notified when processing completes.

        **Supported countries:** Currently only Spain (`es`) is supported. The TIN+name pair is validated against the AEAT (Agencia Estatal de Administraci\u00F3n Tributaria) census.

        **Caching:** Results from the last 24 hours are cached. If a TIN was recently verified, the cached result is reused without making a new call to the tax authority.

        **Billing:** Each request counts as one billable transaction (only on success).

        **Limits:** Maximum 20,000 entities per request.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - name: country
          in: query
          required: true
          description: ISO 3166-1 alpha-2 country code. Determines which tax authority census to verify against. Currently only `es` (Spain) is supported.
          schema:
            type: string
            enum:
              - es
          example: es
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Array of TIN+name pairs to verify. Each item must contain a `tin` and a `name` field.
              minItems: 1
              maxItems: 20000
              items:
                type: object
                required:
                  - tin
                  - name
                properties:
                  tin:
                    type: string
                    description: The Tax Identification Number to verify. May include the country prefix (e.g. `ESB86561412`) — it will be stripped during normalization.
                    example: B86561412
                  name:
                    type: string
                    description: The entity name to verify against the census.
                    example: EMPRESA EXEMPLE SA
            example:
              - tin: B86561412
                name: EMPRESA EXEMPLE SA
              - tin: 12345678Z
                name: GARCIA LOPEZ MARIA
      responses:
        '202':
          description: Request accepted for async processing. Poll `GET /tin_verifications/{id}` for results or subscribe to the `tin_verification.finished` webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TinVerificationRequest'
              example:
                id: 42
                status: pending
                results: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - api_key: []
  /tin_verifications/{id}:
    get:
      operationId: get-tin-verification
      tags:
        - TIN Verifications
      summary: Get a TIN verification request
      description: |-
        Retrieves the current status and results of a TIN verification request.

        While the request is `pending` or `processing`, the `results` array will be empty. Once the status transitions to `success` or `failed`, the array is populated with one result per submitted TIN+name pair.

        If the request `failed`, an `error_message` field describes what went wrong.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - name: id
          in: path
          required: true
          description: ID of the TIN verification request.
          schema:
            type: integer
          example: 42
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TinVerificationRequest'
              example:
                id: 42
                status: success
                results:
                  - tin: B86561412
                    normalized_tin: B86561412
                    name: EMPRESA EXEMPLE SA
                    tin_format_valid: true
                    census_match: true
                  - tin: 12345678Z
                    normalized_tin: 12345678Z
                    name: GARCIA LOPEZ MARIA
                    tin_format_valid: true
                    census_match: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - api_key: []
  /documents/validate:
    post:
      operationId: validate-document
      tags:
        - Validation
      summary: Validates an electronic document
      description: |
        This endpoint validates a single electronic document provided in the request body. 

        The validation of the e-document is performed through:

        - Checking the use of a correct syntax schema (XSD).
        - Checking the business rules depending on the document type (Schematron).

        The following formats can be validated:
        - UBL (Universal Business Language)
        - CII (Cross Industry Invoice)
        - Peppol BIS
        - PINT (JP, SG, MY, AUNZ)
        - ZUGFeRD
        - XRechnung
        - Factur-X
        - FacturaE
        - Svefaktura
        - Fattura PA
        - eSPap
        - Any EN16931 CIUS-compliant format
      parameters:
        - $ref: '#/components/parameters/api_version_header'
      requestBody:
        description: The document file to validate.
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentValidation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - api_key: []
  /web_hooks:
    get:
      operationId: get-web-hooks
      tags:
        - Web Hooks
      summary: List web hooks
      description: |-
        Retrieves a list of Web Hooks.
        This endpoint returns all Web Hooks associated with the authenticated integration group, including their configuration details such as destination URL, enabled status, subscribed events, and description.
        Use this operation to audit existing Web Hooks, verify active event subscriptions, or manage multiple Web Hook configurations from a single place.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  web_hooks:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebHook'
                  meta:
                    $ref: '#/components/schemas/IndexMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - api_key: []
    post:
      operationId: create-web-hook
      tags:
        - Web Hooks
      summary: Create a new web hook
      description: |-
        Creates a new Web Hook configuration.
        A Web Hook allows you to register an HTTP endpoint that will receive real-time notifications when specific events occur in the platform, such as tax report, issued invoice, or ledger state changes.
        When creating a Web Hook, you must specify the destination URL and the events you want to subscribe to. The Web Hook will be created under the integration group associated with the API key.
        By default, newly created Web Hooks are enabled. When enabled, the platform will send HTTP POST requests to the configured URL whenever one of the subscribed events is triggered.
        Note: If you create the Web Hook with enabled=false, events may be omitted, but they will be required again when enabling the Web Hook.
        Use this endpoint to start receiving asynchronous notifications instead of continuously polling the API for status changes.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - web_hook
              properties:
                web_hook:
                  allOf:
                    - $ref: '#/components/schemas/WebHook'
                    - required:
                        - url
                        - events
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  web_hook:
                    $ref: '#/components/schemas/WebHook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
        - api_key: []
  /web_hooks/{id}:
    get:
      operationId: get-web-hook
      tags:
        - Web Hooks
      summary: Get a web hook
      description: |-
        Retrieves the configuration of a specific Web Hook.
        A Web Hook defines an HTTP endpoint that will receive event notifications from the platform (such as tax report, issued invoice, or ledger state changes). This endpoint allows you to fetch the current settings of an existing Web Hook, including its target URL, enabled status, subscribed events, description, and integration group association.
        Use this operation to inspect or verify the configuration of a Web Hook before updating it, troubleshooting delivery issues, or auditing event subscriptions.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/web_hook_id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  web_hook:
                    $ref: '#/components/schemas/WebHook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - api_key: []
    patch:
      operationId: update-web-hook
      tags:
        - Web Hooks
      summary: Modify a web hook
      description: |-
        Updates the configuration of an existing Web Hook.
        This endpoint allows you to modify one or more properties of a Web Hook, such as the destination URL, enabled status, subscribed events or the description.
        Changes are applied immediately. Once updated and enabled, the Web Hook will continue delivering HTTP POST notifications according to the new configuration.
        Use this operation to temporarily disable a Web Hook, adjust event subscriptions, rotate the target URL, or update the description without creating a new Web Hook.
        Note: The request must include the web_hook root object. Also, when enabled=true, events must be present and non-empty (validation rule).
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/web_hook_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - web_hook
              properties:
                web_hook:
                  $ref: '#/components/schemas/WebHook'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  web_hook:
                    $ref: '#/components/schemas/WebHook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
        - api_key: []
    delete:
      operationId: delete-web-hook
      tags:
        - Web Hooks
      summary: Deletes a web hook
      description: |-
        Deletes an existing Web Hook.
        Once a Web Hook is deleted, its configuration is permanently removed and the platform will immediately stop sending event notifications to its associated endpoint.
        This operation cannot be undone. Use this endpoint when a Web Hook is no longer needed or when you want to permanently stop receiving notifications for its subscribed events.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/web_hook_id'
      responses:
        '200':
          description: Successful deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  web_hook:
                    $ref: '#/components/schemas/WebHook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - api_key: []
components:
  securitySchemes:
    api_key:
      type: apiKey
      description: API Key of your account
      name: X-B2B-API-Key
      in: header
  parameters:
    api_version_header:
      name: X-B2B-API-Version
      in: header
      description: |
        Specifies the version of the API to use in this request. If not specified uses the API-Version set in the group conifguration
        B2Brouter UI Application -> Developers -> API Keys -> API Version
      required: false
      schema:
        type: string
        example: '2026-06-26'
        default: '2026-06-26'
    offset:
      name: offset
      description: Jump to the first object.
      in: query
      required: false
      schema:
        type: integer
        default: 0
        example: 0
    limit:
      name: limit
      description: Number of items in the response (500 maximum)
      in: query
      required: false
      schema:
        type: integer
        default: 25
        example: 25
    account:
      name: account
      in: path
      description: Account identifier (ID)
      required: true
      schema:
        type: string
      example: my-account
    attachment_id:
      name: id
      in: path
      description: |
        An internal identifier that is unique to each **Attachment** within B2Brouter.
      required: true
      example: 4053100
      schema:
        type: integer
    tax_authority_code:
      name: code
      description: Code of tax report setting
      in: path
      required: true
      schema:
        type: string
        example: verifactu
        enum:
          - tbai
          - sdi
          - lhdn
          - verifactu
          - ksef
          - dgfip
    invoice_id:
      name: id
      in: path
      description: |
        An internal identifier that is unique to each **Invoice** within B2Brouter.
      required: true
      example: 4053100
      schema:
        type: integer
    include:
      name: include
      in: query
      description: 'Comma-separated list of additional fields to include in the response. Available fields: `lines`, `detailed_lines`, `apply_to_local_government_unit`, `apply_to_vat_group_member`, `third_party`.'
      schema:
        type: string
      example: detailed_lines
    disposition:
      name: disposition
      in: query
      description: In PDF, view the PDF file instead of downloading
      schema:
        type: string
        enum:
          - inline
        example: inline
    ack:
      name: ack
      in: query
      description: Mark the invoice as acknowledged.
      required: false
      schema:
        type: boolean
      example: true
    document_type_code:
      name: document_type_code
      in: path
      description: |
        An internal identifier that is unique to each **Document Type** within
        B2Brouter.<br> You can get all valid document type codes using the **Document
        Types** endpoint in Code lists section (`/document_types`).

        Additional values:
        - `original` — returns the imported/received document as-is.
        - `legal` — returns the stored legal document: for issued invoices, the
          document as delivered; for received invoices, the original as received.
      required: true
      example: xml.facturae.3.2
      schema:
        $ref: '#/components/schemas/DocumentTypeCode'
    type:
      name: type
      description: Filter on invoice type.
      in: query
      schema:
        type: string
        enum:
          - IssuedInvoice
          - ReceivedInvoice
          - IssuedSelfInvoice
          - IssuedSimplifiedInvoice
          - ReceivedSelfInvoice
        default: IssuedInvoice
    ack_filter:
      name: ack
      in: query
      description: Filter documents with ACK.
      required: false
      schema:
        type: boolean
      example: true
    date_from:
      name: date_from
      in: query
      description: Filter from submission date.
      required: false
      schema:
        type: string
        format: date
      example: '2024-09-12'
    date_to:
      name: date_to
      in: query
      description: Filter to submission date
      required: false
      schema:
        type: string
        format: date
      example: '2024-09-12'
    due_date_from:
      name: due_date_from
      in: query
      description: Filter from due date
      required: false
      schema:
        type: string
        format: date
      example: '2024-09-12'
    due_date_to:
      name: due_date_to
      in: query
      description: Filter to due date
      required: false
      schema:
        type: string
        format: date
      example: '2024-09-12'
    number:
      name: number
      in: query
      description: Filter on invoice number.  Performs a prefix match search; invoices whose number starts with the specified value will be returned.
      required: false
      schema:
        type: string
      example: '10'
    series_code:
      name: series_code
      in: query
      description: Filter on invoice series code. Performs an exact match search.
      required: false
      schema:
        type: string
      example: S01
    state_updated_at_from:
      name: state_updated_at_from
      in: query
      description: Filter on change status date. Invoices with change status date later than the specified date are returned
      required: false
      schema:
        type: string
        format: date
      example: '2024-09-12'
    updated_at_from:
      name: updated_at_from
      in: query
      description: Filter on updated_at date. Entities with updated_at date later than the specified date are returned.
      required: false
      schema:
        type: string
        format: date
      example: '2024-10-11'
    tin_value:
      name: tin_value
      in: query
      description: Filter on customer VAT code
      required: false
      schema:
        type: string
      example: ESP2807900B
    cin_value:
      name: cin_value
      in: query
      description: Filter on customer Company Identification Number
      required: false
      schema:
        type: string
      example: 7080000950171
    new:
      name: new
      description: Filter on invoice status "new". Created and ready to be sent
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1
        enum:
          - 0
          - 1
        example: 1
    sending:
      name: sending
      description: Filter on invoice status "sending". Invoice is being sent
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1
        enum:
          - 0
          - 1
        example: 1
    error:
      name: error
      description: Filter on invoice status "error". An error has been raised when sending the invoice to its recipient
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1
        enum:
          - 0
          - 1
        example: 1
    sent:
      name: sent
      description: Filter on invoice status "sent". Successfully sent to its recipient
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1
        enum:
          - 0
          - 1
        example: 1
    refused:
      name: refused
      description: Filter on invoice status "refused". The recipient has refused the invoice. Usually, the reason for the rejection is provided
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1
        enum:
          - 0
          - 1
        example: 1
    closed:
      name: closed
      description: Filter on invoice status "closed". The sender considers that the invoice is closed and does not want to perform further operations
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1
        enum:
          - 0
          - 1
        example: 1
    registered:
      name: registered
      description: Filter on invoice status "registered". The receiver has registered the invoice. Some receivers may indicate a registration number
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1
        enum:
          - 0
          - 1
        example: 1
    accepted:
      name: accepted
      description: Filter on invoice status "accepted". The receiver has accepted the invoice
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1
        enum:
          - 0
          - 1
        example: 1
    downloaded:
      name: downloaded
      description: Filter on invoice status "downloaded".
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1
        enum:
          - 0
          - 1
        example: 1
    annotated:
      name: annotated
      description: Filter on invoice status "annotated".
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1
        enum:
          - 0
          - 1
        example: 1
    allegedly_paid:
      name: allegedly_paid
      description: Filter on invoice status "allegedly_paid". The receiver has indicated that he has ordered the payment of the invoice
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1
        enum:
          - 0
          - 1
        example: 1
    paid:
      name: paid
      description: Filter on invoice status "paid".
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1
        enum:
          - 0
          - 1
        example: 1
    received_invoice_received:
      name: received
      description: Filter on received invoices with status "received".
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1
        enum:
          - 0
          - 1
        example: 1
    received_invoice_ocr_failed:
      name: ocr_failed
      description: Filter on received invoices with status "ocr_failed".
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1
        enum:
          - 0
          - 1
        example: 1
    received_invoice_exclude_offices:
      name: exclude_offices
      description: Do not show the invoices of the Organizational Units.
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1
        enum:
          - 0
          - 1
        example: 1
    from_net:
      name: from_net
      in: query
      description: Filter on received invoice from net value. Use as a string search, for example, searching "api" lists all the received invoices that are received via API.
      required: false
      schema:
        type: string
      example: api
    send_after_import:
      name: send_after_import
      in: query
      description: |
        Indicates whether the invoice should be automatically processed after import.

        When set to `true` and the invoice passes validations:
          * For sending transports (non-`download`), the invoice is queued to be sent asynchronously.
          * For `download` transport, the invoice is not sent. Instead, if tax report generation is enabled and required for this invoice, the invoice will be issued and the tax report generated 
            (invoice ends in `state=issued` and exposes `tax_report_ids`). Otherwise, the invoice may end in `state=error`.

        **Note:** This option is incompatible with the custom signature configuration.
      required: false
      schema:
        $ref: '#/components/schemas/SendAfterImport'
    issue_after_import:
      name: issue_after_import
      in: query
      description: |
        Indicates whether the invoice should be issued synchronously after import (c1 → issued) without going through the transport send flow.

        When set to `true` and the invoice passes validations:
          * The invoice transitions to `state=issued` inline.
          * If the account has a `before_send` tax report setting enabled with `auto_generate` on and the invoice qualifies, the tax report is generated inline and exposed via `tax_report_ids`. When `auto_generate` is off the invoice is still issued but no report is created, consistent with the send flow — those reports are managed through the Tax Reports API.
          * Authorities that report after sending (for example SII or SDI) are not triggered by issuing; their reports are created when the invoice is sent or marked as sent.
          * No background send job is enqueued; the transport-level state remains untouched.
          * While in `state=issued` the invoice becomes read-only: it cannot be updated, deleted, or reverted to `new` until it is sent or downloaded.

        If both `send_after_import` and `issue_after_import` are `true`, `send_after_import` wins. Ignored for non-invoice documents.
      required: false
      schema:
        $ref: '#/components/schemas/IssueAfterImport'
    transport_type_code_for_contact:
      name: transport_type_code_for_contact
      description: |
        Internal identifier that specifies the **Transport type** used for the **contact party** of the invoice within B2Brouter. This code determines the transport in which the document is exchanged with the contact entity.

        - If the contact already exists, this value will **overwrite** the existing `transport_type_code`.
        - If the parameter is **not provided**, the system assigns the `transport_type_code` based on the following priority:

          1. If the contact already exists, its current `transport_type_code` is used.
          2. If the contact does not exist:
             - If the contact is found in the **B2Brouter directory**, the code defined there is used.
             - Otherwise, the **default transport type** defined in the account settings is applied.

        Valid transport type codes can be retrieved from the **Transport Types** endpoint in the **Code Lists** section:  
        `/transport_types`

        If the specified `transport_type_code` is **invalid** or **incompatible**, the system will apply the **default** `transport_type_code` and `document_type_code`.
      in: query
      schema:
        $ref: '#/components/schemas/TransportTypeCode'
    document_type_code_for_contact:
      name: document_type_code_for_contact
      in: query
      description: |
        Internal identifier that specifies the **Document Type** used for the **contact party** of the invoice within B2Brouter. This code determines the format in which the document is exchanged with the contact entity.

        - If the contact already exists, this value will **overwrite** the existing `document_type_code`.
        - If the parameter is **not provided**, the system assigns the `document_type_code` based on the following priority:

          1. If the contact already exists, its current `document_type_code` is used.
          2. If the contact does not exist:
             - If the contact is found in the **B2Brouter directory**, the code defined there is used.
             - Otherwise, the **default document type** defined in the account settings is applied.

        Valid document type codes can be retrieved from the **Document Types** endpoint in the **Code Lists** section:  
        `/document_types`

        If the specified `document_type_code` is **invalid** or **incompatible** with the selected `transport_type_code`, the system will apply the **default** `transport_type_code` and `document_type_code`.
      example: xml.ubl.invoice.bis3
      schema:
        $ref: '#/components/schemas/DocumentTypeCode'
    issued:
      name: issued
      in: query
      description: |
        A flag that specifies whether the invoice to be imported is issued or received.
      required: false
      schema:
        type: boolean
        default: null
    filename:
      name: filename
      in: query
      description: |
        Name of the attachment.
      required: true
      example: test.pdf
      schema:
        type: string
    use_as_pdf_view:
      name: use_as_pdf_view
      in: query
      description: |
        Boolean to indicate that the uploaded PDF attachment should be used as the visual component 
        when generating a hybrid PDF (such as a ZUGFeRD document) or any legal PDF representation.
        When set to true, this attachment will be considered the legal PDF to display or embed, 
        instead of regenerating one from the invoice data. It can be used both for PDF deliveries 
        and for embedding XML (e.g., ZUGFeRD) into the provided PDF.

        NOTICE: If the invoice is modified after this PDF has been uploaded, the attachment will still be used as-is, unless explicitly replaced. 
        B2Brouter treats it as the legal representation provided by the account.
      required: false
      example: true
      schema:
        type: boolean
    order_id:
      name: id
