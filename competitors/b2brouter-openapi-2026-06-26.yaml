          type: string
          format: date
          description: |
            Date of file
            [Facturae Only] Tag: FileDATE
          nullable: true
          example: '2024-09-12'
        invoicing_period_start:
          type: string
          format: date
          description: |
            Invoice line period start date. The date when the Invoice period for this Invoice line starts.

            ID: `BT-134`
          maxLength: 255
          example: '2017-10-10'
          nullable: true
        invoicing_period_end:
          type: string
          format: date
          description: |
            Invoice line period end date. The date when the Invoice period for this Invoice line ends.

            ID: `BT-135`
          maxLength: 255
          example: '2017-10-15'
          nullable: true
        issuer_transaction_reference:
          type: string
          description: Receiving advice
          maxLength: 255
          nullable: true
          example: '123'
        issuer_transaction_date:
          type: string
          format: date
          description: |
            Date of issuer's operation
            [Facturae Only] Tag: IssuerTransactionDate
          nullable: true
          example: '2024-09-12'
        notes:
          type: string
          description: |
            A description for an item.

            ID: `BT-154`
          maxLength: 65535
          example: Long description of the item on the invoice line
          nullable: true
        ponumber:
          type: string
          description: |
            Purchase Order Number. An identifier for an object on which the invoice line is based, given by the Seller.


            ID: `BT-128`
          maxLength: 255
          example: PO123
          nullable: true
        receiver_transaction_date:
          type: string
          format: date
          description: |
            Date of recipient's operation
            [FacturaE Only]
          nullable: true
          example: '2024-09-12'
        receiver_contract_reference:
          type: string
          description: Assignment code
          maxLength: 255
          example: reference_123
          nullable: true
        receiver_contract_date:
          type: string
          format: date
          description: |
            Date of the recipient's contract
            [FacturaE Only]
          nullable: true
          example: '2024-09-12'
        sequence_number:
          type: string
          description: |
            Sequence number. An identifier for a referenced line within a purchase order, issued by the Buyer.

            ID: `BT-132`
          example: '3'
          nullable: true
        contact_reference:
          type: string
          description: |
            Accounting Cost

            ID: `BT-133`
          example: '3'
          nullable: true
          writeOnly: true
        receipt_reference:
          type: object
          description: The information about the referenced Receipt. Used only in FatturaPA exportation.
          properties:
            identifier:
              type: string
              description: The alphanumeric identifier of the receipt (or of the RT/server RT).
              nullable: true
              example: '123456'
            number:
              type: integer
              description: The progressive number of the receipt (or of the receipt or of the commercial commercial document).
              nullable: true
              example: 123
            date:
              type: string
              format: date
              description: The date of the receipt.
              nullable: true
              example: '2024-09-12'
        additional_item_properties_attributes:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalItemProperty'
          writeOnly: true
        additional_item_properties:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalItemProperty'
          readOnly: true
    PaymentDues:
      type: object
      description: Represents a payment due as an object
      properties:
        due_date:
          type: string
          format: date
          example: '2024-09-12'
        amount:
          type: number
          example: 10
    InvoiceReference:
      type: object
      description: |
        A reference to another invoice. Used for:
        - **amend**: corrective invoices referencing the original invoice (max 1 per invoice)
        - **prepayment**: settlement invoices (ROZ) referencing advance payment invoices (ZAL)
      required:
        - reference_type
      properties:
        id:
          type: integer
          description: Unique identifier of the invoice reference.
          readOnly: true
        reference_type:
          type: string
          enum:
            - amend
            - prepayment
          description: |
            Type of reference:
            - `amend` — this invoice corrects the referenced invoice. Only one amend reference per invoice.
            - `prepayment` — this invoice settles a prior advance payment invoice. Multiple allowed.
        referenced_invoice_id:
          type: integer
          description: |
            Identifier of the referenced invoice within B2BRouter.
            `null` when the reference points to an invoice not held in B2BRouter
            (e.g. an amend identified only by external number/series/date).
          readOnly: true
          nullable: true
        number:
          type: string
          description: |
            Invoice number of the referenced invoice.
            Auto-populated from referenced_invoice_id if provided.
          maxLength: 60
          nullable: true
          example: FZ2026/02/150
        series_code:
          type: string
          description: Series code of the referenced invoice.
          maxLength: 150
          nullable: true
        date:
          type: string
          format: date
          description: Issue date of the referenced invoice.
          nullable: true
          example: '2026-02-15'
        reason:
          type: string
          description: |
            Reason for the correction (amend references only).
            For Facturae: amend reason code (01-85).
          maxLength: 130
          nullable: true
        tax_correction_code:
          type: string
          description: |
            Tax correction type code (amend references only).
            For KSeF: TypKorekty (1=effect on original date, 2=effect on corrective date, 3=different date).
          maxLength: 10
          nullable: true
          example: '1'
        tax_registration_code:
          type: string
          description: |
            Tax authority registration code of the referenced invoice.
            For KSeF: the NrKSeF number (e.g. `9999999999-20260215-8BEF280C8D35-4D`).
          maxLength: 100
          nullable: true
          example: 9999999999-20260215-8BEF280C8D35-4D
        correction_method:
          type: string
          description: |
            Correction method (amend references only).
            For Facturae: 01=full replacement, 02=differences, 03=bulk deal, 04=authorized by tax agency.
          enum:
            - '01'
            - '02'
            - '03'
            - '04'
          nullable: true
        total_amount:
          type: number
          format: float
          description: |
            Total amount of the referenced invoice.
            For KOR_ZAL: this is P_15ZK (the P_15 value of the corrected ZAL invoice).
            Auto-populated from the referenced invoice total when referenced_invoice_id is provided.
          nullable: true
          example: 20000
        currency:
          type: string
          description: Currency of the total_amount (ISO 4217).
          maxLength: 3
          nullable: true
          example: PLN
        _destroy:
          type: boolean
          description: Set to true to delete this reference on update.
          writeOnly: true
    AllowanceCharge:
      allOf:
        - $ref: '#/components/schemas/AllowanceChargeBase'
        - type: object
          description: Represents an allowance (discount) or charge on an invoice or invoice line
          properties:
            apply_taxes:
              type: boolean
              description: |
                Indicates whether taxes should be applied to this allowance or charge.
                Defaults to `true` for allowances. For charges, defaults to `true` if the company has the "apply taxes to charge" setting enabled, `false` otherwise.
            tax_attributes:
              allOf:
                - $ref: '#/components/schemas/Tax'
              description: |
                Tax to be applied to this allowance or charge.
                Only applicable when apply_taxes is true.
                If not specified and apply_taxes is true, will inherit from invoice taxes.
              writeOnly: true
            tax:
              allOf:
                - $ref: '#/components/schemas/Tax'
              description: |
                The tax applied to this allowance or charge.
                Only present when apply_taxes is true.
              readOnly: true
    InvoiceAllowanceCharge:
      allOf:
        - $ref: '#/components/schemas/AllowanceCharge'
        - type: object
          description: Invoice-level allowance charge that supports tax configuration
    Invoice:
      type: object
      description: Represents an invoice as an object
      properties:
        id:
          type: integer
          example: 4053100
          description: |
            A unique internal identifier of the Invoice in B2Brouter.
          readOnly: true
        type:
          type: string
          description: Invoice type
          example: IssuedInvoice
          enum:
            - IssuedInvoice
            - ReceivedInvoice
            - IssuedSelfInvoice
            - IssuedSimplifiedInvoice
          default: IssuedInvoice
        number:
          type: string
          example: '3'
          description: |
            A unique identification of the Invoice.

            ID: `BT-1`
          maxLength: 100
        series_code:
          type: string
          example: S01
          nullable: true
          description: |
            The series code of the Invoice.
        to_net:
          type: string
          readOnly: true
          nullable: true
          example: it.sdi
          description: |
            The code of the Transport Type through which the invoice was delivered. It is set when the invoice is sent successfully, and remains empty while the invoice has not been sent.<br> You can get all valid transport type codes using the **Transport Types** endpoint in Code lists section (`/transport_types.{format}`).
        to_net_id:
          type: string
          readOnly: true
          nullable: true
          example: '12345678901'
          description: |
            The identifier that the destination network assigned to the invoice when it accepted the delivery, for the networks that return one. For example, the *IdentificativoSdI* for `it.sdi` or the KSeF reference number for `pl.ksef`.
        from_net:
          type: string
          readOnly: true
          nullable: true
          example: peppol
          description: |
            The origin of the invoice. For invoices received through a network it is the code of the Transport Type they arrived through, for example `peppol` or `email`. Invoices that did not arrive through a network are tagged with their origin instead: `api` when created through the API, `uploaded` or `sftp` when imported.
        from_net_id:
          type: string
          readOnly: true
          nullable: true
          example: '202600012345'
          description: |
            The identifier that the source network assigned to the invoice when it was received, for the networks that provide one.
        account:
          type: object
          properties:
            id:
              type: integer
              example: 742
              description: Account ID
            name:
              type: string
              example: Project Trading Name
              description: Account Name
          readOnly: true
        company:
          type: object
          properties:
            id:
              type: integer
              example: 742
              description: Unique identifier for the company.
            name:
              type: string
              example: Company Trading Name
              description: |
                A name by which the Seller/Buyer is known, other than Seller/Buyer name (also known as Business name).

                ID: `BT-27` and `BT-28` if the company is the Seller Party (in case to be a IssuedInvoice).
                ID: `BT-44` and `BT-45` if the company is the Buyer Party (in case to be a ReceivedInvoice).
            tin_value:
              type: string
              description: |
                VAT identifier
                ID: `BT-31` if the company is the Seller Party (in case to be a IssuedInvoice). ID: `BT-48` if the company is the Buyer Party (in case to be a ReceivedInvoice).
              maxLength: 255
              example: ESA13585625
            tin_scheme:
              type: string
              description: |
                The scheme identifier of VAT Number
                You can get all schemes codes using the **Schemes* endpoint in Code lists section (`/schemes`).
              example: '9920'
              nullable: true
            cin_scheme:
              type: string
              description: |
                The scheme identifier of Company Identifier Number (not a tax identifier number).
                You can get all schemes codes using the **Schemes* endpoint in Code lists section (`/schemes`).
              example: '0002'
              nullable: true
            cin_value:
              type: string
              description: Company Identifier Number
              example: '500643911'
              nullable: true
            address:
              type: string
              description: |
                The main address line in an address.

                ID: `BT-35` if the company is the Seller Party (in case to be a IssuedInvoice).
                ID: `BT-50` if the company is the Buyer Party (in case to be a ReceivedInvoice).
              example: Main Street 1
              nullable: true
            address2:
              type: string
              description: |
                An additional address line in an address that can be used to give further details supplementing the main line.

                ID: `BT-36` if the company is the Seller Party (in case to be a IssuedInvoice).
                ID: `BT-51` if the company is the Buyer Party (in case to be a ReceivedInvoice).
              example: Po Box 351
              nullable: true
            postalcode:
              type: string
              description: |
                The identifier for an addressable group of properties according to the relevant postal service.

                ID: `BT-38` if the company is the Seller Party (in case to be a IssuedInvoice).
                ID: `BT-53` if the company is the Buyer Party (in case to be a ReceivedInvoice).
              example: 34567
              nullable: true
            city:
              type: string
              description: |
                The common name of the city, town or village,where the Seller/Buyer address is located.

                ID: `BT-37` if the company is the Seller Party (in case to be a IssuedInvoice).
                ID: `BT-52` if the company is the Buyer Party (in case to be a ReceivedInvoice).
              example: Stockholm
              nullable: true
            province:
              type: string
              description: |
                The  subdivision  of  a  country. Such as a region, a county, a state, a province, etc.

                ID: `BT-39` if the company is the Seller Party (in case to be a IssuedInvoice).
                ID: `BT-54` if the company is the Buyer Party (in case to be a ReceivedInvoice).
              example: Region A
              nullable: true
            country:
              type: string
              description: |
                A code that identifies the country.

                ID: `BT-40` if the company is the Seller Party (in case to be a IssuedInvoice).
                ID: `BT-55` if the company is the Buyer Party (in case to be a ReceivedInvoice).
              example: se
              nullable: true
          readOnly: true
        contact_id:
          type: integer
          description: |
            If the customer exists on B2Brouter and you know its ID, you can
            pass it, inside invoice hash, with contact_id. If it does not exist
            or you don’t know its ID, you can pass a hash with contact
            attributes, inside the invoice hash.

            Ignored for `IssuedSimplifiedInvoice`. Use the contact hash to set buyer data
          writeOnly: true
          example: 123
        contact:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/InvoiceContactHash'
        state:
          allOf:
            - $ref: '#/components/schemas/StateOutput'
          readOnly: true
        refuse_reason:
          type: string
          example: Incorrect invoice amount
          description: The reason provided for refusing the invoice.
          readOnly: true
          nullable: true
        refuse_reason_code:
          nullable: true
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/InvoiceMarkAsReasonCode'
            - description: |
                The DGFiP structured reason code from the refusal event.
                Populated only when a `reason_code` was supplied in the mark_as request; null otherwise.
        date:
          type: string
          format: date
          description: |
            The date when the Invoice was issued.

            ID: `BT-2`
          example: '2020-11-12'
        due_date:
          type: string
          format: date
          description: |
            The date when the payment is due.

            ID: `BT-9`
          example: '2021-01-04'
          nullable: true
        tax_point_date:
          type: string
          format: date
          description: |
            The date when the VAT becomes accountable for the Seller and for the Buyer in so far as that date can be
            determined and differs from the date of issue of the invoice, according to the VAT directive.
            This element is required if the Value added tax point date is different from the Invoice issue date.

            ID: `BT-7`
          example: '2022-02-01'
          nullable: true
        invoicing_period_start:
          type: string
          format: date
          description: |
            The date when the invoice period starts.

            ID: `BT-73`
          example: '2024-07-07'
          nullable: true
        invoicing_period_end:
          type: string
          format: date
          description: |
            The date when the invoice period ends.

            ID: `BT-74`
          example: '2024-07-07'
          nullable: true
        buyer_reference:
          type: string
          maxLength: 255
          description: |
            An identifier assigned by the Buyer used for internal routing purposes.

            ID: `BT-10`
          example: '321654'
          nullable: true
        file_reference:
          type: string
          description: |
            The identification of the project the invoice refers to.

            ID: `BT-11`
          maxLength: 255
          example: PID33
          nullable: true
        ponumber:
          type: string
          maxLength: 255
          description: |
            Purchase order reference. An identifier of a referenced purchase order, issued by the Buyer.

            ID: `BT-13`
          nullable: true
          example: '123'
        order_date:
          type: string
          format: date
          description: |
            Purchase order date.
          nullable: true
          example: '2026-01-15'
        sales_order_reference:
          type: string
          maxLength: 255
          description: |
            An identifier of a referenced sales order, issued by the Seller.

            ID: `BT-14`
          example: '123'
          nullable: true
        receiving_advice_reference:
          type: string
          maxLength: 255
          description: |
            An identifier of a referenced receiving advice.

            ID: `BT-15`
          example: '123'
          nullable: true
        lot_reference:
          type: string
          maxLength: 255
          description: |
            Tender or Lot number. The identification of the call for tender or lot
            the invoice relates to.


            ID: `BT-17`
          example: '321654'
          nullable: true
        contract_number:
          type: string
          maxLength: 255
          description: |
            Contract reference. The identification of a contract.

            ID: `BT-12`
          example: 123Contractref
          nullable: true
        party_identification:
          type: string
          maxLength: 60
          description: |
            Seller identifier or bank assigned creditor identifier

            *This element is used for both the identification of the Seller, or the unique banking reference identifier of Seller (assigned by the Seller bank.). For seller identification use ICD code list, for SEPA bank assigned creditor reference, use SEPA. In order for the buyer to automatically identify a supplier, the Seller identifier (`BT-29`), the Seller legal registration identifier (`BT-30`) and/or the Seller VAT identifier (`BT-31`) shall be present*
          example: '506001234999'
          nullable: true
        delivery_note_number:
          type: string
          maxLength: 220
          description: |
            An identifier of a referenced despatch advice

            ID: `BT-16`
          example: '321654'
          nullable: true
        delivery_note_date:
          type: string
          format: date
          description: |
            Dispatch advice date
            [FacturaE and FatturaPA only]
          example: '2024-07-07'
          nullable: true
        buyer_accounting_reference:
          type: string
          description: |
            A textual value that specifies where to book the relevant data into the Buyer's financial accounts.

            ID: `BT-19`
          maxLength: 255
          nullable: true
        customer_contact_person:
          type: string
          maxLength: 170
          description: Overwrites the existing contact of the client
          example: John Doe
          nullable: true
        language:
          type: string
          maxLength: 2
          description: |
            Contact language. It should be a language available inside B2Brouter.
            You can check all available languages using the **Languages** endpoint in Code lists section (`/languages`)
          enum:
            - en
            - es
            - ca
            - fr
            - it
            - de
            - pt
            - nl
            - pl
            - da
            - sv
            - ar
            - null
          example: en
          nullable: true
        is_credit_note:
          type: boolean
          description: |
            Marks this invoice as a credit note.  

            - Set to `true` if the invoice is meant to **refund** or **correct** a previously issued invoice in general cases.
            - **Do NOT use this field for Spanish "Factura Rectificativa"**. In Spain, credit adjustments must be created following local rules, using a standard invoice format with negative amounts if needed.
            - Set to `false` (or omit) for a standard invoice.

            **Amounts behavior:**
            - **Provide positive values** for line amounts, taxes, and totals.
            - The system will automatically treat these amounts as reducing the original invoice balance when `is_credit_note` is `true`.
            - Reference the original invoice being corrected using `invoice_references` with `reference_type: "amend"`.
          example: false
          default: false
        apply_taxes_per_line:
          type: boolean
          nullable: true
          description: |
            Controls how VAT totals are rounded for this invoice, overriding the
            account-level setting of the same name.

            - `true` — taxes are computed per line (each line rounded, then summed).
            - `false` — taxes are computed per invoice (taxable base summed per rate, then rounded once).
            - omitted / `null` — inherit the account's `apply_taxes_per_line` setting.

            The override is honoured only for premium accounts. Public administrations
            that recompute totals may reject an invoice whose rounding mode doesn't
            match theirs; use this field to align per invoice.
          example: true
        total_amount_due:
          type: number
          format: float
          writeOnly: true
          nullable: true
          description: |
            [KSeF only] The total amount due for the invoice (P_15 in FA(3) structure).

            **Required** for `ZAL` (advance payment) and `KOR_ZAL` (advance correction) invoices,
            where the invoice total cannot be derived from the invoice lines.

            - For `ZAL`: the advance payment amount.
            - For `KOR_ZAL`: the correction amount.

            Ignored for other invoice types (total is calculated from lines).
          example: 20000
        adjustment_in_cents:
          type: integer
          example: 2
          minimum: -99
          maximum: 99
          description: |
            The amount (in cents) to be added to the invoice total to round the amount to be paid.

            ID: `BT-114`
        subtotal:
          type: number
          format: float
          example: 363.5
          readOnly: true
        taxes:
          type: array
          items:
            $ref: '#/components/schemas/Tax'
          readOnly: true
        total:
          type: number
          format: float
          example: 363.5
          readOnly: true
        currency:
          type: string
          example: EUR
          description: |
            The currency in which all Invoice amounts are given, except for the
            Total VAT amount in accounting currency.


            ID: `BT-5`
          maxLength: 3
        tax_currency_code:
          type: string
          description: |
            The currency used for VAT accounting and reporting purposes as accepted or required in the country of the Seller.
            Shall be used in combination with `tax_amount_in_tax_currency` when the VAT accounting currency differs from the Invoice currency.

            ID: `BT-6`
          maxLength: 3
          nullable: true
          example: PLN
        tax_amount_in_tax_currency:
          type: number
          format: decimal
          description: |
            The VAT total amount expressed in the accounting currency accepted or required in the country of the Seller.
            To be used when the VAT accounting currency (`tax_currency_code`) differs from the Invoice currency (`currency`).

            ID: `BT-111`
          nullable: true
          readOnly: true
          example: 276.23
        exchange_rate:
          type: number
          format: decimal
          nullable: true
          description: |
            Exchange rate used for currency conversion when the invoice currency
            differs from the tax authority's local currency.
            When not provided, the system fetches the rate automatically.
          example: 4.5123
        exchange_date:
          type: string
          format: date
          nullable: true
          description: Date of the exchange rate used for currency conversion.
          example: '2025-04-10'
        amounts_withheld_reason:
          type: string
          maxLength: 255
          description: Withheld reason
          nullable: true
          example: Withheld
        withheld_percent:
          type: number
          nullable: true
          format: decimal
          description: Withheld percent
          example: 10
        amounts_withheld:
          type: number
          description: Withheld amount
          example: 36.35
        payable_amount:
          type: number
          format: float
          description: |
            The outstanding amount that is requested to be paid.

            ID: `BT-115`
          example: 327.15
          readOnly: true
        payments_on_account:
          type: number
          format: float
          description: |
            Total Prepaid Amount

            ID: `BT-113`
          example: 327.15
        payment_method:
          $ref: '#/components/schemas/PaymentMethodCode'
        payment_method_text:
          type: string
          maxLength: 255
          description: |
            The means, expressed as text, by which a payment is expected to be or has been made. This field is used when the invoice payment method is `13` - Other (UBL: ZZZ).

            ID: `BT-82`
          example: Bank transfer
          nullable: true
        payment_terms:
          type: string
          maxLength: 65535
          description: |
            Payment terms. A textual description of the payment terms that apply
            to the amount due for payment (Including description of possible
            penalties).


            ID: `BT-20`
          example: Payment terms
          nullable: true
        bank_assigned_creditor_reference:
          type: string
          description: |
            Bank assigned creditor reference

            ID: `BT-90`
          maxLength: 255
          example: ES6000000000000000000000
          nullable: true
        remittance_information:
          type: string
          maxLength: 180
          description: |
            Remittance information. A textual value used to establish a link
            between the payment and the Invoice, issued by the Seller.


            ID: `BT-83`
          example: Remittance information
          nullable: true
        mandate_reference_identifier:
          type: string
          maxLength: 110
          description: |
            Mandate reference identifier. Unique identifier assigned by the Payee for referencing the direct debit mandate.

            ID: `BT-89`
          example: '321654'
          nullable: true
        bank_account_id:
          type: integer
          description: |
            Unique identifier for an existing bank account in B2Brouter.
            Use this field to reference an existing bank account. To create a new account, use `bank_account` instead.
          example: 402
          writeOnly: true
        bank_account:
          description: |
            Represents a bank account as an object.
            Use this field to create a new bank account.
          type: object
          writeOnly: true
          allOf:
