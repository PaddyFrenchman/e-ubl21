                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: parameter_invalid
                      message:
                        type: string
                        example: tin_value does not match parent contact's tin_value. Offices inherit tin from their parent.
                      param:
                        type: string
                        example: tin_value
                      type:
                        type: string
                        example: invalid_request_error
