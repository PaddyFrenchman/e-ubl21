            $ref: '#/components/schemas/AllowanceChargeBase'
          readOnly: true
          nullable: true
        gross_amount:
          type: number
          format: decimal
          description: total_cost + charges - discounts
          readOnly: true
          example: 100
        taxes:
          type: array
          description: Taxes
          items:
