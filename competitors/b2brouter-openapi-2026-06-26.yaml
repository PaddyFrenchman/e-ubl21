        invoice_type_code:
          type: string
          example: F1
          nullable: true
          description: |
            Invoice type code. The available codes depend on the tax authority:

            **Verifactu and TicketBAI codes:**
            * `F1` - Factura (art. 6, 7.2 y 7.3 del RD 1619/2012)
            * `F2` - Factura Simplificada y Facturas sin identificación del destinatario (art. 6.1.d) RD 1619/2012
            * `F3` - Factura emitida en sustitución de facturas simplificadas facturadas y declaradas
            * `R1` - Factura Rectificativa (Error fundado en derecho y Art. 80 Uno Dos y Seis LIVA)
            * `R2` - Factura Rectificativa (Art. 80.3)
            * `R3` - Factura Rectificativa (Art. 80.4)
            * `R4` - Factura Rectificativa (Resto)
            * `R5` - Factura Rectificativa en facturas simplificadas

            See [Verifactu documentation](https://developer.b2brouter.net/docs/verifactu#invoice-type-codes)

            **KSeF codes:**
            * `VAT` - Basic invoice
            * `KOR` - Corrective invoice
            * `ZAL` - Advance payment invoice (Article 106f sec. 4)
            * `ROZ` - Invoice per Article 106f sec. 3
            * `UPR` - Simplified invoice (Article 106e sec. 5 item 3)
            * `KOR_ZAL` - Corrective invoice for advance payment
            * `KOR_ROZ` - Corrective invoice for ROZ invoice

            See [KSeF documentation](https://developer.b2brouter.net/docs/ksef#invoice-type-codes)
        special_regime_key:
