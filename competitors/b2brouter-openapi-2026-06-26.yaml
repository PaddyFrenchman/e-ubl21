  /accounts/{account}/invoices/imports:
    post:
      operationId: create-invoice-import-batch
      tags:
        - Invoices
      summary: Create a bulk invoice import batch
      description: |-
        Submits up to 100 invoice XML files in a single multipart request and imports them asynchronously, using the same per-file pipeline as the web-UI bulk upload.

        Processing is always asynchronous. This endpoint returns `202 Accepted` immediately with the batch ID and `processing` status. Use the `GET /accounts/{account}/invoices/imports/{id}` endpoint to poll for per-file outcomes, or subscribe to the `invoice_import.finished` webhook event to be notified when the whole batch finishes.

        **Per-file deduplication:** files whose SHA-256 digest is already present in the project are recorded with `error_message: duplicated_document` instead of being re-imported. Two files in the same batch with the same digest also collide — the second receives the same dedup marker.

        **Filename correlation:** the `results[].filename` field echoes the multipart filename for items that have not yet been imported. Once an item is imported, the polymorphic association on the wrapper row swaps from the original `Attachment` to the resulting `Invoice` and the filename is no longer accessible. Clients correlate imported items by the explicit `results[].index` (zero-based position in the original upload, always present) or by `invoice_id`.

        **Webhook payload note:** the `invoice_import.finished` webhook carries only the batch summary (batch_id, status, summary, status_url). Per-file results are not included to keep the payload under the `web_hook_calls.data` 65535-byte cap — fetch them via the `status_url` GET endpoint.

        **Limits:** Maximum 100 files per batch.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/account'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: Invoice XML files to import.
                  items:
                    type: string
                    format: binary
                from_net:
                  type: string
                  description: Origin tag stored on the resulting Invoice (e.g. `uploaded`, `sftp`, `peppol`). Defaults to `uploaded`.
                  example: uploaded
                issued:
                  type: boolean
                  description: Whether the files should be imported as issued (sent by the account) or received. Defaults to the receiver behaviour for most networks.
                validate:
                  type: boolean
                  description: Run import-time validations (default true).
                keep_original:
                  type: boolean
                  description: Keep the original XML attached to the Invoice (default true).
                send_after_import:
                  type: boolean
                  description: After importing, attempt to send the resulting invoice. Same semantics as the single-file `POST .../invoices/import` endpoint.
                issue_after_import:
                  type: boolean
                  description: After importing, issue the resulting invoice without sending it. If both `send_after_import` and `issue_after_import` are `true`, `send_after_import` wins.
              required:
                - files
      responses:
        '202':
          description: Batch accepted. Poll `GET /accounts/{account}/invoices/imports/{id}` for per-file outcomes or subscribe to the `invoice_import.finished` webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceImportBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - api_key: []
  /accounts/{account}/invoices/imports/{id}:
    get:
      operationId: get-invoice-import-batch
      tags:
        - Invoices
      summary: Get a bulk invoice import batch
      description: |-
        Returns the current state of a batch import and the per-file outcomes.

        The response includes one `results[]` entry per uploaded file, in the original upload order. Each result carries an explicit `index` (its zero-based position in the upload, the reliable correlation key), its `status` (`unfinished`, `done`, `error`, `done_with_error`, etc.), the resulting `invoice_id` when applicable, and the importer error message when the import failed.

        While the batch is still `processing`, items not yet picked up by the job report `status: unfinished`. Once the batch reaches `done`, all items have a terminal status.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/account'
        - name: id
          in: path
          required: true
          description: ID of the batch (`BulkAction`).
          schema:
            type: integer
          example: 42
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceImportBatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - api_key: []
  /invoices/{id}/mark_as:
    post:
      operationId: mark-as-invoice
      tags:
