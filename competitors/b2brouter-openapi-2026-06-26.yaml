        apply_to_local_government_unit:
          type: boolean
          description: |
            KSeF: Indicates this invoice is addressed to a Subordinate Local Government Unit (JST).
            When true, a `third_party` with a `tin_value` is required.
            Not included in responses by default. Use `?include=apply_to_local_government_unit` to include it.
          default: false
          nullable: true
        apply_to_vat_group_member:
          type: boolean
          description: |
            KSeF: Indicates this invoice is addressed to a VAT Group member (GV).
            When true, a `third_party` with a `tin_value` is required.
            Not included in responses by default. Use `?include=apply_to_vat_group_member` to include it.
          default: false
          nullable: true
        third_party:
          type: object
          nullable: true
          description: |
            The third party (KSeF Podmiot3) associated with this invoice.
            Required when `apply_to_local_government_unit` or `apply_to_vat_group_member` is true.
            Not included in responses by default. Use `?include=third_party` to include it.
          properties:
            id:
              type: integer
              description: Party identifier. Required when using `_destroy`.
              readOnly: false
            _destroy:
              type: boolean
              description: Set to true to remove the third party from the invoice.
              writeOnly: true
            role:
              type: string
              description: |
                The role of the third party. See KSeF Podmiot3 role codes.
              enum:
                - delivery_recipient
                - original_supplier
                - additional_buyer
                - invoice_issuer
                - payer
                - local_government_unit_issuer
                - local_government_unit_recipient
                - vat_group_member_issuer
                - vat_group_member_recipient
