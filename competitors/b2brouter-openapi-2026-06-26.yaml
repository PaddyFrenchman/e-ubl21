    AllowanceChargeBase:
      type: object
      description: Base schema for allowance charges containing common fields
      properties:
        id:
          type: integer
          example: 12345
          description: |
            A unique internal identifier of the AllowanceCharge in B2Brouter. It can be used to update or destroy an existing AllowanceCharge.
        allowance_charge_indicator:
          type: string
          description: |
            Indicates whether this is an allowance (discount) or charge.

            ID: `BT-20`, `BT-21` for document level or `BT-140`, `BT-141` for line level
          enum:
            - allowance
            - charge
          example: allowance
        amount:
          type: number
          format: decimal
          description: |
            The amount of the allowance or charge, without VAT.
            Either amount or percentage must be provided, but not both.

            ID: `BT-92`, `BT-99` for document level or `BT-136`, `BT-141` for line level
          example: 50
          nullable: true
        percentage:
          type: number
          format: decimal
          description: |
            The percentage that may be used to calculate the allowance or charge amount.
            Either amount or percentage must be provided, but not both.

            ID: `BT-94`, `BT-101` for document level or `BT-138`, `BT-144` for line level
          example: 10.5
          nullable: true
        description:
          type: string
          maxLength: 255
          description: |
            The reason for the allowance or charge, expressed as text.

            ID: `BT-97`, `BT-104` for document level or `BT-139`, `BT-145` for line level
          example: Volume discount
          nullable: true
        is_reimbursable_expense:
          type: boolean
          description: |
            [FacturaE Only]

            Indicates whether the charge is a reimbursable expense (Spanish "suplidos").
            Only applicable to charges, not allowances.
          default: false
        base_amount:
          type: number
          format: decimal
          description: |
            The base amount used to calculate percentage-based allowances or charges.
            This is calculated automatically from the adjustable record.
          example: 1000
          readOnly: true
        calculated_amount:
          type: number
          format: decimal
          description: |
            The final calculated amount of the allowance or charge.
            For fixed amounts, this equals the amount field.
            For percentages, this is calculated from percentage and base_amount.
          example: 105
          readOnly: true
        currency:
          type: string
          description: |
            The currency of the allowance or charge amounts.
            Inherited from the associated invoice.
          example: EUR
          readOnly: true
        _destroy:
          type: boolean
          description: |
            Set to true to delete this allowance or charge when updating.
            Used in nested attribute updates.
          writeOnly: true
      required:
        - allowance_charge_indicator
