  /accounts/{account}/transports/peppol/migration_code:
    post:
      operationId: create-peppol-migration-code
      tags:
        - Transports
      summary: Issue a Peppol migration code
      description: |
        Issues the migration code that lets the account move its Peppol participant identifier from B2Brouter to another provider. Hand the code to the gaining provider: they use it to claim the identifier.

        The account must have a `peppol` transport whose identifier B2Brouter publishes; otherwise there is nothing to migrate and the request is rejected with a `409`.

        The call is idempotent: while a code is outstanding, every call returns that same code. To replace it, cancel it with `DELETE` and request a new one. Cancelling and re-issuing invalidates the previous code, so any copy already sent to the gaining provider stops working.

        Issuing a code does not move the identifier and does not change reception: documents keep arriving at B2Brouter until the gaining provider completes the migration. Once a code has been issued and not cancelled, the `peppol` transport reports `migration_pending: true`; it stays `true` after the gaining provider completes the migration, and only turns back to `false` when the code is cancelled with `DELETE`.

        The code is only returned by this endpoint and never appears in transport responses.
      parameters:
        - $ref: '#/components/parameters/account'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - migration_code
                properties:
                  migration_code:
                    type: string
                    example: Xk9$mQ2!vTz4
                    description: Code to hand to the gaining provider so it can claim the identifier.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            The account has no `peppol` transport (`resource_missing`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            No migration code can be issued:

            - `conflict` — the Peppol transport of this account is not managed through the API.
            - `migration_unavailable` — migration codes are not available in the sandbox.
            - `not_published_by_b2brouter` — the identifier is not published by B2Brouter, so there is no migration to prepare.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: |
            The Peppol SML refused the request (`sml_rejected`). The message carries the refusal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            The Peppol SML could not be reached: `sml_lookup_failed` while checking the publication state, or `sml_unavailable` while issuing the code. Retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - api_key: []
    delete:
      operationId: delete-peppol-migration-code
      tags:
        - Transports
      summary: Cancel a Peppol migration code
      description: |
        Cancels the migration code of the account, so it can no longer be used to claim the identifier. This is the only call that sets `migration_pending` back to `false` on the `peppol` transport.

        Cancelling re-claims the identifier at the Peppol SML, so it is a real operation and not a local reset. Use it to withdraw a code that was issued by mistake, or together with `POST` to replace an outstanding code. On a `5xx` response the cancellation may have been partially applied: retry the `DELETE` until it returns `200`.

        The response is the same whether or not a code was outstanding. Requires the `transports` section with the `edit` capacity.
      parameters:
        - $ref: '#/components/parameters/account'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - migration_code
                  - cancelled
                properties:
                  migration_code:
                    type: string
                    nullable: true
                    example: null
                    description: Always `null`; no code is outstanding any more.
                  cancelled:
                    type: boolean
                    example: true
                    description: Indicates the migration code was cancelled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            The account has no `peppol` transport (`resource_missing`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            No migration code can be cancelled:

            - `conflict` — the Peppol transport of this account is not managed through the API.
            - `migration_unavailable` — migration codes are not available in the sandbox.
            - `not_published_by_b2brouter` — the identifier is not published by B2Brouter, so there is no migration to cancel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: |
            The Peppol SML refused the request (`sml_rejected`). The message carries the refusal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            The Peppol SML could not be reached: `sml_lookup_failed` while checking the publication state, or `sml_unavailable` while cancelling the code. Retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - api_key: []
