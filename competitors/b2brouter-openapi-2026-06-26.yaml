  /tax_reports/{id}/download_response:
    get:
      operationId: download-tax-report-response
      tags:
        - Tax Reports
      summary: Download the official receipt for a tax report
      description: |-
        Download the Official Receipt of Acknowledgement received from the Tax Authority after successfully submitting a tax report.

        This endpoint is primarily used for KSeF (Polish tax reporting system) to retrieve the official acknowledgement (UPO) from the tax authority. The UPO serves as proof that the invoice was successfully received and registered by the Polish Ministry of Finance.

        **Note:** The UPO is only generated when the invoice is successfully accepted by KSeF. If the tax report is in error state, this endpoint will return the error reason from the tax authority.
      parameters:
        - $ref: '#/components/parameters/api_version_header'
        - $ref: '#/components/parameters/tax_report_id'
      responses:
        '200':
          description: UPO (Official Receipt) from KSeF tax authority
          content:
            application/xml:
              schema:
                type: string
                format: binary
                description: XML UPO (Urzędowe Poświadczenie Odbioru) from KSeF
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <ns3:UPO xmlns:ns3="http://ksef.mf.gov.pl/schema/gtw/svc/online/types/2021/10/01/0001">
                  <ns3:KsefReferenceNumber>20251107-SE-1234567890-ABCD</ns3:KsefReferenceNumber>
                  <ns3:NrFaktury>F/2025/11/001</ns3:NrFaktury>
                  <ns3:DataWplywu>2025-11-07T10:30:45Z</ns3:DataWplywu>
                  <ns3:PodpisUPO>ABC123XYZ...</ns3:PodpisUPO>
                </ns3:UPO>
        '204':
          description: No Content - The tax report has no UPO available yet (still processing or not sent)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Unprocessable Entity - Tax report submission error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        description: Error message from the tax authority explaining why the submission failed or was rejected
                        example: 'KSeF authentication failed: Invalid certificate'
      security:
        - api_key: []
