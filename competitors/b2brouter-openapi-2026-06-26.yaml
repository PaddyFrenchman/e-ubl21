    SendAfterImport:
      type: boolean
      default: false
      example: true
      enum:
        - true
        - false
      description: |
        Indicates whether the invoice should be automatically processed after creation/import.

        When set to `true` and the invoice passes validations:
          * For sending transports (non-`download`), the invoice is queued to be sent asynchronously.
          * For `download` transport, the invoice is not sent. Instead, if tax report generation is enabled and required for this invoice, the invoice will be issued and the tax report generated 
            (invoice ends in `state=issued` and exposes `tax_report_ids`). Otherwise, the invoice may end in `state=error`.

        **Note:** This option is incompatible with the custom signature configuration.
    IssueAfterImport:
      type: boolean
      default: false
      example: true
      enum:
        - true
        - false
      description: |
        Indicates whether the invoice should be issued synchronously after creation/import, without going through the transport send flow.

        When set to `true` and the invoice passes validations:
          * The invoice transitions to `state=issued` (c1 corner) inline.
          * If the account has a `before_send` tax report setting enabled with `auto_generate` on and the invoice qualifies, the tax report is generated inline and exposed via `tax_report_ids`. When `auto_generate` is off the invoice is still issued but no report is created, consistent with the send flow — those reports are managed through the Tax Reports API.
          * Authorities that report after sending (for example SII or SDI) are not triggered by issuing; their reports are created when the invoice is sent or marked as sent.
          * No background send job is enqueued; the transport-level state (c2) remains untouched.
          * While in `state=issued` the invoice becomes read-only: it cannot be updated, deleted, or reverted to `new` until it is sent or downloaded.

        If both `send_after_import` and `issue_after_import` are `true`, `send_after_import` wins (sending already issues the invoice). Ignored for non-invoice documents.
    Ack:
      type: boolean
      default: false
      description: Mark the invoice as acknowledged.
    Payment:
      type: object
      description: A payment recorded on an invoice. Payments can be total or partial; an invoice may accumulate several. When the recorded payments cover the invoice total, the invoice automatically transitions to `paid`, whatever its current state. On accounts with an active payment-reporting tax authority (e.g. DGFiP), recording a payment automatically triggers the corresponding fiscal report.
      properties:
        id:
          type: integer
          readOnly: true
          example: 981
        invoice_id:
          type: integer
          description: The invoice this payment belongs to. Required when recording a payment; the invoice must belong to the account of the request path.
          example: 12345
        amount:
          type: number
          format: double
          description: Cash amount of the payment, taxes included, in the invoice currency. Must be greater than zero — except that `0` is accepted together with a positive `early_payment_discount_amount`. Amounts above the outstanding amount are accepted.
          example: 150.5
        early_payment_discount_amount:
          type: number
          format: double
          description: Early payment discount (French _escompte_) granted with this payment, in the invoice currency. Settlement counts `amount` plus this discount, so a discounted invoice closes without the discount ever being recorded as cash. The combined `amount` + discount may not exceed the outstanding amount. On accounts with French (DGFiP) e-reporting, only `amount` is declared as collected — the discounted part is never reported.
          example: 2.36
        currency:
          type: string
          readOnly: true
          description: ISO 4217 code, inherited from the invoice.
          example: EUR
        date:
          type: string
          format: date
          description: Date of the payment. Defaults to the current date when omitted. Send the real payment date when recording payments after the fact.
          example: '2026-07-01'
        payment_method:
          $ref: '#/components/schemas/PaymentMethodCode'
        payment_method_text:
          type: string
          maxLength: 255
          nullable: true
          description: The means, expressed as free text, by which the payment was settled (e.g. a card brand or a local payment scheme). Shown in listings and available for reconciliation.
          example: Bizum
        reference:
          type: string
          maxLength: 255
          nullable: true
          description: Free-text payment reference (e.g. bank remittance information).
          example: REF-2026-001
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    InvoiceImportBatch:
      type: object
      description: A bulk invoice import batch — the wrapper around a multi-file import request submitted via `POST /accounts/{account_id}/invoices/imports`.
      properties:
        batch_id:
          type: integer
          description: Unique identifier of the batch (a `BulkAction`).
          example: 42
        status:
          type: string
          description: |-
            Current processing status of the batch.
            - `processing`: at least one file is still being imported, or the job has
              not yet finished.
            - `done`: the job finished and every file reached a terminal state
              (`done`, `error`, or `done_with_error`).
            - `failed`: the job aborted before processing every file; some files may
              remain `unfinished`. Use the per-file `results[].status` to see which.

            Per-file outcomes live in `results[].status`.
          enum:
            - processing
            - done
            - failed
          example: done
        status_url:
          type: string
          description: Absolute URL of this batch's status endpoint (`GET /accounts/{account_id}/invoices/imports/{id}`). The same value is delivered in the `invoice_import.finished` webhook, so a subscriber can follow it without rebuilding the URL.
          example: https://api.b2brouter.net/accounts/99/invoices/imports/42
        summary:
          type: object
          description: 'Per-state counts partitioning the batch: mutually exclusive and exhaustive, so `done + done_with_error + error + unfinished == total`. Each count matches the number of `results[]` with that `status`.'
          properties:
            total:
              type: integer
              description: Total files in the batch.
              example: 3
            done:
              type: integer
              description: Files imported cleanly.
              example: 1
            done_with_error:
              type: integer
              description: Files imported, but with send-time validation warnings.
              example: 1
            error:
              type: integer
              description: Files that could not be imported (includes duplicate digests).
              example: 1
            unfinished:
              type: integer
              description: Files not yet processed. Always 0 once `status` is `done`; may be non-zero when `status` is `failed`.
              example: 0
          required:
            - total
            - done
            - done_with_error
            - error
            - unfinished
        results:
          type: array
          description: One entry per uploaded file, in the original upload order. Each result carries an explicit `index` so results can be correlated to the submitted files regardless of array handling.
          items:
            type: object
            properties:
              index:
                type: integer
                description: 'Zero-based position of the file in the original `files[]` upload. The reliable correlation key: it is always present, whereas `filename` is dropped once an item imports successfully.'
                example: 0
              filename:
                type: string
                nullable: true
                description: Original multipart filename. Available for items that have not yet been imported (status `unfinished`) or that errored. For items whose status is `done`/`done_with_error`, the `documentable` polymorphic association has been swapped to the resulting invoice and the filename is no longer accessible — clients correlate those by `index` or by the returned `invoice_id`.
                example: invoice1.xml
              status:
                type: string
                description: Per-file outcome.
                enum:
                  - unfinished
                  - done
                  - done_with_error
                  - error
                example: done
              invoice_id:
                type: integer
                nullable: true
                description: 'ID of the resulting Invoice when status is `done` or `done_with_error`. Also set for a duplicate (`status: error`, `error_message: duplicated_document`), pointing to the existing invoice that matched the digest.'
                example: 8675309
              error_message:
                type: string
                nullable: true
                description: Importer error message, populated when status is `error`.
                example: null
            required:
              - index
              - status
      required:
        - batch_id
        - status
        - status_url
        - summary
        - results
    StateInput:
      type: string
      example: refused
      writeOnly: true
      enum:
        - new
        - sent
        - downloaded
        - accepted
        - registered
        - refused
        - closed
        - paid
        - annotated
        - read
      description: |
        Valid states for an issued invoice:
         * `new` - The initial status of an issued invoice.
         * `sent` - The invoice has been sent successfully. It cannot be set manually when tax reporting to the French tax authority (DGFiP) is active for the account: the invoice becomes sent by being sent through B2Brouter.
         * `accepted` - When the invoice is marked as accepted.
         * `registered` - When a registered notification has been received or manually marked as registered.
         * `refused` - When a refused notification has been received or manually marked as refused.
         * `paid` - When the invoice has been paid or the invoice is marked manually as paid.
         * `closed` - Is a final state.

        Valid states for a received invoice:
         * `new` - The initial status of a received invoice or manually marked as new.
         * `paid` - When the invoice has been paid or the invoice is marked manually as paid.
         * `accepted` - When the invoice is marked as accepted. May carry a partial-approval `amount` (French CDV 206).
         * `refused` - When the invoice is marked as refused.
         * `annotated` - When the invoice is marked as annotated (booked). Send `dispute: true` with a `reason` to raise a formal dispute instead (French CDV 207 En litige).
         * `read` - When the invoice is marked as read / taken in charge (French CDV 204).

        Valid states for an issued simplified invoice:
         * `new` - The initial status of an issued simplified invoice.
         * `sent` - The invoice has been sent successfully. It cannot be set manually when tax reporting to the French tax authority (DGFiP) is active for the account: the invoice becomes sent by being sent through B2Brouter.
         * `paid` - When the invoice has been paid or the invoice is marked manually as paid.
         * `downloaded` - When the invoice has been downloaded or manually marked as downloaded.
         * `accepted` - When the invoice is marked as accepted.
         * `refused` - When a refused notification has been received or manually marked as refused.
         * `registered` - When a registered notification has been received or manually marked as registered.
         * `closed` - Is a final state.

        Valid states for an issued self-invoice:
         * `paid` - When the invoice has been paid or the invoice is marked manually as paid.
         * `accepted` - When the invoice is marked as accepted.
         * `registered` - When a registered notification has been received or manually marked as registered.
         * `closed` - Is a final state.
    InvoiceMarkAsCommit:
      type: string
      description: |
        Used to send notification of the state chan via mail to the contact.
        Only for Received Invoices and for states 'accepted', 'refused' & 'paid'.
      example: with_mail
      enum:
        - with_mail
    InvoiceMarkAsReason:
      type: string
      example: Write here the reason of the state change, if you want.
      description: |
        To annotate the reason of the state change, if commit is 'with_mail',
        and the new state is 'accepted', 'refused' or 'paid', the reason will be
        included in the mail sent to the contact.
    InvoiceMarkAsDispute:
      type: boolean
      default: false
      description: |
        Raise a formal dispute when annotating a received invoice: only with
        `dispute: true` does `state: annotated` send a French CDV 207 (En litige) to
        the supplier. Requires `reason`, which carries the dispute motive
        (BR-FR-CDV-15). Without it, `annotated` means "Comptabilisé" and notifies
        nothing.
      example: true
    InvoiceMarkAsAmount:
      type: number
      format: double
      nullable: true
      minimum: 0
      exclusiveMinimum: true
      maximum: 10000000000000
      exclusiveMaximum: true
      description: |
        Partial-approval amount for a received invoice (French CDV 206 Approuvée
        partiellement). Only valid together with `state: accepted`, and requires a
        `reason`. Must be greater than zero, below 10^13 and expressed with at most
        2 decimal places. See `amount_code` for the variant.
      example: 600
    InvoiceMarkAsAmountCode:
      type: string
      nullable: true
      description: |
        Variant of the declared partial-approval `amount` (CDV 206, MDG-43):
        `MAP`/`MNA` approved/non-approved amount VAT excluded, `MAPTTC`/`MNATTC`
        the same VAT included. Defaults to `MAPTTC` when omitted.
      example: MAPTTC
      enum:
        - MAP
        - MAPTTC
        - MNA
        - MNATTC
        - null
    ErrorItem:
      type: string
      description: Error message
      example: The invoice cannot be marked as new
    ErrorMessage:
      type: object
      description: Represents an error message as an object
      properties:
        message:
          type: string
          example: Expected attachments to be a ZIP file, found .pdf
    TaxReportGenerated:
      type: object
      description: Response after generating a tax report
      properties:
        id:
          type: integer
          example: 123
      xml:
        name: tax_report
    DocumentValidation:
      type: object
      description: Represents a document validation as an object
      properties:
        validation_result:
          type: object
          description: Contains the information result about the document's validation.
          properties:
            info:
              type: object
              description: Metadata about the validated document.
              properties:
                document_type_code:
                  type: string
                  example: xml.ubl.invoice.bis3
                  description: The document type code of the validated document. If the document type cannot be defined, the value is 'unknown'.
                model:
                  type: string
                  example: Invoice
                  description: Indicates the type of business document that was validated. If the document is not well formed, the value is 'unknown'.
                  enum:
                    - Invoice
                    - ApplicationResponse
                    - DespatchAdvice
                    - Order
                    - OrderResponse
                    - Ledger
                    - TaxReport
                    - unknown
            status:
              type: string
              example: invalid
              enum:
                - valid
                - invalid
                - valid_with_warnings
              description: |
                Status validation of the validated document.
                - If xsd or sch are ´invalid,´ the global status will be ´invalid´.
                - If sch is ´valid_with_warnings´, the global status will be ´valid_with_warnings´.
                - If xsd and sch are ´valid´, the global status will be ´valid´.
            xsd:
              type: object
              description: Representation of the xsd validation.
              properties:
                status:
                  type: string
                  example: invalid
                  enum:
                    - valid
                    - invalid
                    - not_applicable
                  description: Validity status of document validation against the syntax schema (XSD).
                errors:
                  type: array
                  items:
                    type: object
                    description: Representation of an xsd error
                    properties:
                      message:
                        type: string
                        example: 'Element ''ProfileI'': This element is not expected. Expected is one of ( ProfileID, ProfileExecutionID, ID ).'
                        description: Description of the error encountered
            sch:
              type: object
              description: Representation of the sch validation.
              properties:
                status:
                  type: string
                  example: valid_with_warnings
                  enum:
                    - valid
                    - invalid
                    - valid_with_warnings
                    - not_applicable
                  description: Validity status of document validation against the business rules (Schematrons).
                schematrons:
                  type: array
                  example:
                    - CEN-EN16931-UBL.sch
                    - PEPPOL-EN16931-UBL.sch
                  description: Schematrons used to validate the document.
                  items:
                    type: string
                errors:
                  type: array
                  items:
                    type: object
                    description: Representation of an sch error
                    properties:
                      code:
                        type: string
                        example: SE-R-005
                        description: Schematron rule code with which the error was found
                      category:
                        type: string
                        example: PEPPOL-EN16931-UBL.sch
                        description: Schematron model with which the error was found
                      message:
                        type: string
                        example: For Swedish suppliers, when using Seller tax registration identifier, 'Godkänd för F-skatt' must be stated
                        description: Description of the error encountered
                      property_path:
                        type: string
                        example: Invoice/AccountingSupplierParty/Party/PartyTaxScheme/CompanyID
                        description: Path of the property that has given the error
                warnings:
                  type: array
                  items:
                    type: object
                    description: Representation of an sch warning
                    properties:
                      code:
                        type: string
                        example: SE-R-013
                        description: Schematron rule code with which the warning was found
                      category:
                        type: string
                        example: PEPPOL-EN16931-UBL.sch
                        description: Schematron model with which the warning was found
                      message:
                        type: string
                        example: The last digit of a Swedish organization number must be valid according to the Luhn algorithm.
                        description: Description of the warning encountered
                      property_path:
                        type: string
                        example: Invoice/AccountingSupplierParty/Party/PartyLegalEntity
                        description: Path of the property that has given the warning
    OrderId:
      type: integer
      example: 4053100
      title: Order ID
      description: Unique identifier of the **Order** in B2Brouter.
      readOnly: true
    OrderLine:
      type: object
      description: A group of business terms providing information on individual Order lines.
      properties:
        position:
          type: integer
          example: 1
          description: position
          writeOnly: true
        name:
          type: string
          example: Item name
          description: Item name.
          maxLength: 65535
        description:
