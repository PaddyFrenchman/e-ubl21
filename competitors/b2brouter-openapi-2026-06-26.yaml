    TransportPeppol:
      type: object
      description: Represents a configuration for Peppol transport
      properties:
        code:
          type: string
          enum:
            - ''
            - peppol
        enabled:
          description: Enable or disable the transport configuration.
          type: boolean
          example: true
          default: true
        reception:
          type: boolean
          default: false
          example: true
          description: |
            Enables receiving documents through this transport channel. For Peppol transports, when reception is enabled (along with enabled=true), we publish your participant ID to the SML/SMP (Service Metadata Locator/Service Metadata Publisher) and the Peppol directory, allowing you to receive documents through the Peppol network.

            The system automatically publishes country-specific Peppol document types based on your enabled document type settings (invoice, credit_note, self_billing, order, application_response).
        invoice:
          description: |
            Enables support for Invoice documents in Peppol SMP. Only available for Peppol transport type.
            **Country-specific formats**: The actual document formats published depend on the Account's country.
          type: boolean
          default: true
          example: true
        credit_note:
          description: |
            Enables support for CreditNote documents in Peppol SMP. Only available for Peppol transport type.
            **Country-specific formats**: The actual document formats published depend on the Account's country.
          type: boolean
          default: true
          example: true
        self_billing:
          description: |
            Enables support for Self-Billing Invoice and Self-Billing CreditNote documents in Peppol SMP. Only available for Peppol transport type.
          type: boolean
          default: false
          example: false
        order:
          description: |
            Enables support for Order documents in Peppol SMP. Only available for Peppol transport type.
            Uses UBL Order format regardless of country.
          type: boolean
          default: true
          example: true
        application_response:
          description: |
            Enables support for ApplicationResponse documents in Peppol SMP. Only available for Peppol transport type.
            Uses UBL Application Response v3 formats regardless of country.
          type: boolean
          default: true
          example: true
        cdar:
          description: |
            Enables support for Cross-Domain Acknowledgement and Response documents in Peppol SMP. Only available for Peppol transport type.
            Relevant for France, where it advertises the capability to receive DGFiP e-reporting acknowledgements.
          type: boolean
          default: false
          example: true
        pin_scheme:
          description: pin_scheme
          type: string
          example: '9930'
        pin_value:
          description: pin_value
          type: string
          example: DE123456789
        sml_status:
          type: string
          enum:
            - not_published
            - processing
            - published
          readOnly: true
          description: |
            SML (Service Metadata Locator) registration status. Indicates whether B2Brouter has registered this participant identifier in the Peppol SML. 
            Only reflects the publication state managed by B2Brouter — not the status at third-party SMP providers.
          example: published
        peppol_directory_status:
          type: string
          enum:
            - not_published
            - processing
            - published
          readOnly: true
          description: |
            Peppol Directory publication status. Indicates whether B2Brouter has registered this participant in the Peppol Directory for discovery by other participants. 
            Only reflects the publication state managed by B2Brouter.
          example: published
        reception_document_types:
          type: array
          readOnly: true
          description: |
            List of Peppol document types this transport can receive, based on country
            and enabled document type capabilities (invoice, credit_note, etc.).
            Empty when reception is disabled.
          items:
            type: object
            properties:
              code:
                type: string
                description: Internal document type code. Matches codes from the /document_types endpoint.
                example: xml.ubl.invoice.bis3
              name:
                type: string
                description: Human-readable name of the document type.
                example: Peppol BIS3 Invoice
        migration_code:
          type: string
          writeOnly: true
          example: Xk9$mQ2!vTz4
          description: |
            Migration code issued by the provider that currently publishes this identifier, to move it to B2Brouter in the same request that enables reception.

            Send it only when enabling reception on an identifier that another provider publishes — the case that otherwise fails with a `409`. In any other request the code is refused with a `422`, never ignored; in the sandbox it is refused with a `409`, since migration codes are unavailable there. It is write-only: it never appears in a response.
        migration_pending:
          type: boolean
          readOnly: true
          example: false
          description: |
            `true` while a migration code issued for this account has not been cancelled. It only reflects the state of the code at B2Brouter, not where the identifier is published: B2Brouter is not notified when the gaining provider completes the migration, so the flag stays `true` then and only turns back to `false` when the code is cancelled. The code itself is never returned here.
        created_at:
          type: string
          format: date-time
          example: '2024-07-07T11:51:57Z'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          example: '2024-07-07T11:51:57Z'
          readOnly: true
