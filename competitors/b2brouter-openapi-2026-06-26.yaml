    TinVerificationResult:
      type: object
      description: Result of a single TIN+name verification against a tax authority census.
      properties:
        tin:
          type: string
          description: The original TIN value as submitted in the request.
          example: ESB86561412
        normalized_tin:
          type: string
          nullable: true
          description: The TIN after normalization (country prefix stripped, uppercased). Used internally for census lookup.
          example: B86561412
        name:
          type: string
          description: The entity name. If the tax authority returned a canonical name, it is used here instead of the original input.
          example: EMPRESA EXEMPLE SA
        tin_format_valid:
          type: boolean
          nullable: true
          description: Whether the TIN passes format and checksum validation for the given country's scheme. False means the TIN is syntactically invalid.
          example: true
        census_match:
          type: boolean
          nullable: true
          description: |-
            Whether the TIN+name pair was found in the tax authority's census. - `true`: The entity is registered in the census. - `false`: Not registered, or the TIN format is invalid. - `null`: Not yet processed (request still pending or failed before
              this item was reached).
          example: true
      required:
        - tin
        - tin_format_valid
        - census_match
    TinVerificationRequest:
      type: object
      description: A batch TIN verification request with its current status and results.
      properties:
        id:
          type: integer
          description: Unique identifier of the TIN verification request.
          example: 42
        status:
          type: string
          description: 'Current processing status of the request. - `pending`: Request created, not yet processing. - `processing`: Background job is running. - `success`: All verifications completed successfully. - `failed`: An error occurred during processing.'
          enum:
            - pending
            - processing
            - success
            - failed
          example: success
        results:
          type: array
          description: Verification results for each TIN+name pair. Empty while status is `pending` or `processing`.
          items:
            $ref: '#/components/schemas/TinVerificationResult'
        error_message:
          type: string
          nullable: true
          description: Error description when status is `failed`. Null otherwise.
          example: null
      required:
        - id
        - status
        - results
    WebHookEvent:
      type: string
      description: |
        Identifier of an event type a Web Hook can subscribe to.
      enum:
        - issued_invoice.state_change
        - received_invoice.state_change
        - received_invoice.created
        - tax_report.state_change
        - ledger.state_change
        - tin_verification.finished
        - sii_batch.finished
        - invoice_import.finished
    WebHook:
      type: object
      description: Represents a Web Hook configuration used to receive event notifications from the platform.
      properties:
        id:
          type: integer
          example: 123
          description: |
            An internal identifier that is unique to each **Web Hook** within B2Brouter.
          readOnly: true
        url:
          type: string
          format: uri
          example: https://example.com/webhooks/b2brouter
          maxLength: 512
          description: |
            The public HTTPS endpoint where event notifications will be delivered.
            The URL must be publicly accessible and cannot point to private or internal networks.
        description:
          type: string
          example: Webhook for tax report state changes
          nullable: true
          maxLength: 255
          description: |
            A human-readable description of the Web Hook, useful for identification and management purposes.
        enabled:
          type: boolean
          example: true
          default: true
          description: |
            Indicates whether the Web Hook is active.
            Disabled Web Hooks will not receive any event notifications.
        events:
          type: array
          description: |
            List of events this Web Hook is subscribed to.
            Notifications will be sent only when one of these events occurs.
          items:
            $ref: '#/components/schemas/WebHookEvent'
          example:
            - tax_report.state_change
            - issued_invoice.state_change
        signing_secret:
          type: string
          example: F8k2Pz9QxL7mN4YbA1CDeR5T6uVwEJHs
          description: |
            Secret used to sign Web Hook requests sent to the configured URL.
            This value is returned **only when the Web Hook is created** and should be stored securely.
          readOnly: true
        created_at:
          type: string
          format: date-time
          example: '2025-04-10T10:14:21.157690Z'
          description: |
            Timestamp indicating when the Web Hook was created.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          example: '2025-04-10T10:14:29.259065Z'
          description: |
            Timestamp indicating when the Web Hook was last updated.
          readOnly: true
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
