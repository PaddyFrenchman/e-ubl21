                    tax_inclusive_amount: 121
                    tax_amount: 21
                    invoice_type_code: F1
                    currency: EUR
                    special_regime_key: '01'
                    type_operation: services
                    tax_breakdowns:
                      - name: IVA
                        category: S
                        percent: 21
                        taxable_base: 100
                        tax_amount: 21
                        non_exempt: true
                        special_regime_key: '01'
                        non_exemption_code: S1
                    tax_report_lines:
