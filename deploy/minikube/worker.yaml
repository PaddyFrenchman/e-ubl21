apiVersion: v1
kind: Service
metadata:
  name: e-ubl21-worker
spec:
  selector:
    app.kubernetes.io/name: e-ubl21
    app.kubernetes.io/component: worker
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e-ubl21-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: e-ubl21
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e-ubl21
        app.kubernetes.io/component: worker
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: worker
          image: localhost/e-ubl21:regression
          imagePullPolicy: Never
          args: ["worker"]
          env:
            - name: EUBL21_NATS_URL
              value: nats://127.0.0.1:4222
            - name: EUBL21_QUEUE_NAMESPACE
              value: eubl21.regression
            - name: EUBL21_WORKER_CONSUMER_NAME
              value: regression-validator
            - name: EUBL21_WORKER_METRICS_ADDR
              value: :9091
            - name: EUBL21_WORKER_VALIDATION_TIMEOUT
              value: 60s
            - name: EUBL21_WORKER_XSD_VALIDATION_TIMEOUT
              value: 30s
            - name: EUBL21_WORKER_EN16931_VALIDATION_TIMEOUT
              value: 45s
            - name: EUBL21_WORKER_JAVA_EXECUTABLE
              value: /usr/bin/java
            - name: EUBL21_WORKER_SAXON_JAR_PATH
              value: /opt/e-ubl21/saxon/saxon-he-12.7.jar
            - name: EUBL21_WORKER_XMLRESOLVER_JAR_PATH
              value: /opt/e-ubl21/saxon/xmlresolver-6.0.17.jar
            - name: EUBL21_WORKER_SAXON_CONFIGURATION_PATH
              value: /opt/e-ubl21/validation-assets/saxon/saxon-config.xml
            - name: EUBL21_WORKER_EN16931_XSLT_PATH
              value: /opt/e-ubl21/validation-assets/en16931/1.3.16/EN16931-UBL-validation.xslt
            - name: EUBL21_WORKER_SAXON_STARTUP_TIMEOUT
              value: 30s
            - name: EUBL21_WORKER_CONCURRENCY
              value: "1"
            - name: EUBL21_WORKER_PREFETCH
              value: "1"
            - name: EUBL21_WORKER_ACK_WAIT
              value: 90s
            - name: EUBL21_WORKER_MAX_DELIVER
              value: "5"
            - name: EUBL21_UPLOAD_CONTENT_RETENTION
              value: 1h
            - name: EUBL21_UPLOAD_CONTENT_MAX_BYTES
              value: "1073741824"
          ports:
            - name: metrics
              containerPort: 9091
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
