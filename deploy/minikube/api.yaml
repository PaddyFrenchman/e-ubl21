apiVersion: v1
kind: Service
metadata:
  name: e-ubl21-api
spec:
  selector:
    app.kubernetes.io/name: e-ubl21
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e-ubl21-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: e-ubl21
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e-ubl21
        app.kubernetes.io/component: api
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: api
          image: localhost/e-ubl21:regression
          imagePullPolicy: Never
          args: ["serve"]
          env:
            - name: EUBL21_HOST
              value: 0.0.0.0
            - name: EUBL21_PORT
              value: "8080"
            - name: EUBL21_NATS_URL
              value: nats://127.0.0.1:4222
            - name: EUBL21_QUEUE_NAMESPACE
              value: eubl21.regression
            - name: EUBL21_OAUTH_ISSUER
              value: https://regression.e-ubl21.local
            - name: EUBL21_OAUTH_AUDIENCE
              value: e-ubl21-regression
            - name: EUBL21_OAUTH_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: e-ubl21-regression-auth
                  key: hmac-secret
            - name: EUBL21_RATE_LIMIT_RPS
              value: "1000"
            - name: EUBL21_RATE_LIMIT_BURST
              value: "2000"
            - name: EUBL21_UPLOAD_CONTENT_RETENTION
              value: 1h
            - name: EUBL21_UPLOAD_CONTENT_MAX_BYTES
              value: "1073741824"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
