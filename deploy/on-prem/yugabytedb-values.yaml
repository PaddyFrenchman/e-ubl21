# Single-server e-ubl21 baseline for the official YugabyteDB Helm chart.
# Dynamic image, storage size, and storage class pins are supplied by the
# installer so operators can size persistent volumes without editing this file.
oldNamingStyle: true
enableLoadBalancer: false
disableYsql: false

replicas:
  master: 1
  tserver: 1
  totalMasters: 1

partition:
  master: 0
  tserver: 0

storage:
  ephemeral: false
  master:
    count: 1
  tserver:
    count: 1

resource:
  master:
    requests:
      cpu: "500m"
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  tserver:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

gflags:
  master:
    default_memory_limit_to_ram_ratio: 0.85
  tserver:
    ysql_enable_auth: "true"

ybc:
  enabled: false

yugabytedUi:
  enabled: false
