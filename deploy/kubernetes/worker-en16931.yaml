apiVersion: v1
kind: Service
metadata:
  name: e-ubl21-worker-en16931
spec:
  selector:
    app.kubernetes.io/name: e-ubl21
    app.kubernetes.io/component: worker-en16931
  ports:
    - name: metrics
      port: 9093
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e-ubl21-worker-en16931
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: e-ubl21
      app.kubernetes.io/component: worker-en16931
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e-ubl21
        app.kubernetes.io/component: worker-en16931
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker-en16931
          image: e-ubl21:replace-me
          imagePullPolicy: IfNotPresent
          args: ["worker-en16931"]
          envFrom:
            - configMapRef:
                name: e-ubl21-runtime
          env:
            - name: OTEL_SERVICE_NAME
              value: e-ubl21-worker-en16931
            - name: EUBL21_WORKER_EN16931_METRICS_ADDR
              value: :9093
            - name: EUBL21_WORKER_EN16931_TIMEOUT
              value: 45s
            - name: EUBL21_WORKER_EN16931_CONCURRENCY
              value: "1"
            - name: EUBL21_WORKER_EN16931_PREFETCH
              value: "1"
            - name: EUBL21_WORKER_EN16931_PROGRESS_INTERVAL
              value: 20s
            - name: EUBL21_WORKER_EN16931_JAVA_EXECUTABLE
              value: /usr/bin/java
            - name: EUBL21_WORKER_EN16931_SAXON_JAR_PATH
              value: /opt/e-ubl21/saxon/saxon-he-12.7.jar
            - name: EUBL21_WORKER_EN16931_XMLRESOLVER_JAR_PATH
              value: /opt/e-ubl21/saxon/xmlresolver-6.0.17.jar
            - name: EUBL21_WORKER_EN16931_SAXON_CONFIGURATION_PATH
              value: /opt/e-ubl21/validation-assets/saxon/saxon-config.xml
            - name: EUBL21_WORKER_EN16931_RUNTIME_XSLT_PATH
              value: /opt/e-ubl21/validation-assets/en16931/1.3.16/EN16931-UBL-validation.xslt
            - name: EUBL21_WORKER_EN16931_SAXON_STARTUP_TIMEOUT
              value: 30s
          ports:
            - name: metrics
              containerPort: 9093
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 15
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "1"
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
