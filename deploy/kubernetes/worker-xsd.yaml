apiVersion: v1
kind: Service
metadata:
  name: e-ubl21-worker-xsd
spec:
  selector:
    app.kubernetes.io/name: e-ubl21
    app.kubernetes.io/component: worker-xsd
  ports:
    - name: metrics
      port: 9092
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e-ubl21-worker-xsd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: e-ubl21
      app.kubernetes.io/component: worker-xsd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e-ubl21
        app.kubernetes.io/component: worker-xsd
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker-xsd
          image: e-ubl21:replace-me
          imagePullPolicy: IfNotPresent
          args: ["worker-xsd"]
          envFrom:
            - configMapRef:
                name: e-ubl21-runtime
          env:
            - name: OTEL_SERVICE_NAME
              value: e-ubl21-worker-xsd
            - name: EUBL21_WORKER_XSD_METRICS_ADDR
              value: :9092
            - name: EUBL21_WORKER_XSD_TIMEOUT
              value: 30s
            - name: EUBL21_WORKER_XSD_CONCURRENCY
              value: "2"
            - name: EUBL21_WORKER_XSD_PREFETCH
              value: "2"
            - name: EUBL21_WORKER_XSD_PROGRESS_INTERVAL
              value: 20s
          ports:
            - name: metrics
              containerPort: 9092
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 15
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
