apiVersion: v1
kind: Service
metadata:
  name: e-ubl21-api
spec:
  selector:
    app.kubernetes.io/name: e-ubl21
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e-ubl21-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: e-ubl21
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e-ubl21
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: e-ubl21:replace-me
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          envFrom:
            - configMapRef:
                name: e-ubl21-runtime
          env:
            - name: OTEL_SERVICE_NAME
              value: e-ubl21-api
            - name: EUBL21_HOST
              value: 0.0.0.0
            - name: EUBL21_PORT
              value: "8080"
            - name: EUBL21_OAUTH_ISSUER
              valueFrom:
                secretKeyRef:
                  name: e-ubl21-auth
                  key: issuer
            - name: EUBL21_OAUTH_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: e-ubl21-auth
                  key: audience
            - name: EUBL21_OAUTH_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: e-ubl21-auth
                  key: hmac-secret
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
