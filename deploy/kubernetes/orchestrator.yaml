apiVersion: v1
kind: Service
metadata:
  name: e-ubl21-orchestrator
spec:
  selector:
    app.kubernetes.io/name: e-ubl21
    app.kubernetes.io/component: orchestrator
  ports:
    - name: metrics
      port: 9094
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e-ubl21-orchestrator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: e-ubl21
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e-ubl21
        app.kubernetes.io/component: orchestrator
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: e-ubl21:replace-me
          imagePullPolicy: IfNotPresent
          args: ["orchestrator"]
          envFrom:
            - configMapRef:
                name: e-ubl21-runtime
          env:
            - name: OTEL_SERVICE_NAME
              value: e-ubl21-orchestrator
            - name: EUBL21_ORCHESTRATOR_METRICS_ADDR
              value: :9094
            - name: EUBL21_ORCHESTRATOR_RESULT_PREFETCH
              value: "8"
            - name: EUBL21_ORCHESTRATOR_RECONCILE_INTERVAL
              value: 10s
          ports:
            - name: metrics
              containerPort: 9094
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 15
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
