apiVersion: v1
kind: ConfigMap
metadata:
  name: eubl21-yugabytedb-dashboard
  namespace: monitoring
  labels: {grafana_dashboard: "1"}
data:
  yugabytedb-overview.json: |
    {"title":"e-ubl21 YugabyteDB","schemaVersion":39,"panels":[
    {"type":"stat","title":"Live YB tservers","targets":[{"expr":"sum(up{namespace=~\"eubl21-yb-zone-[abc]\",app=\"yb-tserver\"})"}]},
    {"type":"stat","title":"Live YB masters","targets":[{"expr":"sum(up{namespace=~\"eubl21-yb-zone-[abc]\",app=\"yb-master\"})"}]},
    {"type":"stat","title":"Raft leaders","targets":[{"expr":"sum(is_raft_leader{namespace=~\"eubl21-yb-zone-[abc]\"})"}]},
    {"type":"timeseries","title":"Raft follower lag (ms)","targets":[{"expr":"max(follower_lag_ms{namespace=~\"eubl21-yb-zone-[abc]\",app=\"yb-tserver\"})"}]},
    {"type":"timeseries","title":"PVC free bytes","targets":[{"expr":"kubelet_volume_stats_available_bytes{namespace=~\"eubl21-yb-zone-[abc]\"}"}]},
    {"type":"timeseries","title":"YSQL p99 statement latency (ms)","targets":[{"expr":"max({__name__=~\"handler_latency_yb_ysqlserver_SQLProcessor_.*\",quantile=\"p99\"}) / 1000"}]},
    {"type":"timeseries","title":"Storage growth (bytes)","targets":[{"expr":"kubelet_volume_stats_used_bytes{namespace=~\"eubl21-yb-zone-[abc]\"}"}]}
    ]}
