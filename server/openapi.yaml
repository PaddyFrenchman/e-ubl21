openapi: 3.0.3
info:
  title: e-ubl21 API
  version: 0.1.0
  description: API for uploading and validating UBL 2.1 XML documents.
servers:
  - url: https://api.example.com
security:
  - oauth2: []
tags:
  - name: UBL
    description: UBL document upload and validation operations.
  - name: Service
    description: Service metadata, liveness and metrics endpoints.
paths:
  /:
    get:
      operationId: ServiceInfo
      tags:
        - Service
      summary: Service information
      description: >-
        Returns the service name, the configured Swagger UI path, and the
        configured OAuth issuer/audience.
      responses:
        '200':
          description: Service information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: e-ubl21
                  docs:
                    type: string
                    description: The path the Swagger UI is served from.
                    example: /swagger/
                  oauth:
                    type: object
                    properties:
                      issuer:
                        type: string
                        example: https://issuer.example.com
                      audience:
                        type: string
                        example: e-ubl21
                    example:
                      issuer: https://issuer.example.com
                      audience: e-ubl21
                required:
                  - service
                  - docs
                  - oauth
              example:
                service: e-ubl21
                docs: /swagger/
                oauth:
                  issuer: https://issuer.example.com
                  audience: e-ubl21
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Misconfigured'
  /healthz:
    get:
      operationId: HealthCheck
      tags:
        - Service
      summary: Liveness check
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                  - status
              example:
                status: ok
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Misconfigured'
  /metrics:
    get:
      operationId: Metrics
      tags:
        - Service
      summary: Prometheus metrics
      description: >-
        Exposes e_ubl21_* and standard Go runtime/process metrics in the
        Prometheus text exposition format.
      responses:
        '200':
          description: Metrics in Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Misconfigured'
  /api/v1/ubl/upload:
    post:
      operationId: UBLUploadUploadXMLDocument
      tags:
        - UBL
      summary: Upload a UBL 2.1 XML document
      description: >-
        Accepts an XML payload, and if it has a syntactically valid root
        element that is a recognized UBL 2.1 main document type (local name
        and namespace), stores the raw XML once and queues a compact work
        descriptor on its per-document-type NATS JetStream subject for
        asynchronous XSD validation. Full XML well-formedness and UBL 2.1
        schema validity are established asynchronously by the worker.
      requestBody:
        required: true
        description: Raw XML document payload for a UBL 2.1 invoice or other supported main document type. Limited to 10 MiB; see the 413 response.
        content:
          application/xml:
            schema:
              type: string
          text/xml:
            schema:
              type: string
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: >-
            The payload has a syntactically valid root element that is a
            recognized UBL 2.1 document type. It has been queued for
            asynchronous XSD validation. Its status is accepting or
            enqueue_pending while a partial acceptance is being reconciled,
            pending once queued, and later valid, invalid, or processing_failed
            after a recoverable dead_letter_pending transition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [accepting, enqueue_pending, pending]
                    example: pending
                  id:
                    type: string
                    example: 3f9c2b1a7e4d4f0a9b1c2d3e4f5a6b7c
                  document:
                    type: string
                    example: Invoice
                  receivedAt:
                    type: string
                    format: date-time
                    example: '2026-08-20T12:00:00Z'
                required: [status, id, document, receivedAt]
              example:
                status: pending
                id: 3f9c2b1a7e4d4f0a9b1c2d3e4f5a6b7c
                document: Invoice
                receivedAt: '2026-08-20T12:00:00Z'
        '400':
          description: Invalid or unsupported root element.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: Request body exceeds the 10 MiB upload limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Server or queue/storage failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/ubl/{id}:
    get:
      operationId: UBLUploadGetXMLDocument
      tags:
        - UBL
      summary: Retrieve upload status and metadata
      description: >-
        Returns retained upload status and metadata without loading raw XML by
        default. Raw content expires independently after validation; set
        includeContent=true only while contentAvailable is true.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The id returned by a previous successful upload.
        - name: includeContent
          in: query
          required: false
          description: >-
            When true, include the original raw XML payload. Returns 410 after
            raw content expires; retained validation metadata remains available.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Upload status and metadata. Content is present only when includeContent=true.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 3f9c2b1a7e4d4f0a9b1c2d3e4f5a6b7c
                  document:
                    type: string
                    example: Invoice
                  status:
                    type: string
                    enum: [accepting, cleanup_pending, enqueue_pending, pending, valid, invalid, acceptance_failed, dead_letter_pending, processing_failed]
                    example: valid
                  receivedAt:
                    type: string
                    format: date-time
                    example: '2026-08-20T12:00:00Z'
                  validatedAt:
                    type: string
                    format: date-time
                    description: Present once the worker has processed the document.
                    example: '2026-08-20T12:00:01Z'
                  validationStages:
                    type: array
                    description: Independently reportable validation-layer outcomes, in execution order.
                    items:
                      $ref: '#/components/schemas/ValidationStageResult'
                    example:
                      - layer: ubl21-xsd
                        version: '2.1'
                        valid: true
                        validatedAt: '2026-08-20T12:00:01Z'
                        durationMs: 14
                  contentAvailable:
                    type: boolean
                    description: >-
                      Whether lifecycle metadata indicates that raw XML is
                      retained and eligible for retrieval; this does not
                      perform an Object Store read.
                    example: true
                  contentExpiresAt:
                    type: string
                    format: date-time
                    description: Scheduled raw-content expiry time, present after validation when retention is enabled.
                    example: '2026-09-19T12:00:01Z'
                  contentExpiredAt:
                    type: string
                    format: date-time
                    description: >-
                      Time raw content became unavailable under the retention
                      policy. Physical deletion is retried independently;
                      validation metadata remains available.
                    example: '2026-09-19T12:00:30Z'
                  error:
                    type: string
                    description: Validation error, or terminal processing error when status is processing_failed.
                    example: 'Invoice: element content does not follow the schema'
                  lastError:
                    type: string
                    description: Most recent operational processing error.
                    example: 'load upload content: object not found'
                  processingAttempts:
                    type: integer
                    format: int64
                    description: JetStream delivery attempts observed for the most recent operational failure.
                    example: 5
                  processingFailedAt:
                    type: string
                    format: date-time
                    description: Time delivery attempts were exhausted and the upload entered processing_failed.
                    example: '2026-08-20T12:05:00Z'
                  content:
                    type: string
                    description: The original raw XML payload. Present only when includeContent=true.
                    example: '<?xml version="1.0" encoding="UTF-8"?><Invoice xmlns="urn:oasis:names:specification:ubl:schema:xsd:Invoice-2">...</Invoice>'
                required: [id, document, status, receivedAt, contentAvailable]
              example:
                id: 3f9c2b1a7e4d4f0a9b1c2d3e4f5a6b7c
                document: Invoice
                status: valid
                receivedAt: '2026-08-20T12:00:00Z'
                validatedAt: '2026-08-20T12:00:01Z'
                validationStages:
                  - layer: ubl21-xsd
                    version: '2.1'
                    valid: true
                    validatedAt: '2026-08-20T12:00:01Z'
                    durationMs: 14
                contentAvailable: true
                contentExpiresAt: '2026-09-19T12:00:01Z'
        '400':
          description: Invalid includeContent query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: includeContent must be true or false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No upload exists with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: The upload metadata exists, but its raw XML content has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: upload content has expired
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Misconfigured'
components:
  schemas:
    ValidationIssue:
      description: A structured standards-validation diagnostic; never raw XML or raw validator output.
      type: object
      example:
        layer: en16931
        rule: BR-CO-10
        severity: error
        location: /ubl:Invoice/cac:LegalMonetaryTotal
        test: xs:decimal(cbc:LineExtensionAmount) = 100
        message: Sum of invoice line net amounts must equal the invoice total.
        diagnostic: BT-106 does not reconcile.
      properties:
        layer:
          type: string
          enum: [ubl21-xsd, en16931]
          example: en16931
        rule:
          type: string
          example: BR-CO-10
        severity:
          type: string
          example: error
        location:
          type: string
          example: /ubl:Invoice/cac:LegalMonetaryTotal
        test:
          type: string
          example: xs:decimal(cbc:LineExtensionAmount) = 100
        message:
          type: string
          example: Sum of invoice line net amounts must equal the invoice total.
        diagnostic:
          type: string
          example: BT-106 does not reconcile.
      required: [layer, severity, message]
      additionalProperties: false
    ValidationStageResult:
      description: Outcome of one completed validation layer.
      type: object
      properties:
        layer:
          type: string
          enum: [ubl21-xsd, en16931]
        version:
          type: string
          example: 1.3.16
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
        validatedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
          minimum: 0
      required: [layer, valid, validatedAt]
      additionalProperties: false
    ErrorResponse:
      description: Standard error payload returned when a request is rejected.
      type: object
      properties:
        error:
          type: string
          example: missing bearer token
      required: [error]
      additionalProperties: false
  responses:
    Unauthorized:
      description: Missing or invalid OAuth 2 bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: Method not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Misconfigured:
      description: 'Server misconfiguration: no OAuth signing secret is configured.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2 bearer token (HS256-signed JWT) used to authenticate the caller.
      flows:
        clientCredentials:
          tokenUrl: https://issuer.example.com/oauth/token
          scopes: {}
