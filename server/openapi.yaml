openapi: 3.0.3
info:
  title: e-ubl21 API
  version: 0.1.0
  description: API for uploading and validating UBL 2.1 XML documents.
servers:
  - url: https://api.example.com
security:
  - oauth2: []
tags:
  - name: UBL
    description: UBL document upload and validation operations.
  - name: Service
    description: Service metadata, liveness and metrics endpoints.
paths:
  /:
    get:
      operationId: ServiceInfo
      tags:
        - Service
      summary: Service information
      description: >-
        Returns the service name, the configured Swagger UI path, and the
        configured OAuth issuer/audience.
      responses:
        '200':
          description: Service information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: e-ubl21
                  docs:
                    type: string
                    description: The path the Swagger UI is served from.
                    example: /swagger/
                  oauth:
                    type: object
                    properties:
                      issuer:
                        type: string
                        example: https://issuer.example.com
                      audience:
                        type: string
                        example: e-ubl21
                    example:
                      issuer: https://issuer.example.com
                      audience: e-ubl21
                required:
                  - service
                  - docs
                  - oauth
              example:
                service: e-ubl21
                docs: /swagger/
                oauth:
                  issuer: https://issuer.example.com
                  audience: e-ubl21
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Misconfigured'
  /healthz:
    get:
      operationId: HealthCheck
      tags:
        - Service
      summary: Liveness check
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                  - status
              example:
                status: ok
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Misconfigured'
  /metrics:
    get:
      operationId: Metrics
      tags:
        - Service
      summary: Prometheus metrics
      description: >-
        Exposes e_ubl21_* and standard Go runtime/process metrics in the
        Prometheus text exposition format.
      responses:
        '200':
          description: Metrics in Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Misconfigured'
  /api/v1/ubl/upload:
    post:
      operationId: UBLUploadUploadXMLDocument
      tags:
        - UBL
      summary: Upload a UBL 2.1 XML document
      description: >-
        Accepts an XML payload, stores it once, and durably submits it to the
        active validation deployment generation. Every recognized
        document is validated against UBL 2.1 XSD. An omitted
        validationProfile behaves as auto: Invoice and CreditNote identifiers
        may resolve to Peppol BIS Billing, otherwise billing documents resolve
        to EN 16931 and other UBL documents resolve to XSD-only validation.
      parameters:
        - name: validationProfile
          in: query
          required: false
          description: >-
            Requested standards pipeline. Auto is the default. Explicit Peppol
            never downgrades when identifiers are missing or unsupported; those
            identifiers are decided by the Peppol stage after XSD and EN pass.
          schema:
            type: string
            enum: [auto, ubl21, ubl21-en16931, peppol-bis-billing]
            default: auto
        - name: profile
          in: query
          required: false
          deprecated: true
          description: Deprecated compatibility alias for validationProfile. Supplying conflicting values is rejected.
          schema:
            type: string
            enum: [auto, ubl21, ubl21-en16931, peppol-bis-billing]
        - name: documentType
          in: query
          required: false
          description: >-
            Explicit recognized UBL root local name. When supplied and equal
            to the payload root local name, namespace defects are queued for
            XSD validation instead of being rejected during cheap ingress.
          schema:
            type: string
      requestBody:
        required: true
        description: Raw XML document payload for a UBL 2.1 invoice or other supported main document type. Limited to 10 MiB; see the 413 response.
        content:
          application/xml:
            schema:
              type: string
          text/xml:
            schema:
              type: string
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: >-
            The payload has a syntactically valid root element that is a
            recognized UBL 2.1 document type. It has been queued for
            asynchronous standards validation. Its status is accepting or
            enqueue_pending while a partial acceptance is being reconciled,
            pending once queued, and later valid, invalid, or processing_failed
            after a recoverable dead_letter_pending transition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [accepting, enqueue_pending, pending]
                    example: pending
                  id:
                    type: string
                    example: 3f9c2b1a7e4d4f0a9b1c2d3e4f5a6b7c
                  document:
                    type: string
                    example: Invoice
                  requestedProfile:
                    type: string
                    enum: [auto, ubl21, ubl21-en16931, peppol-bis-billing]
                  resolvedProfile:
                    type: string
                    enum: [ubl21, ubl21-en16931, peppol-bis-billing]
                  profile:
                    type: string
                    deprecated: true
                    description: Compatibility alias for resolvedProfile.
                    enum: [ubl21, ubl21-en16931, peppol-bis-billing]
                  receivedAt:
                    type: string
                    format: date-time
                    example: '2026-08-20T12:00:00Z'
                required: [status, id, document, requestedProfile, resolvedProfile, profile, receivedAt]
              example:
                status: pending
                id: 3f9c2b1a7e4d4f0a9b1c2d3e4f5a6b7c
                document: Invoice
                requestedProfile: auto
                resolvedProfile: ubl21-en16931
                profile: ubl21-en16931
                receivedAt: '2026-08-20T12:00:00Z'
        '400':
          description: Invalid or unsupported root element.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: Request body exceeds the 10 MiB upload limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: >-
            Validation admission is paused while the legacy deployment drains,
            or the request resolved to Peppol while only the legacy worker
            topology is active.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Suggested retry delay in seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server or queue/storage failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/ubl/{id}:
    get:
      operationId: UBLUploadGetXMLDocument
      tags:
        - UBL
      summary: Retrieve upload status and metadata
      description: >-
        Returns retained upload status and metadata without loading raw XML by
        default. Raw content expires independently after validation; set
        includeContent=true only while contentAvailable is true.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The id returned by a previous successful upload.
        - name: includeContent
          in: query
          required: false
          description: >-
            When true, include the original raw XML payload. Returns 410 after
            raw content expires; retained validation metadata remains available.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Upload status and metadata. Content is present only when includeContent=true.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 3f9c2b1a7e4d4f0a9b1c2d3e4f5a6b7c
                  document:
                    type: string
                    example: Invoice
                  requestedProfile:
                    type: string
                    description: Caller selection; auto is retained when it was omitted.
                    enum: [auto, ubl21, ubl21-en16931, peppol-bis-billing]
                  resolvedProfile:
                    type: string
                    description: Concrete immutable profile used by the validation plan.
                    enum: [ubl21, ubl21-en16931, peppol-bis-billing]
                  profile:
                    type: string
                    deprecated: true
                    description: Compatibility alias for resolvedProfile.
                    enum: [ubl21, ubl21-en16931, peppol-bis-billing]
                  status:
                    type: string
                    enum: [accepting, cleanup_pending, enqueue_pending, pending, valid, invalid, acceptance_failed, dead_letter_pending, processing_failed]
                    example: valid
                  receivedAt:
                    type: string
                    format: date-time
                    example: '2026-08-20T12:00:00Z'
                  validatedAt:
                    type: string
                    format: date-time
                    description: Present once the worker has processed the document.
                    example: '2026-08-20T12:00:01Z'
                  validationStages:
                    type: array
                    description: >-
                      Completed validation-layer outcomes in execution order.
                      A Peppol-resolved Invoice or CreditNote is valid only
                      after ubl21-xsd, en16931, and peppol-bis-billing pass.
                      Raw SVRL is never returned by this endpoint.
                    items:
                      $ref: '#/components/schemas/ValidationStageResult'
                    example:
                      - layer: ubl21-xsd
                        version: '2.1'
                        valid: true
                        validatedAt: '2026-08-20T12:00:01Z'
                        durationMs: 14
                  contentAvailable:
                    type: boolean
                    description: >-
                      Whether lifecycle metadata indicates that raw XML is
                      retained and eligible for retrieval; this does not
                      perform an Object Store read.
                    example: true
                  contentExpiresAt:
                    type: string
                    format: date-time
                    description: Scheduled raw-content expiry time, present after validation when retention is enabled.
                    example: '2026-09-19T12:00:01Z'
                  contentExpiredAt:
                    type: string
                    format: date-time
                    description: >-
                      Time raw content became unavailable under the retention
                      policy. Physical deletion is retried independently;
                      validation metadata remains available.
                    example: '2026-09-19T12:00:30Z'
                  error:
                    type: string
                    description: Validation error, or terminal processing error when status is processing_failed.
                    example: 'Invoice: element content does not follow the schema'
                  lastError:
                    type: string
                    description: Most recent operational processing error.
                    example: 'load upload content: object not found'
                  processingAttempts:
                    type: integer
                    format: int64
                    description: JetStream delivery attempts observed for the most recent operational failure.
                    example: 5
                  processingFailedAt:
                    type: string
                    format: date-time
                    description: Time delivery attempts were exhausted and the upload entered processing_failed.
                    example: '2026-08-20T12:05:00Z'
                  content:
                    type: string
                    description: The original raw XML payload. Present only when includeContent=true.
                    example: '<?xml version="1.0" encoding="UTF-8"?><Invoice xmlns="urn:oasis:names:specification:ubl:schema:xsd:Invoice-2">...</Invoice>'
                required: [id, document, requestedProfile, resolvedProfile, profile, status, receivedAt, contentAvailable]
              examples:
                xsdInvalidInvoice:
                  summary: Invoice rejected by UBL 2.1 XSD
                  value:
                    id: '11111111111111111111111111111111'
                    document: Invoice
                    requestedProfile: ubl21
                    resolvedProfile: ubl21
                    profile: ubl21
                    status: invalid
                    receivedAt: '2026-08-20T12:00:00Z'
                    validatedAt: '2026-08-20T12:00:01Z'
                    validationStages:
                      - layer: ubl21-xsd
                        version: '2.1'
                        valid: false
                        issues:
                          - kind: xsd-report
                            layer: ubl21-xsd
                            severity: error
                            location: '/Invoice/cbc:IssueDate'
                            message: Element IssueDate is required.
                        validatedAt: '2026-08-20T12:00:01Z'
                        durationMs: 12
                    contentAvailable: true
                en16931InvalidInvoice:
                  summary: XSD-valid Invoice rejected by EN 16931
                  value:
                    id: '22222222222222222222222222222222'
                    document: Invoice
                    requestedProfile: ubl21-en16931
                    resolvedProfile: ubl21-en16931
                    profile: ubl21-en16931
                    status: invalid
                    receivedAt: '2026-08-20T12:00:00Z'
                    validatedAt: '2026-08-20T12:00:02Z'
                    validationStages:
                      - layer: ubl21-xsd
                        version: '2.1'
                        valid: true
                        validatedAt: '2026-08-20T12:00:01Z'
                        durationMs: 14
                      - layer: en16931
                        version: '1.3.16'
                        valid: false
                        issues:
                          - kind: failed-assert
                            layer: en16931
                            rule: BR-CO-13
                            severity: fatal
                            location: '/ubl:Invoice/cac:LegalMonetaryTotal'
                            test: 'cbc:TaxExclusiveAmount = sum(cac:InvoiceLine/cbc:LineExtensionAmount)'
                            message: Invoice total amount without VAT must equal the sum of invoice line net amounts.
                            diagnostic: BT-109 does not reconcile with BT-131.
                        validatedAt: '2026-08-20T12:00:02Z'
                        durationMs: 38
                    contentAvailable: true
                compliantInvoice:
                  summary: Invoice passing UBL 2.1 and EN 16931
                  value:
                    id: '33333333333333333333333333333333'
                    document: Invoice
                    requestedProfile: ubl21-en16931
                    resolvedProfile: ubl21-en16931
                    profile: ubl21-en16931
                    status: valid
                    receivedAt: '2026-08-20T12:00:00Z'
                    validatedAt: '2026-08-20T12:00:02Z'
                    validationStages:
                      - layer: ubl21-xsd
                        version: '2.1'
                        valid: true
                        validatedAt: '2026-08-20T12:00:01Z'
                        durationMs: 14
                      - layer: en16931
                        version: '1.3.16'
                        valid: true
                        validatedAt: '2026-08-20T12:00:02Z'
                        durationMs: 31
                    contentAvailable: true
                    contentExpiresAt: '2026-09-19T12:00:02Z'
                peppolValidInvoice:
                  summary: Auto-resolved Invoice passing all three Peppol stages
                  value:
                    id: '66666666666666666666666666666666'
                    document: Invoice
                    requestedProfile: auto
                    resolvedProfile: peppol-bis-billing
                    profile: peppol-bis-billing
                    status: valid
                    receivedAt: '2026-08-20T12:00:00Z'
                    validatedAt: '2026-08-20T12:00:03Z'
                    validationStages:
                      - {layer: ubl21-xsd, version: '2.1', valid: true, validatedAt: '2026-08-20T12:00:01Z'}
                      - {layer: en16931, version: '1.3.16', valid: true, validatedAt: '2026-08-20T12:00:02Z'}
                      - layer: peppol-bis-billing
                        version: '1.3.16'
                        bisVersion: '3.0.21'
                        bisReleaseDate: '2026-05-20'
                        bisMandatoryFrom: '2026-08-17'
                        customizationId: urn:cen.eu:en16931:2017#compliant#urn:fdc:peppol.eu:2017:poacc:billing:3.0
                        profileId: urn:fdc:peppol.eu:2017:poacc:billing:01:1.0
                        processProfile: '01'
                        valid: true
                        validatedAt: '2026-08-20T12:00:03Z'
                    contentAvailable: true
                peppolValidCreditNote:
                  summary: Explicit Peppol CreditNote passing all three stages
                  value:
                    id: '77777777777777777777777777777777'
                    document: CreditNote
                    requestedProfile: peppol-bis-billing
                    resolvedProfile: peppol-bis-billing
                    profile: peppol-bis-billing
                    status: valid
                    receivedAt: '2026-08-20T12:00:00Z'
                    validatedAt: '2026-08-20T12:00:03Z'
                    validationStages:
                      - {layer: ubl21-xsd, version: '2.1', valid: true, validatedAt: '2026-08-20T12:00:01Z'}
                      - {layer: en16931, version: '1.3.16', valid: true, validatedAt: '2026-08-20T12:00:02Z'}
                      - layer: peppol-bis-billing
                        version: '1.3.16'
                        bisVersion: '3.0.21'
                        profileId: urn:peppol:bis:billing_with_response
                        processProfile: '02'
                        valid: true
                        validatedAt: '2026-08-20T12:00:03Z'
                    contentAvailable: true
                peppolInvalidInvoice:
                  summary: EN-valid Invoice rejected by an official Peppol rule
                  value:
                    id: '88888888888888888888888888888888'
                    document: Invoice
                    requestedProfile: peppol-bis-billing
                    resolvedProfile: peppol-bis-billing
                    profile: peppol-bis-billing
                    status: invalid
                    receivedAt: '2026-08-20T12:00:00Z'
                    validatedAt: '2026-08-20T12:00:03Z'
                    validationStages:
                      - {layer: ubl21-xsd, version: '2.1', valid: true, validatedAt: '2026-08-20T12:00:01Z'}
                      - {layer: en16931, version: '1.3.16', valid: true, validatedAt: '2026-08-20T12:00:02Z'}
                      - layer: peppol-bis-billing
                        version: '1.3.16'
                        valid: false
                        issues:
                          - {kind: failed-assert, layer: peppol-bis-billing, rule: PEPPOL-EN16931-R001, severity: fatal, message: Business process identifier is required.}
                        validatedAt: '2026-08-20T12:00:03Z'
                    contentAvailable: true
                unsupportedPeppolProfileID:
                  summary: Explicit Peppol request with an unsupported ProfileID
                  value:
                    id: '99999999999999999999999999999999'
                    document: Invoice
                    requestedProfile: peppol-bis-billing
                    resolvedProfile: peppol-bis-billing
                    profile: peppol-bis-billing
                    status: invalid
                    receivedAt: '2026-08-20T12:00:00Z'
                    validatedAt: '2026-08-20T12:00:03Z'
                    validationStages:
                      - {layer: ubl21-xsd, version: '2.1', valid: true, validatedAt: '2026-08-20T12:00:01Z'}
                      - {layer: en16931, version: '1.3.16', valid: true, validatedAt: '2026-08-20T12:00:02Z'}
                      - layer: peppol-bis-billing
                        version: '1.3.16'
                        profileId: urn:unsupported:profile
                        valid: false
                        issues:
                          - {kind: failed-assert, layer: peppol-bis-billing, rule: EUBL21-PEPPOL-PROFILE-ID-UNSUPPORTED, severity: error, message: ProfileID is not supported by the Peppol Billing product profile.}
                        validatedAt: '2026-08-20T12:00:03Z'
                    contentAvailable: true
                peppolOperationalFailure:
                  summary: Peppol runtime exhausted its independent retry budget
                  value:
                    id: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
                    document: Invoice
                    requestedProfile: peppol-bis-billing
                    resolvedProfile: peppol-bis-billing
                    profile: peppol-bis-billing
                    status: processing_failed
                    receivedAt: '2026-08-20T12:00:00Z'
                    validatedAt: '2026-08-20T12:05:00Z'
                    validationStages:
                      - {layer: ubl21-xsd, version: '2.1', valid: true, validatedAt: '2026-08-20T12:00:01Z'}
                      - {layer: en16931, version: '1.3.16', valid: true, validatedAt: '2026-08-20T12:00:02Z'}
                      - layer: peppol-bis-billing
                        version: '1.3.16'
                        bisVersion: '3.0.21'
                        valid: false
                        outcome: operational-failure
                        reason: timeout
                        diagnostic: Peppol validation process timed out.
                        validatedAt: '2026-08-20T12:05:00Z'
                    error: 'Peppol BIS Billing validation failed: Saxon process timed out'
                    lastError: 'Peppol BIS Billing validation failed: Saxon process timed out'
                    processingAttempts: 3
                    processingFailedAt: '2026-08-20T12:05:00Z'
                    contentAvailable: true
                validOrder:
                  summary: Non-billing UBL document passing its XSD-only contract
                  value:
                    id: '44444444444444444444444444444444'
                    document: Order
                    requestedProfile: auto
                    resolvedProfile: ubl21
                    profile: ubl21
                    status: valid
                    receivedAt: '2026-08-20T12:00:00Z'
                    validatedAt: '2026-08-20T12:00:01Z'
                    validationStages:
                      - layer: ubl21-xsd
                        version: '2.1'
                        valid: true
                        validatedAt: '2026-08-20T12:00:01Z'
                        durationMs: 11
                    contentAvailable: true
                processingFailed:
                  summary: Validation could not complete for an operational reason
                  value:
                    id: '55555555555555555555555555555555'
                    document: Invoice
                    requestedProfile: ubl21-en16931
                    resolvedProfile: ubl21-en16931
                    profile: ubl21-en16931
                    status: processing_failed
                    receivedAt: '2026-08-20T12:00:00Z'
                    error: 'EN 16931 validation failed: Saxon process timed out'
                    lastError: 'EN 16931 validation failed: Saxon process timed out'
                    processingAttempts: 5
                    processingFailedAt: '2026-08-20T12:05:00Z'
                    contentAvailable: true
        '400':
          description: Invalid includeContent query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: includeContent must be true or false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No upload exists with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: The upload metadata exists, but its raw XML content has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: upload content has expired
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Misconfigured'
components:
  schemas:
    ValidationIssue:
      description: A structured standards-validation diagnostic; never raw XML or raw validator output.
      type: object
      example:
        kind: failed-assert
        layer: en16931
        rule: BR-CO-10
        severity: error
        location: /ubl:Invoice/cac:LegalMonetaryTotal
        test: xs:decimal(cbc:LineExtensionAmount) = 100
        message: Sum of invoice line net amounts must equal the invoice total.
        diagnostic: BT-106 does not reconcile.
      properties:
        kind:
          type: string
          enum: [xsd-report, failed-assert, successful-report]
          example: failed-assert
        layer:
          type: string
          enum: [ubl21-xsd, en16931, peppol-bis-billing]
          example: en16931
        rule:
          type: string
          example: BR-CO-10
        severity:
          type: string
          example: error
        location:
          type: string
          example: /ubl:Invoice/cac:LegalMonetaryTotal
        test:
          type: string
          example: xs:decimal(cbc:LineExtensionAmount) = 100
        message:
          type: string
          example: Sum of invoice line net amounts must equal the invoice total.
        diagnostic:
          type: string
          example: BT-106 does not reconcile.
      required: [kind, layer, severity, message]
      additionalProperties: false
    ValidationStageResult:
      description: >-
        Outcome of one completed validation layer. Version identifies the UBL
        schema or machine validation artefact used for that result. Peppol
        layers additionally carry the BIS release and resolved process identity.
      type: object
      properties:
        layer:
          type: string
          enum: [ubl21-xsd, en16931, peppol-bis-billing]
        version:
          type: string
          example: 1.3.16
        bisVersion:
          type: string
          description: Peppol BIS Billing release; present only on the Peppol layer.
          example: 3.0.21
        bisReleaseDate:
          type: string
          format: date
          description: Publication date of the Peppol BIS release.
          example: '2026-05-20'
        bisMandatoryFrom:
          type: string
          format: date
          description: Mandatory-from date of the Peppol BIS release.
          example: '2026-08-17'
        customizationId:
          type: string
          maxLength: 1024
          description: Normalized Peppol CustomizationID actually inspected.
          example: urn:cen.eu:en16931:2017#compliant#urn:fdc:peppol.eu:2017:poacc:billing:3.0
        profileId:
          type: string
          maxLength: 1024
          description: Normalized Peppol ProfileID actually inspected.
          example: urn:fdc:peppol.eu:2017:poacc:billing:01:1.0
        processProfile:
          type: string
          description: Stable Peppol Billing process code when ProfileID resolved.
          enum: ['01', '02']
        valid:
          type: boolean
        outcome:
          type: string
          enum: [passed, standards-invalid, operational-failure]
        reason:
          type: string
          enum:
            - timeout
            - cancelled
            - content-unavailable
            - runtime-unavailable
            - runtime-failure
            - malformed-output
            - resource-limit
            - internal-error
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
        diagnostic:
          type: string
          description: Bounded operational or standards detail; never raw SVRL.
        validatedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
          minimum: 0
      required: [layer, version, valid, validatedAt]
      additionalProperties: false
    ErrorResponse:
      description: Standard error payload returned when a request is rejected.
      type: object
      properties:
        error:
          type: string
          example: missing bearer token
      required: [error]
      additionalProperties: false
  responses:
    Unauthorized:
      description: Missing or invalid OAuth 2 bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: Method not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Misconfigured:
      description: 'Server misconfiguration: no OAuth signing secret is configured.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2 bearer token (HS256-signed JWT) used to authenticate the caller.
      flows:
        clientCredentials:
          tokenUrl: https://issuer.example.com/oauth/token
          scopes: {}
