name: Minikube regression gate

on:
  pull_request:
    branches:
      - development
      - main
      - 'release/**'
  push:
    branches:
      - development
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: minikube-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minikube-regression:
    name: minikube-regression (${{ matrix.corpus }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - corpus: ubl21
            manifest: createsamples/samples/manifest.json
          - corpus: en16931
            manifest: createsamples/samples-en16931/manifest.json
    env:
      MINIKUBE_PROFILE: e-ubl21-regression
      MINIKUBE_DRIVER: docker
      MINIKUBE_VERSION: v1.38.1
      MINIKUBE_SHA256: 099477eaf248bcb5bcea8ce78a2898e93ac01461c35189da1848c3de82ecd22e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
      - name: Install Minikube
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo minikube https://storage.googleapis.com/minikube/releases/${MINIKUBE_VERSION}/minikube-linux-amd64
          echo "${MINIKUBE_SHA256}  minikube" | sha256sum -c -
          sudo install minikube /usr/local/bin/minikube
          minikube version
      - name: Run Minikube regression
        shell: bash
        run: |
          set -euo pipefail
          make regression-minikube CORPUS="${{ matrix.corpus }}" MANIFEST="${{ matrix.manifest }}"
      - name: Collect Minikube evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "regression-results/minikube/${{ matrix.corpus }}/evidence"
          minikube -p "${MINIKUBE_PROFILE}" status > "regression-results/minikube/${{ matrix.corpus }}/evidence/minikube-status.txt" 2>&1
          kubectl get all -A -o wide > "regression-results/minikube/${{ matrix.corpus }}/evidence/kubectl-get-all.txt" 2>&1
          kubectl get events -A --sort-by=.lastTimestamp > "regression-results/minikube/${{ matrix.corpus }}/evidence/kubectl-events.txt" 2>&1
          kubectl logs -n e-ubl21 -l app.kubernetes.io/part-of=e-ubl21 --all-containers=true --prefix=true > "regression-results/minikube/${{ matrix.corpus }}/evidence/workload-logs.txt" 2>&1
      - name: Upload Minikube regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minikube-regression-${{ matrix.corpus }}-${{ github.sha }}
          path: regression-results/minikube/${{ matrix.corpus }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup Minikube
        if: always()
        shell: bash
        run: minikube -p "${MINIKUBE_PROFILE}" delete || true
