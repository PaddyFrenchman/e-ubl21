name: EN 16931 validation gate

on:
  pull_request:
    branches:
      - development
      - main
      - 'release/**'
  push:
    branches:
      - development
      - main
      - 'release/**'

permissions:
  contents: read

jobs:
  validation-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Reproduce pinned Peppol Schematron XSLT
        run: make test-peppol-schematron
      - name: Run mandatory corpora and end-to-end compliance gate
        run: make test-en16931-compliance
      - name: Build and verify the production image offline
        run: make test-en16931-image IMAGE=e-ubl21:ci
